# 打 Mac 版。dmg 只能在 macOS 上打，所以放在 GitHub 的 Mac 机器上：Apple 芯片和 Intel 各一台，各打各的，
# 随包的 Node、FFmpeg 和几个原生模块都是 npm 按当前这台机器装的，不能在一台上打两种。
# 什么时候跑：推 v 开头的标签时；或者在 Actions 页上手动点（可以填一个已有 Release 的标签，打好的 dmg 传到那里）。
# 没有 Apple 开发者证书，应用只做了临时签名（package.json 的 build.mac.identity 是「-」），用户第一次打开要在系统设置里点「仍要打开」，见 README。
name: macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 打好的 dmg 传到哪个 Release（填标签，比如 v0.1.8）；留空只打包，在这次运行的 Artifacts 里下载
        required: false
        default: ''

permissions:
  contents: write

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: npm

      # 根目录的 npm ci 会接着装各个 core 的依赖（scripts/setup.mjs）。
      - name: Install
        run: npm ci

      - name: Typecheck and shell tests
        run: |
          npm run typecheck
          node --test desktop/*.test.mjs scripts/*.test.mjs

      # 全部测试里有一些是照 Windows 写的（读 Windows 版微信、钉钉的那些会自己跳过），先跑着看，不挡打包。
      - name: All tests
        continue-on-error: true
        run: npm run verify

      - name: Build dmg
        run: npm run installer:mac -- --${{ matrix.arch }}

      # 签名完整（临时签名也要验得过，不然系统说应用「已损坏」），然后挪到项目外面、换一份干净的数据，起一遍桌面程序。
      - name: Check the app
        run: |
          app=$(ls -d dist/mac*/CampusAgent.app | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto "$app" "$RUNNER_TEMP/CampusAgent.app"
          node scripts/smoke-packaged.cjs "$RUNNER_TEMP/CampusAgent.app"

      - uses: actions/upload-artifact@v5
        with:
          name: CampusAgent-mac-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

      # 推标签时传到同名的 Release，手动运行时传到填的那个；Release 要先建好（Windows 版发布时建的那一个），没有就只留在 Artifacts 里。
      - name: Upload to release
        if: github.ref_type == 'tag' || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg --clobber
          else
            echo "::notice::Release $TAG 还没有建，dmg 只在这次运行的 Artifacts 里。"
          fi
