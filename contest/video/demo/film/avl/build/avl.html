<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="film" content="../../contest/video/demo/film/avl">
<link rel="icon" href="data:,">
<title>AVL 树的四种旋转</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--page:#141413;--panel:#1C1B19;--line:#2E2C28;--text:#EDE9DD;--muted:#8F8C82;--clay:#D97757}
body{margin:0;background:var(--page);color:var(--text);font:15px/1.6 "Learn Sans","Inter","HarmonyOS Sans SC","PingFang SC","Noto Sans SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;letter-spacing:.03em}
button,input,a,select{-webkit-tap-highlight-color:transparent}button,select{font:inherit}button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--clay);outline-offset:4px}
.page{width:min(1500px,calc(100% - 64px));margin:26px auto 22px}
/* the picture is kept no taller than the window leaves it: 220px is the chapter column with its gap, 262px what stands above and below the picture */
@media(min-width:860px){.page{max-width:max(940px,calc(220px + (100svh - 262px)*16/9))}}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:0 0 20px}
.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.2em;margin-bottom:7px}
h1{font-size:24px;line-height:1.35;font-weight:600;margin:0;letter-spacing:.05em}
.edition{color:var(--muted);font-size:12px;white-space:nowrap;padding-bottom:4px}.edition i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--clay);margin:0 8px 1px 0}
/* the chapters stand in a column left of the picture, as tall as the player; more of them than fit scroll inside it */
.watch{display:grid;grid-template-columns:200px minmax(0,1fr);gap:0 20px}
.player{background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 24px 80px #0007}
.stage{position:relative;aspect-ratio:16/9;background:#F0EEE6}
canvas{width:100%;height:100%;display:block;cursor:pointer;position:relative;z-index:1}
/* a scene's own layer: a 1920×1080 box under the canvas, scaled with the picture by the player */
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;pointer-events:none;display:none}
.controls{padding:14px 22px 16px;background:var(--panel);border-top:1px solid var(--line)}
.timeline{height:18px;display:flex;align-items:center;margin-bottom:8px}
input[type=range]{width:100%;height:4px;margin:0;appearance:none;background:linear-gradient(to right,var(--clay) 0%,var(--clay) var(--p,0%),#3A3832 var(--p,0%),#3A3832 100%);border-radius:4px;cursor:pointer}
input[type=range]::-webkit-slider-thumb{appearance:none;width:13px;height:13px;border-radius:50%;background:#F3EFE4;box-shadow:0 0 0 4px #D9775722}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#F3EFE4}
.control-row{display:flex;align-items:center;gap:15px;min-height:34px}
.play{display:flex;align-items:center;gap:9px;min-width:74px;justify-content:center;color:#FBF8F1;background:#3A2A23;border:1px solid #6B4534;border-radius:7px;padding:5px 12px;font-size:13px}
.play:hover{background:#4A342A}
.play svg{width:13px;height:13px;fill:currentColor}.play .pause-icon{display:none}.play[aria-pressed=true] .play-icon{display:none}.play[aria-pressed=true] .pause-icon{display:block}
.quiet{border:0;background:none;padding:5px 4px;color:#A29F94;font-size:12px;white-space:nowrap}.quiet:hover{color:#fff}.quiet[aria-pressed=true]{color:var(--clay)}
.clock{font-size:12px;line-height:1.2;letter-spacing:.03em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}.clock b{color:#E8E4D8;font-weight:400}
.spacer{flex:1}.speed{background:#22211E;border:1px solid #3A3832;border-radius:5px;color:#B8B4A8;font-size:12px;padding:3px 6px}
/* contain:size keeps a long list from making the row taller than the player. The rows are flat and answer with a fill; their left edge is the title's */
.chapters{contain:size;margin-left:-10px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3A3832 transparent}
.chapter{display:grid;grid-template-columns:auto 1fr;gap:0 12px;width:100%;margin-bottom:1px;padding:7px 10px 8px;background:none;color:#858278;border:0;border-radius:8px;text-align:left;font-size:13px;line-height:22px;transition:background .15s,color .15s}
.chapter span{font-size:12px;font-variant-numeric:tabular-nums;color:#5F5D55}
.chapter:hover{background:#1C1B19;color:#E6E2D6}
.chapter[aria-current=true]{background:#24231F;color:#F1EDE1}.chapter[aria-current=true] span{color:var(--clay)}
footer{display:flex;justify-content:space-between;align-items:flex-start;gap:28px;margin-top:16px;font-size:11px;line-height:1.75;color:#77746B}
footer a{color:#B0ADA2;text-decoration:none}footer a:hover{text-decoration:underline;color:#E6E2D6}.keys{white-space:nowrap}kbd{font-family:inherit;color:#A29F94}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* html.full — the picture alone, set by the player for 网页全屏 (it fills the window the film is in) and for 全屏 (the whole screen as well).
   The controls lie over the picture's bottom edge, where the captions are, so they are away unless the pointer comes down to them (.near);
   a pointer left alone is put away too (.still). The colours are written out: the reader app turns the film light, but not this */
.full,.full body{overflow:hidden}
.full .player{position:fixed;inset:0;z-index:10;border:0;border-radius:0;box-shadow:none;background:#141413}
.full .stage{height:100%;aspect-ratio:auto}
.full .controls{position:absolute;left:0;right:0;bottom:0;z-index:2;background:rgba(28,27,25,.94);border-top:1px solid #2E2C28;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.full.near .controls{opacity:1;visibility:visible}
.full.still .player,.full.still canvas{cursor:none}
/* ?bare=1 — canvas only, for frame capture */
.bare header,.bare footer,.bare .chapters,.bare .controls{display:none}
.bare .page{width:100vw;max-width:none;margin:0}.bare .watch{display:block}.bare .player{border:0;border-radius:0;height:100vh;box-shadow:none}.bare .stage{aspect-ratio:auto;height:100vh;background:#141413;overflow:hidden}
/* a window too narrow to give the chapters a column: they go under the picture, in a strip that scrolls sideways */
@media(max-width:859px){
.watch{display:flex;flex-direction:column}
.chapters{contain:none;order:1;display:flex;align-items:stretch;flex-shrink:0;margin:16px 0 0;overflow-x:auto;overflow-y:hidden;border-bottom:1px solid var(--line)}
.chapter{display:block;flex:1;width:auto;min-width:max-content;margin:0;padding:9px 12px 12px;border-bottom:2px solid transparent;border-radius:0;font-size:12px;line-height:1.6}
.chapter span{display:block;font-size:10px;margin-bottom:3px}
.chapter:hover,.chapter[aria-current=true]{background:none}.chapter[aria-current=true]{border-color:var(--clay)}
}
@media(max-width:720px){.page{width:calc(100% - 24px);margin:18px auto}header{margin-bottom:14px;gap:12px}h1{font-size:20px}.edition{display:none}.controls{padding:10px 14px 12px}.control-row{gap:10px}#wide{display:none}footer{display:block}.keys{margin-top:8px;white-space:normal}.player{border-radius:8px}}
</style>
</head>
<body>
<main class="page">
  <header>
    <div><div class="eyebrow">数据结构基础 · 第 5 次课</div><h1>AVL 树的四种旋转</h1></div>
    <div class="edition"><i></i>中文字幕 · <span id="total">00:00</span></div>
  </header>
  <div class="watch">
  <nav class="chapters" id="chapters" aria-label="跳转到章节"></nav>
  <section class="player" id="player" aria-label="动画播放器">
    <div class="stage" id="stage"><canvas id="film" role="img" aria-label="动画画面"></canvas></div>
    <div class="controls">
      <div class="timeline"><label class="sr-only" for="seek">播放进度，秒</label><input id="seek" type="range" min="0" max="100" step="0.01" value="0"></div>
      <div class="control-row">
        <button id="play" class="play" type="button" aria-label="播放" aria-pressed="false"><svg class="play-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2 14 8 4 14Z"/></svg><svg class="pause-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h3v12H3zm7 0h3v12h-3z"/></svg><span id="play-label">播放</span></button>
        <button class="quiet" id="replay" type="button">重播</button>
        <div class="clock"><b id="elapsed">00:00</b></div>
        <div class="spacer"></div>
        <label class="sr-only" for="speed">播放速度</label><select class="speed" id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
        <button class="quiet" id="captions" type="button" aria-pressed="true">字幕</button>
        <button class="quiet" id="wide" type="button" aria-pressed="false">网页全屏</button>
        <button class="quiet" id="fullscreen" type="button" aria-pressed="false">全屏</button>
      </div>
    </div>
  </section>
  </div>
  <footer>
    <div>根据智云回放和课件整理</div>
    <div class="keys"><kbd>空格</kbd> 播放 / 暂停　<kbd>← →</kbd> 前后 5 秒　<kbd>F</kbd> 全屏　<kbd>W</kbd> 网页全屏　<kbd>C</kbd> 字幕</div>
  </footer>
</main>
<script>
'use strict';

    anthropic: {
      bg: '#F0EEE6', paper: '#FAF9F5', ink: '#1F1E1D', mute: '#6B6A64', faint: '#A8A599', hair: '#D6D2C4',
      accent: '#D97757', accentDeep: '#B5583A', good: '#788C5D', bad: '#B5583A', wash: '#E3DACC',
      cat: ['#D97757', '#5B8FC4', '#788C5D', '#C46686', '#C7963A'],
    },
    keynote: {
      bg: '#FFFFFF', paper: '#F5F5F7', ink: '#1D1D1F', mute: '#6E6E73', faint: '#A1A1A6', hair: '#D2D2D7',
      accent: '#0071E3', accentDeep: '#0058B0', good: '#1F9D4C', bad: '#E8352B', wash: '#E8E8ED',

  const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; };
  const rgba = (h, a = 1) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };
  const mixc = (h1, h2, p) => { const a = hex(h1), b = hex(h2); p = clamp(p); return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], p))).join(',')})`; };

  function alpha(a, fn) { if (a <= 0.003) return; ctx.save(); ctx.globalAlpha *= clamp(a); fn(); ctx.restore(); }

    ctx.save(); ctx.globalAlpha *= clamp(a); ctx.font = fontOf(o); ctx.fillStyle = o.color || C.ink;

    if (o.halo) { ctx.lineWidth = o.halo; ctx.strokeStyle = o.haloColor || C.bg; ctx.lineJoin = 'round'; }
    let w;
    if (ismath(str, o)) {
      const dy = mdrop(), L = mline(str, o), x0 = x - (o.align === 'left' ? 0 : o.align === 'right' ? L.w : L.w / 2);
      if (o.halo) L.f(x0, y + dy, true);

  function measure(str, o = {}) { ctx.save(); ctx.font = fontOf(o); if (o.ls) ctx.letterSpacing = o.ls + 'px'; const w = ismath(str, o) ? mline(str, o).w : ctx.measureText(str).width; ctx.restore(); return w; }

  function extent(str, o = {}) {
    ctx.save(); ctx.font = fontOf(o); ctx.textBaseline = o.baseline || 'middle'; if (o.ls) ctx.letterSpacing = o.ls + 'px';
    let r;
    if (ismath(str, o)) { const dy = mdrop(), L = mline(str, o); r = { w: L.w, up: L.a - dy, down: L.d + dy }; }
    else { const m = ctx.measureText(str); r = { w: m.width, up: m.actualBoundingBoxAscent, down: m.actualBoundingBoxDescent }; }
    ctx.restore(); return r;

  /* Rich text: runs = [{t, color, font, italic, weight, sub, sup, bg, size}] laid out on one line. */
  function rich(runs, x, y, o = {}) {
    const a = o.alpha === undefined ? 1 : o.alpha; if (a <= 0.003) return 0;

    const p = o.p === undefined ? 1 : clamp(o.p); if (p <= 0) return;
    ctx.save(); if (o.alpha !== undefined) ctx.globalAlpha *= clamp(o.alpha);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(lerp(x1, x2, p), lerp(y1, y2, p));
    ctx.strokeStyle = o.color || C.ink; ctx.lineWidth = o.w || 2; ctx.lineCap = o.cap || 'round'; if (o.dash) ctx.setLineDash(o.dash); ctx.stroke(); ctx.restore();

    const p = o.p === undefined ? 1 : clamp(o.p); if (p <= 0.001) return;

    if (r <= 0) return; ctx.save(); if (o.alpha !== undefined) ctx.globalAlpha *= clamp(o.alpha);

    ctx.save(); if (o.alpha !== undefined) ctx.globalAlpha *= clamp(o.alpha);
    ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));

    ctx.restore();

  /* Polyline with optional partial reveal p in [0,1] measured along its length. */
  function poly(pts, o = {}) {
    if (pts.length < 2) return; const p = o.p === undefined ? 1 : clamp(o.p); if (p <= 0) return;
    ctx.save(); if (o.alpha !== undefined) ctx.globalAlpha *= clamp(o.alpha);
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    if (p >= 1) { for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); if (o.close) ctx.closePath(); }
    else {

    }
    if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); }
    if (o.color !== null) { ctx.strokeStyle = o.color || C.ink; ctx.lineWidth = o.w || 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; if (o.dash) ctx.setLineDash(o.dash); ctx.stroke(); }
    ctx.restore();
  }
  const bezPt = (a, b, c, d, u) => { const v = 1 - u; return [v * v * v * a[0] + 3 * v * v * u * b[0] + 3 * v * u * u * c[0] + u * u * u * d[0], v * v * v * a[1] + 3 * v * v * u * b[1] + 3 * v * u * u * c[1] + u * u * u * d[1]]; };
