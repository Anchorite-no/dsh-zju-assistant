<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园智能体宣传片</title>
<style>
:root {
  --bg: #07090f; --ink: #f4f6fb; --mute: #8c93a8; --faint: #4a5066;
  --accent: #4d6bfe; --accent2: #8aa0ff; --orange: #f0700f; --green: #1da86a; --violet: #7d5bd6; --red: #f04848;
  --sans: "HarmonyOS Sans SC", "Inter", "Noto Sans SC", "Microsoft YaHei UI", system-ui, sans-serif;
  --num: "Inter", "HarmonyOS Sans SC", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { color: var(--ink); font-family: var(--sans); }
#viewport { position: absolute; inset: 0 0 56px 0; display: grid; place-items: center; }
body.render #viewport { inset: 0; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); transform-origin: 50% 50%; flex: none; }

/* 背景：底色、两团慢慢移动的光、点阵、暗角 */
#bg { position: absolute; inset: 0; }
.glow { position: absolute; width: 1600px; height: 1600px; border-radius: 50%; opacity: .55; }
#glowA { left: -400px; top: -600px; background: radial-gradient(circle, rgba(42,60,255,.85) 0%, rgba(42,60,255,.35) 30%, transparent 66%); }
#glowB { right: -520px; bottom: -720px; background: radial-gradient(circle, rgba(106,43,214,.85) 0%, rgba(106,43,214,.3) 30%, transparent 66%); opacity: .4; }
#dots { position: absolute; inset: -80px; background-image: radial-gradient(rgba(255,255,255,.09) 1.2px, transparent 1.6px); background-size: 40px 40px; }
#vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.6) 100%); pointer-events: none; }

#world { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; visibility: hidden; }

/* 通用文字 */
.kicker { position: absolute; font-size: 30px; letter-spacing: .3em; color: var(--mute); font-weight: 500; white-space: nowrap; }
.headline { position: absolute; font-weight: 700; white-space: nowrap; line-height: 1.15; }
.ch { display: inline-block; will-change: transform; }
.mask { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .04em .08em; }
.hl { color: var(--accent2); }

/* 渠道小卡片 */
.chip { position: absolute; display: flex; align-items: center; gap: 14px; padding: 16px 26px 16px 20px; border-radius: 18px;
  background: rgba(22,26,38,.82); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 18px 40px rgba(0,0,0,.45);
  font-size: 30px; font-weight: 500; white-space: nowrap; }
.chip i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: 0 0 14px var(--c); flex: none; }
.chip b { position: absolute; right: -12px; top: -12px; min-width: 34px; height: 34px; padding: 0 9px; border-radius: 17px; background: var(--red);
  font: 700 20px/34px var(--num); text-align: center; box-shadow: 0 4px 12px rgba(240,72,72,.5); }
.toast { position: absolute; width: 470px; padding: 20px 24px; border-radius: 20px; background: rgba(245,247,252,.96); color: #16181f;
  box-shadow: 0 24px 60px rgba(0,0,0,.5); }
.toast small { display: flex; align-items: center; gap: 10px; font-size: 20px; color: #6b7083; font-weight: 500; }
.toast small i { width: 26px; height: 26px; border-radius: 7px; background: var(--c); }
.toast div { margin-top: 8px; font-size: 26px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 截图做的「设备」 */
.cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.tilt { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
.device { position: absolute; left: 0; top: 0; border-radius: 22px; overflow: hidden; background: #fff;
  box-shadow: 0 0 0 1.5px rgba(255,255,255,.14), 0 60px 140px rgba(0,0,0,.6), 0 20px 50px rgba(0,0,0,.4); }
.device > img { display: block; width: 100%; height: 100%; }
.device svg { position: absolute; inset: 0; overflow: visible; z-index: 3; }
.hole { z-index: 1; } .bar { z-index: 2; } .ping { z-index: 4; } .piece { z-index: 5; }
.hole { position: absolute; border-radius: 14px; box-shadow: 0 0 0 4000px rgba(6,8,14,0); }
.bar { position: absolute; border-radius: 10px; background: rgba(77,107,254,.14); box-shadow: inset 4px 0 0 var(--accent); opacity: 0; }
.piece { position: absolute; border-radius: 14px; background-repeat: no-repeat; opacity: 0;
  box-shadow: 0 0 0 2px var(--accent), 0 30px 70px rgba(10,20,80,.45); }
.ping { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 4px solid var(--accent); opacity: 0; }

/* 章节标签 */
.chapter { position: absolute; z-index: 10; left: 110px; top: 84px; display: flex; align-items: baseline; gap: 22px; }
.chapter em { font: 700 30px var(--num); font-style: normal; color: var(--accent2); letter-spacing: .05em; }
.chapter span { font-size: 34px; font-weight: 700; letter-spacing: .08em; }
.chapter hr { position: absolute; left: 0; top: 58px; width: 340px; height: 3px; margin: 0; border: 0; background: linear-gradient(90deg, var(--accent), transparent); transform-origin: 0 0; }

/* 讲述文字 */
.say { position: absolute; font-size: 40px; font-weight: 500; line-height: 1.5; color: #dfe3ee; white-space: nowrap; }
.say b { color: #fff; font-weight: 700; }
.list { position: absolute; display: grid; gap: 26px; }
.list > div { display: flex; align-items: center; gap: 22px; font-size: 38px; font-weight: 500; white-space: nowrap; }
.list > div i { width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 22%, transparent);
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 70%, transparent); font: 700 22px var(--num); font-style: normal; color: #fff; }
.label { position: absolute; padding: 18px 26px; border-radius: 16px; background: var(--accent); color: #fff; font-size: 32px; font-weight: 700; white-space: nowrap;
  box-shadow: 0 20px 50px rgba(77,107,254,.45); }
.label small { display: block; margin-top: 4px; font-size: 22px; font-weight: 500; opacity: .85; }
.scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7,9,15,.92) 0%, rgba(7,9,15,.75) 30%, rgba(7,9,15,0) 50%); opacity: 0; }
.overlay-svg { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }

/* 统计格子 */
.cell { position: absolute; width: 56px; height: 56px; border-radius: 14px; background: var(--accent); box-shadow: 0 0 22px rgba(77,107,254,.55); }
.cell::before, .cell::after { content: ''; position: absolute; left: 12px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.75); }
.cell::before { top: 17px; width: 32px; }
.cell::after { top: 31px; width: 20px; opacity: .6; }
.beam { position: absolute; width: 6px; border-radius: 3px; background: #fff; box-shadow: 0 0 30px 10px rgba(138,160,255,.7), 0 0 80px 30px rgba(77,107,254,.35); }
.big { position: absolute; font: 800 150px/1 var(--num); letter-spacing: -.02em; }
.unit { font: 700 40px var(--sans); margin-left: 10px; letter-spacing: 0; }
.cap { position: absolute; font-size: 32px; color: var(--mute); font-weight: 500; white-space: nowrap; }

.ring { position: absolute; border-radius: 50%; border: 4px solid var(--accent2); }
.flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(160,180,255,.9), rgba(77,107,254,.25) 30%, transparent 60%); opacity: 0; }
.pills { position: absolute; display: flex; gap: 16px; }
.pill { padding: 14px 24px; border-radius: 40px; border: 1.5px solid rgba(138,160,255,.45); background: rgba(77,107,254,.12); font-size: 28px; font-weight: 500; white-space: nowrap; }
.pill b { font: 800 34px var(--num); color: #fff; margin-right: 8px; }

/* 预览用的控制条，渲染时不出现 */
#bar { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 18px; background: #111; color: #ccc; font: 14px/1 var(--num); }
#bar button { width: 72px; height: 34px; border: 0; border-radius: 6px; background: #2a2f3c; color: #fff; font: inherit; cursor: pointer; }
#bar input { flex: 1; }
#bar output { width: 120px; text-align: right; font-variant-numeric: tabular-nums; }
body.render #bar { display: none; }
/* 渲染时画面下面多出 2 像素写帧号，用来确认截到的是这一帧，编码时裁掉 */
body.render #viewport { inset: 0 0 2px 0; }
#marker { position: fixed; left: 0; bottom: 0; width: 16px; height: 2px; display: none; }
body.render #marker { display: block; }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="bg"><div class="glow" id="glowA"></div><div class="glow" id="glowB"></div><div id="dots"></div></div>
    <div id="world"></div>
    <div class="flash" id="flash"></div>
    <div id="vignette"></div>
  </div>
</div>
<div id="marker"></div>
<div id="bar"><button id="play">播放</button><input id="seek" type="range" min="0" max="1" step="0.001" value="0"><output id="clock">0.00</output></div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/CustomEase.min.js"></script>
<script>
'use strict';
gsap.registerPlugin(CustomEase);
CustomEase.create('snap', 'M0,0 C0.12,0.9 0.22,1 1,1');      // 快进慢停，AE 里常用的那种
CustomEase.create('whip', 'M0,0 C0.7,0 0.2,1 1,1');
const W = 1920, H = 1080;
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');

// ---------- 小工具 ----------
function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261021);
const rand = (a, b) => a + (b - a) * R();
function el(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
function svgEl(tag, attrs, parent) { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
const world = document.getElementById('world');
function scene(id) { const s = el('section', 'scene', world); s.id = id; return s; }
// 一行大字拆成单字，每个字包在遮罩里，从下面顶上来
function chars(parent, text, cls, style) {
  const h = el('div', cls, parent); Object.assign(h.style, style || {});
  for (const part of text.split(/(\{[^}]*\})/)) {
    const hot = part.startsWith('{'); const str = hot ? part.slice(1, -1) : part;
    for (const c of str) { const m = el('span', 'mask', h); const s = el('span', 'ch' + (hot ? ' hl' : ''), m, c === ' ' ? '&nbsp;' : c); }
  }
  return h;
}
const charsOf = h => h.querySelectorAll('.ch');
function reveal(tl, h, at, o = {}) { return tl.fromTo(charsOf(h), { yPercent: 110, rotation: o.rot ?? 8 }, { yPercent: 0, rotation: 0, duration: o.dur ?? .7, ease: 'snap', stagger: o.stagger ?? .035 }, at); }
function conceal(tl, h, at, o = {}) { return tl.to(charsOf(h), { yPercent: -110, duration: o.dur ?? .45, ease: 'power3.in', stagger: o.stagger ?? .02 }, at); }

// 截图做成的设备：cam 管平移缩放（像摄像机），tilt 管 3D 倾斜，device 里放截图和叠在截图上的东西（用截图的像素坐标）
function device(parent, src, w, h) {
  const cam = el('div', 'cam', parent); cam.style.width = w + 'px'; cam.style.height = h + 'px';
  const tilt = el('div', 'tilt', cam); tilt.style.width = w + 'px'; tilt.style.height = h + 'px';
  const dev = el('div', 'device', tilt); dev.style.width = w + 'px'; dev.style.height = h + 'px';
  const img = el('img', null, dev); img.src = src;
  const svg = svgEl('svg', { viewBox: `0 0 ${w} ${h}`, width: w, height: h }, dev);
  gsap.set(tilt, { transformPerspective: 2400, transformOrigin: '50% 50%' });
  return { cam, tilt, dev, svg, src, w, h };
}
// 让截图里的 rect 落在舞台的 (cx, cy)，宽度为 width（或高度为 height）
function frame(d, rect, { cx = W / 2, cy = H / 2, width, height }) {
  const k = width ? width / rect.w : height / rect.h;
  return { x: cx - k * (rect.x + rect.w / 2), y: cy - k * (rect.y + rect.h / 2), scale: k };
}
const whole = d => ({ x: 0, y: 0, w: d.w, h: d.h });
const toStage = (f, p) => ({ x: f.x + f.scale * p.x, y: f.y + f.scale * p.y });
function roundRectPath(r, rad) {
  const { x, y, w, h } = r, q = Math.min(rad, w / 2, h / 2);
  return `M${x + w / 2},${y} H${x + w - q} Q${x + w},${y} ${x + w},${y + q} V${y + h - q} Q${x + w},${y + h} ${x + w - q},${y + h} H${x + q} Q${x},${y + h} ${x},${y + h - q} V${y + q} Q${x},${y} ${x + q},${y} Z`;
}
// 在截图上画一圈会「描出来」的框
function ring(d, rect, { color = '#4d6bfe', width = 5, radius = 14 } = {}) {
  const p = svgEl('path', { d: roundRectPath(rect, radius), fill: 'none', stroke: color, 'stroke-width': width, 'stroke-linecap': 'round', pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1 }, d.svg);
  p.style.filter = `drop-shadow(0 0 10px ${color})`;
  return p;
}
function hole(d, rect, radius = 14) { const h = el('div', 'hole', d.dev); Object.assign(h.style, { left: rect.x + 'px', top: rect.y + 'px', width: rect.w + 'px', height: rect.h + 'px', borderRadius: radius + 'px' }); return h; }
const dim = (tl, h, at, a = .62, dur = .6) => tl.to(h, { boxShadow: `0 0 0 4000px rgba(6,8,14,${a})`, duration: dur, ease: 'power2.inOut' }, at);
// 把截图里的一块「抠」出来，浮起来
function piece(d, rect) {
  const p = el('div', 'piece', d.dev);
  Object.assign(p.style, { left: rect.x + 'px', top: rect.y + 'px', width: rect.w + 'px', height: rect.h + 'px', backgroundImage: `url(${d.src})`, backgroundSize: `${d.w}px ${d.h}px`, backgroundPosition: `${-rect.x}px ${-rect.y}px`, backgroundColor: '#fff' });
  gsap.set(p, { transformPerspective: 1600 });
  return p;
}
function chapter(parent, num, title) {
  const c = el('div', 'chapter', parent, `<em>${num}</em><span>${title}</span><hr>`);
  return c;
}
function chapterIn(tl, c, at) {
  tl.fromTo(c.querySelector('em'), { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: .5, ease: 'snap' }, at)
    .fromTo(c.querySelector('span'), { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: .6, ease: 'snap' }, at + .08)
    .fromTo(c.querySelector('hr'), { scaleX: 0 }, { scaleX: 1, duration: .8, ease: 'snap' }, at + .1);
}
function chapterOut(tl, c, at) { tl.to(c, { opacity: 0, x: -40, duration: .4, ease: 'power2.in' }, at); }
// 舞台上的一条引线：从 a 折到 b
function leader(svg, a, b, color = '#8aa0ff') {
  const mid = { x: b.x, y: a.y };
  const p = svgEl('path', { d: `M${a.x},${a.y} L${mid.x},${mid.y} L${b.x},${b.y}`, fill: 'none', stroke: color, 'stroke-width': 3, pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1 }, svg);
  const dot = svgEl('circle', { cx: a.x, cy: a.y, r: 8, fill: color }, svg);
  return { p, dot };
}
function count(tl, node, from, to, at, dur = 1.2, ease = 'power2.out') {
  tl.fromTo(node, { innerText: from }, { innerText: to, snap: { innerText: 1 }, duration: dur, ease }, at);
}
function show(tl, s, at) { tl.set(s, { visibility: 'visible' }, at); }
function hide(tl, s, at) { tl.set(s, { visibility: 'hidden' }, at); }

const tl = gsap.timeline({ paused: true });

// ---------- 背景：整片慢慢漂 ----------
// （时长在最后补齐）

// =====================================================================
// 场景 1　信息从十几个地方涌来（0 – 8.8）
// =====================================================================
{
  const s = scene('chaos'); show(tl, s, 0);
  const field = el('div', null, s); Object.assign(field.style, { position: 'absolute', inset: 0 });
  const kick = el('div', 'kicker', s, '一名浙大学生的一天'); Object.assign(kick.style, { left: '50%', top: '392px', transform: 'translateX(-50%)' });
  const h1 = chars(s, '信息从{十几个地方}涌来', 'headline', { fontSize: '108px', left: '50%', top: '450px', transform: 'translateX(-50%)' });
  const h2 = chars(s, '同一门课，散在{四五处}', 'headline', { fontSize: '108px', left: '50%', top: '450px', transform: 'translateX(-50%)' });
  gsap.set(charsOf(h2), { yPercent: 110 });

  tl.fromTo(kick, { opacity: 0, y: 20, letterSpacing: '.6em' }, { opacity: 1, y: 0, letterSpacing: '.3em', duration: .9, ease: 'snap' }, .2);
  reveal(tl, h1, .55);

  const SYS = '#4d6bfe', SITE = '#7d5bd6', CHAT = '#1da86a', MP = '#f0700f';
  const chipsData = [
    ['教务网', SYS], ['学在浙大', SYS], ['智云课堂', SYS], ['学习通', SYS], ['PTA', SYS], ['浙大邮箱', SYS], ['CC98', SYS], ['素质拓展平台', SYS],
    ['体艺场馆', SYS], ['中国知网', SYS], ['实验课平台', SYS], ['图书馆', SYS], ['学工部', SITE], ['研工部', SITE], ['团委', SITE], ['综合服务网', SITE],
    ['本科生院', SITE], ['计算机学院', SITE], ['课程钉钉群', CHAT], ['班级微信群', CHAT], ['社团群', CHAT], ['公众号', MP], ['二课活动', MP], ['学院公众号', MP],
  ];
  const toastsData = [
    ['学在浙大', SYS, 'HW3 链表与栈 · 明天 17:41 截止'], ['钉钉 · 大学物理课程群', CHAT, '第三次作业延后两天'], ['教务网', SYS, '第三轮选课工作的通知'],
    ['微信 · 班级群', CHAT, '@所有人 周五找辅导员签字'], ['PTA', SYS, 'Lab 2 链表操作 · 答了 3/10 题'], ['学工部', SITE, '学生体质健康测试的通知'],
    ['智云课堂', SYS, '第 7 次课 · 录播已上线'], ['浙大邮箱', SYS, '[实验三] 提交说明有更新'],
  ];
  // 随机落点，避开中间那行大字
  const placed = [];
  function spot(w, h) {
    for (let i = 0; i < 400; i++) {
      const x = rand(60, W - 60 - w), y = rand(60, H - 60 - h);
      const cxs = x + w / 2, cys = y + h / 2;
      if (cxs > 330 && cxs < 1590 && cys > 340 && cys < 660) continue;
      if (placed.some(p => x < p.x + p.w + 20 && x + w + 20 > p.x && y < p.y + p.h + 14 && y + h + 14 > p.y) && i < 380) continue;
      placed.push({ x, y, w, h }); return { x, y };
    }
  }
  const items = [];
  chipsData.forEach(([name, c], i) => {
    const e = el('div', 'chip', field, `<i></i>${name}<b>${1 + Math.floor(rand(1, 30))}</b>`); e.style.setProperty('--c', c);
    const w = 70 + name.length * 31, p = spot(w, 66); Object.assign(e.style, { left: p.x + 'px', top: p.y + 'px' });
    items.push({ e, x: p.x + w / 2, y: p.y + 33, at: 1.5 + i * .11 });
  });
  toastsData.forEach(([src, c, text], i) => {
    const e = el('div', 'toast', field, `<small><i></i>${src}</small><div>${text}</div>`); e.style.setProperty('--c', c);
    const p = spot(470, 104); Object.assign(e.style, { left: p.x + 'px', top: p.y + 'px' });
    items.push({ e, x: p.x + 235, y: p.y + 52, at: 2.6 + i * .32, toast: true });
  });
  for (const it of items) {
    const r0 = rand(-9, 9);
    tl.fromTo(it.e, { scale: 0, opacity: 0, rotation: r0 * 3 }, { scale: 1, opacity: 1, rotation: r0 * .4, duration: .55, ease: 'back.out(2.2)' }, it.at);
    tl.to(it.e, { y: rand(-26, 26), x: rand(-18, 18), duration: 7.55 - it.at, ease: 'none' }, it.at);
    const badge = it.e.querySelector('b');
    if (badge) tl.fromTo(badge, { scale: 0 }, { scale: 1, duration: .35, ease: 'back.out(3)' }, it.at + .25);
  }
  // 换一句
  conceal(tl, h1, 5.0);
  tl.to(kick, { opacity: 0, duration: .3 }, 5.0);
  reveal(tl, h2, 5.35);
  // 镜头抖一下：信息太多了
  const shake = [];
  for (let i = 0; i < 14; i++) shake.push({ x: rand(-7, 7), y: rand(-5, 5), duration: .05 });
  shake.push({ x: 0, y: 0, duration: .08 });
  tl.to(field, { keyframes: shake }, 6.5);
  tl.to(field, { scale: 1.06, duration: 2, ease: 'power1.in', transformOrigin: '50% 50%' }, 6.2);
  // 全部吸进中心
  const t0 = 7.6;
  items.forEach((it, i) => {

// ---------- 播放与渲染接口 ----------
const stage = document.getElementById('stage');
function fit() {
  if (RENDER) { stage.style.transform = 'none'; return; }
  const vp = document.getElementById('viewport');
  stage.style.transform = `scale(${Math.min(vp.clientWidth / W, vp.clientHeight / H)})`;
}
addEventListener('resize', fit); fit();

const imgs = [...document.images];
const marker = document.getElementById('marker');
window.__ready = Promise.all([document.fonts.ready, ...imgs.map(i => i.decode().catch(() => {}))]);
const raf2 = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
window.__video = {
  duration: DURATION,
  async seek(t, f = 0) { tl.seek(t, false); marker.style.background = `rgb(${f & 255},${f >> 8 & 255},0)`; await raf2(); return t; },
};

if (!RENDER) {
  const play = document.getElementById('play'), seek = document.getElementById('seek'), clock = document.getElementById('clock');
  seek.max = DURATION;
  const sync = () => { seek.value = tl.time(); clock.textContent = tl.time().toFixed(2) + ' / ' + DURATION; play.textContent = tl.isActive() ? '暂停' : '播放'; };
  tl.eventCallback('onUpdate', sync);
  const toggle = () => { if (tl.isActive()) tl.pause(); else { if (tl.time() >= DURATION - .01) tl.seek(0); tl.play(); } sync(); };
  play.onclick = toggle;
  seek.oninput = () => { tl.pause(); tl.seek(+seek.value, false); sync(); };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } if (e.key === 'ArrowLeft') { tl.seek(Math.max(0, tl.time() - 1), false); sync(); } if (e.key === 'ArrowRight') { tl.seek(tl.time() + 1, false); sync(); } });
  const t = +new URLSearchParams(location.search).get('t') || 0;
  window.__ready.then(() => { tl.seek(t, false); sync(); if (!new URLSearchParams(location.search).has('paused')) tl.play(); sync(); });
}
