<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="film" content="lessons/ADS-L01-AVL/film">
<link rel="icon" href="data:,">
<title>AVL 树的四种旋转</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--page:#141413;--panel:#1C1B19;--line:#2E2C28;--text:#EDE9DD;--muted:#8F8C82;--clay:#D97757}
body{margin:0;background:var(--page);color:var(--text);font:15px/1.6 "Learn Sans","Inter","HarmonyOS Sans SC","PingFang SC","Noto Sans SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;letter-spacing:.03em}
button,input,a,select{-webkit-tap-highlight-color:transparent}button,select{font:inherit}button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--clay);outline-offset:4px}
.page{width:min(1500px,calc(100% - 64px));margin:26px auto 22px}
/* the picture is kept no taller than the window leaves it: 220px is the chapter column with its gap, 262px what stands above and below the picture */
@media(min-width:860px){.page{max-width:max(940px,calc(220px + (100svh - 262px)*16/9))}}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:0 0 20px}
.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.2em;margin-bottom:7px}
h1{font-size:24px;line-height:1.35;font-weight:600;margin:0;letter-spacing:.05em}
.edition{color:var(--muted);font-size:12px;white-space:nowrap;padding-bottom:4px}.edition i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--clay);margin:0 8px 1px 0}
/* the chapters stand in a column left of the picture, as tall as the player; more of them than fit scroll inside it */
.watch{display:grid;grid-template-columns:200px minmax(0,1fr);gap:0 20px}
.player{background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 24px 80px #0007}
.stage{position:relative;aspect-ratio:16/9;background:#F0EEE6}
canvas{width:100%;height:100%;display:block;cursor:pointer;position:relative;z-index:1}
/* a scene's own layer: a 1920×1080 box under the canvas, scaled with the picture by the player */
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;pointer-events:none;display:none}
.controls{padding:14px 22px 16px;background:var(--panel);border-top:1px solid var(--line)}
.timeline{height:18px;display:flex;align-items:center;margin-bottom:8px}
input[type=range]{width:100%;height:4px;margin:0;appearance:none;background:linear-gradient(to right,var(--clay) 0%,var(--clay) var(--p,0%),#3A3832 var(--p,0%),#3A3832 100%);border-radius:4px;cursor:pointer}
input[type=range]::-webkit-slider-thumb{appearance:none;width:13px;height:13px;border-radius:50%;background:#F3EFE4;box-shadow:0 0 0 4px #D9775722}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#F3EFE4}
.control-row{display:flex;align-items:center;gap:15px;min-height:34px}
.play{display:flex;align-items:center;gap:9px;min-width:74px;justify-content:center;color:#FBF8F1;background:#3A2A23;border:1px solid #6B4534;border-radius:7px;padding:5px 12px;font-size:13px}
.play:hover{background:#4A342A}
.play svg{width:13px;height:13px;fill:currentColor}.play .pause-icon{display:none}.play[aria-pressed=true] .play-icon{display:none}.play[aria-pressed=true] .pause-icon{display:block}
.quiet{border:0;background:none;padding:5px 4px;color:#A29F94;font-size:12px;white-space:nowrap}.quiet:hover{color:#fff}.quiet[aria-pressed=true]{color:var(--clay)}
.clock{font-size:12px;line-height:1.2;letter-spacing:.03em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}.clock b{color:#E8E4D8;font-weight:400}
.spacer{flex:1}.speed{background:#22211E;border:1px solid #3A3832;border-radius:5px;color:#B8B4A8;font-size:12px;padding:3px 6px}
/* contain:size keeps a long list from making the row taller than the player. The rows are flat and answer with a fill; their left edge is the title's */
.chapters{contain:size;margin-left:-10px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3A3832 transparent}
.chapter{display:grid;grid-template-columns:auto 1fr;gap:0 12px;width:100%;margin-bottom:1px;padding:7px 10px 8px;background:none;color:#858278;border:0;border-radius:8px;text-align:left;font-size:13px;line-height:22px;transition:background .15s,color .15s}
.chapter span{font-size:12px;font-variant-numeric:tabular-nums;color:#5F5D55}
.chapter:hover{background:#1C1B19;color:#E6E2D6}
.chapter[aria-current=true]{background:#24231F;color:#F1EDE1}.chapter[aria-current=true] span{color:var(--clay)}
footer{display:flex;justify-content:space-between;align-items:flex-start;gap:28px;margin-top:16px;font-size:11px;line-height:1.75;color:#77746B}
footer a{color:#B0ADA2;text-decoration:none}footer a:hover{text-decoration:underline;color:#E6E2D6}.keys{white-space:nowrap}kbd{font-family:inherit;color:#A29F94}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* html.full — the picture alone, set by the player for 网页全屏 (it fills the window the film is in) and for 全屏 (the whole screen as well).
   The controls lie over the picture's bottom edge, where the captions are, so they are away unless the pointer comes down to them (.near);
   a pointer left alone is put away too (.still). The colours are written out: the reader app turns the film light, but not this */
.full,.full body{overflow:hidden}
.full .player{position:fixed;inset:0;z-index:10;border:0;border-radius:0;box-shadow:none;background:#141413}
.full .stage{height:100%;aspect-ratio:auto}
.full .controls{position:absolute;left:0;right:0;bottom:0;z-index:2;background:rgba(28,27,25,.94);border-top:1px solid #2E2C28;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.full.near .controls{opacity:1;visibility:visible}
.full.still .player,.full.still canvas{cursor:none}
/* ?bare=1 — canvas only, for frame capture */
.bare header,.bare footer,.bare .chapters,.bare .controls{display:none}
.bare .page{width:100vw;max-width:none;margin:0}.bare .watch{display:block}.bare .player{border:0;border-radius:0;height:100vh;box-shadow:none}.bare .stage{aspect-ratio:auto;height:100vh;background:#141413;overflow:hidden}
/* a window too narrow to give the chapters a column: they go under the picture, in a strip that scrolls sideways */
@media(max-width:859px){
.watch{display:flex;flex-direction:column}
.chapters{contain:none;order:1;display:flex;align-items:stretch;flex-shrink:0;margin:16px 0 0;overflow-x:auto;overflow-y:hidden;border-bottom:1px solid var(--line)}
.chapter{display:block;flex:1;width:auto;min-width:max-content;margin:0;padding:9px 12px 12px;border-bottom:2px solid transparent;border-radius:0;font-size:12px;line-height:1.6}
.chapter span{display:block;font-size:10px;margin-bottom:3px}
.chapter:hover,.chapter[aria-current=true]{background:none}.chapter[aria-current=true]{border-color:var(--clay)}
}
@media(max-width:720px){.page{width:calc(100% - 24px);margin:18px auto}header{margin-bottom:14px;gap:12px}h1{font-size:20px}.edition{display:none}.controls{padding:10px 14px 12px}.control-row{gap:10px}#wide{display:none}footer{display:block}.keys{margin-top:8px;white-space:normal}.player{border-radius:8px}}
</style>
</head>
<body>
<main class="page">
  <header>
    <div><div class="eyebrow">数据结构基础 · 第 5 次课</div><h1>AVL 树</h1></div>
    <div class="edition"><i></i>中文字幕 · <span id="total">00:00</span></div>
  </header>
  <div class="watch">
  <nav class="chapters" id="chapters" aria-label="跳转到章节"></nav>
  <section class="player" id="player" aria-label="动画播放器">
    <div class="stage" id="stage"><canvas id="film" role="img" aria-label="动画画面"></canvas></div>
    <div class="controls">
      <div class="timeline"><label class="sr-only" for="seek">播放进度，秒</label><input id="seek" type="range" min="0" max="100" step="0.01" value="0"></div>
      <div class="control-row">
        <button id="play" class="play" type="button" aria-label="播放" aria-pressed="false"><svg class="play-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2 14 8 4 14Z"/></svg><svg class="pause-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h3v12H3zm7 0h3v12h-3z"/></svg><span id="play-label">播放</span></button>
        <button class="quiet" id="replay" type="button">重播</button>
        <div class="clock"><b id="elapsed">00:00</b></div>
        <div class="spacer"></div>
        <label class="sr-only" for="speed">播放速度</label><select class="speed" id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
        <button class="quiet" id="captions" type="button" aria-pressed="true">字幕</button>
        <button class="quiet" id="wide" type="button" aria-pressed="false">网页全屏</button>
        <button class="quiet" id="fullscreen" type="button" aria-pressed="false">全屏</button>
      </div>
    </div>
  </section>
  </div>
  <footer>
    <div>依据第 5 次课的课件和课堂录音重新讲解，例题和数值由代码算出。</div>
    <div class="keys"><kbd>空格</kbd> 播放 / 暂停　<kbd>← →</kbd> 前后 5 秒　<kbd>F</kbd> 全屏　<kbd>W</kbd> 网页全屏　<kbd>C</kbd> 字幕</div>
  </footer>
</main>
<script>
'use strict';
/* Drawing + timing toolkit. Everything is a pure function of absolute time `t`,
   so any frame can be rendered on its own (seek, ?t=, frame-by-frame export). */
const V = (() => {
  const W = 1920, H = 1080;
  /* Scenes draw inside SAFE: the strip above it carries the chapter label, the strip below the caption. */
  const SAFE = { x0: 90, y0: 130, x1: 1830, y1: 930 };
  /* Two looks. Every theme defines the same role names, so a scene written with roles works in both.
     accent = the one thing being talked about; cat = identities of up to five things that coexist. */
  const THEMES = {
    anthropic: {
      bg: '#F0EEE6', paper: '#FAF9F5', ink: '#1F1E1D', mute: '#6B6A64', faint: '#A8A599', hair: '#D6D2C4',
      accent: '#D97757', accentDeep: '#B5583A', good: '#788C5D', bad: '#B5583A', wash: '#E3DACC',
      cat: ['#D97757', '#5B8FC4', '#788C5D', '#C46686', '#C7963A'],
    },
    keynote: {
      bg: '#FFFFFF', paper: '#F5F5F7', ink: '#1D1D1F', mute: '#6E6E73', faint: '#A1A1A6', hair: '#D2D2D7',
      accent: '#0071E3', accentDeep: '#0058B0', good: '#1F9D4C', bad: '#E8352B', wash: '#E8E8ED',
      cat: ['#0071E3', '#F56300', '#1F9D4C', '#AF52DE', '#0A97A6'],
    },
  };

  function setTheme(name) {
    const th = THEMES[name]; if (!th) throw new Error('unknown theme: ' + name);
    for (const k in th) if (k !== 'cat') C[k] = th[k];
    CAT.length = 0; CAT.push(...th.cat);
  }
  setTheme('anthropic');
  /* Everything on the picture is set in one sans face. Serif faces fall to Songti on Chinese Windows, thin and
     sharp on screen, so `serif` and `title` now name the same sans stack: scenes that ask for them keep working.
     "Learn Sans" is the face the reader supplies (HarmonyOS Sans SC with Inter for Latin and digits, the user's pick:
     the free pair closest to PingFang and SF). Opened on its own, the film uses the first of the rest the machine has. */
  const SANS = '"Learn Sans","Inter","HarmonyOS Sans SC","PingFang SC","Noto Sans SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif';
  /* Code is set the way VS Code sets it out of the box (the user's pick): Consolas on Windows, Menlo on a Mac,

  const FONT = {
    sans: SANS, serif: SANS, title: SANS,
    mono: 'Consolas,Menlo,Monaco,"Courier New","Noto Sans SC","Microsoft YaHei",monospace', codeLine: 1.35,
  };
  let ctx = null;
  const setCtx = c => { ctx = c; };

  // ---- math ----
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, p) => a + (b - a) * p;
  const ease = v => { v = clamp(v); return v * v * v * (v * (v * 6 - 15) + 10); };
  const easeOut = v => 1 - Math.pow(1 - clamp(v), 3);
  const easeBack = v => { v = clamp(v); const c = 1.6; return 1 + (c + 1) * Math.pow(v - 1, 3) + c * Math.pow(v - 1, 2); };

  const rad = d => d * Math.PI / 180;
  function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ---- colour ----
  const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; };
  const rgba = (h, a = 1) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };
  const mixc = (h1, h2, p) => { const a = hex(h1), b = hex(h2); p = clamp(p); return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], p))).join(',')})`; };

  // ---- primitives ----
  function alpha(a, fn) { if (a <= 0.003) return; ctx.save(); ctx.globalAlpha *= clamp(a); fn(); ctx.restore(); }
  function fontOf({ size = 36, font = 'sans', weight = 400, italic = false } = {}) { return `${italic ? 'italic ' : ''}${weight} ${size}px ${FONT[font] || font}`; }
  /* A string that holds $…$ is set as formulas (see below); o.math = false draws the dollar signs as they are. */
  function txt(str, x, y, o = {}) {
    const a = o.alpha === undefined ? 1 : o.alpha; if (a <= 0.003 || str === '') return 0;
    ctx.save(); ctx.globalAlpha *= clamp(a); ctx.font = fontOf(o); ctx.fillStyle = o.color || C.ink;
    ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.baseline || 'middle';
    if (o.ls) ctx.letterSpacing = o.ls + 'px';
    if (o.halo) { ctx.lineWidth = o.halo; ctx.strokeStyle = o.haloColor || C.bg; ctx.lineJoin = 'round'; }
    let w;
    if (ismath(str, o)) {
      const dy = mdrop(), L = mline(str, o), x0 = x - (o.align === 'left' ? 0 : o.align === 'right' ? L.w : L.w / 2);
      if (o.halo) L.f(x0, y + dy, true);
      L.f(x0, y + dy, false); w = L.w;
    } else { if (o.halo) ctx.strokeText(str, x, y); ctx.fillText(str, x, y); w = ctx.measureText(str).width; }
    ctx.restore(); return w;
  }
  function measure(str, o = {}) { ctx.save(); ctx.font = fontOf(o); if (o.ls) ctx.letterSpacing = o.ls + 'px'; const w = ismath(str, o) ? mline(str, o).w : ctx.measureText(str).width; ctx.restore(); return w; }
  /* How far a line reaches: its width, and how far its ink goes above and below the y it is drawn at. */
  function extent(str, o = {}) {
    ctx.save(); ctx.font = fontOf(o); ctx.textBaseline = o.baseline || 'middle'; if (o.ls) ctx.letterSpacing = o.ls + 'px';
    let r;
    if (ismath(str, o)) { const dy = mdrop(), L = mline(str, o); r = { w: L.w, up: L.a - dy, down: L.d + dy }; }
    else { const m = ctx.measureText(str); r = { w: m.width, up: m.actualBoundingBoxAscent, down: m.actualBoundingBoxDescent }; }
    ctx.restore(); return r;
  }
  /* Rich text: runs = [{t, color, font, italic, weight, sub, sup, bg, size}] laid out on one line. */
  function rich(runs, x, y, o = {}) {
    const a = o.alpha === undefined ? 1 : o.alpha; if (a <= 0.003) return 0;
    const size = o.size || 36;
    const mk = r => ({ size: (r.sub || r.sup) ? size * 0.62 : (r.size || size), font: r.font || o.font || 'sans', weight: r.weight || o.weight || 400, italic: !!r.italic });
    const ws = runs.map(r => measure(r.t, mk(r)) + (r.pad || 0) * 2);
    const total = ws.reduce((s, v) => s + v, 0);
    let cx = o.align === 'left' ? x : o.align === 'right' ? x - total : x - total / 2;
    ctx.save(); ctx.globalAlpha *= clamp(a);
    runs.forEach((r, i) => {
      const f = mk(r), dy = r.sub ? size * 0.28 : r.sup ? -size * 0.36 : 0, ra = r.alpha === undefined ? 1 : r.alpha;
      if (r.bg && ra > 0) { ctx.save(); ctx.globalAlpha *= ra; rrect(cx, y - size * 0.68, ws[i], size * 1.36, size * 0.2, { fill: r.bg }); ctx.restore(); }
      txt(r.t, cx + (r.pad || 0), y + dy, { ...f, color: r.color || o.color || C.ink, align: 'left', alpha: ra });
      if (r.hat) { const mx = cx + ws[i] * 0.56, hy = y - f.size * 0.36, hw = f.size * 0.17; poly([[mx - hw, hy], [mx, hy - f.size * 0.13], [mx + hw, hy]], { color: r.color || o.color || C.ink, w: Math.max(1.5, f.size * 0.045), alpha: ra }); }
      cx += ws[i];
    });
    ctx.restore(); return total;
  }
  function line(x1, y1, x2, y2, o = {}) {
    const p = o.p === undefined ? 1 : clamp(o.p); if (p <= 0) return;
    ctx.save(); if (o.alpha !== undefined) ctx.globalAlpha *= clamp(o.alpha);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(lerp(x1, x2, p), lerp(y1, y2, p));
    ctx.strokeStyle = o.color || C.ink; ctx.lineWidth = o.w || 2; ctx.lineCap = o.cap || 'round'; if (o.dash) ctx.setLineDash(o.dash); ctx.stroke(); ctx.restore();
  }
  function arrow(x1, y1, x2, y2, o = {}) {
    const p = o.p === undefined ? 1 : clamp(o.p); if (p <= 0.001) return;
    const ex = lerp(x1, x2, p), ey = lerp(y1, y2, p), w = o.w || 4, len = Math.hypot(ex - x1, ey - y1);
    const head = Math.min(o.head || w * 4.2, len * 0.6), q = Math.atan2(ey - y1, ex - x1);
    ctx.save(); if (o.alpha !== undefined) ctx.globalAlpha *= clamp(o.alpha);
    ctx.strokeStyle = ctx.fillStyle = o.color || C.ink; ctx.lineWidth = w; ctx.lineCap = 'round'; if (o.dash) ctx.setLineDash(o.dash);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(ex - Math.cos(q) * head * 0.7, ey - Math.sin(q) * head * 0.7); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex - head * Math.cos(q - 0.36), ey - head * Math.sin(q - 0.36)); ctx.lineTo(ex - head * Math.cos(q + 0.36), ey - head * Math.sin(q + 0.36)); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function circle(x, y, r, o = {}) {
    if (r <= 0) return; ctx.save(); if (o.alpha !== undefined) ctx.globalAlpha *= clamp(o.alpha);
    ctx.beginPath(); ctx.arc(x, y, r, o.a0 || 0, o.a1 === undefined ? TAU : o.a1);
    if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); }
    if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.w || 2; if (o.dash) ctx.setLineDash(o.dash); ctx.stroke(); }
    ctx.restore();
  }
  function rrect(x, y, w, h, r, o = {}) {
    ctx.save(); if (o.alpha !== undefined) ctx.globalAlpha *= clamp(o.alpha);
    ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
    if (o.shadow) { const k = ctx.getTransform().a; ctx.shadowColor = o.shadow.color || 'rgba(70,55,30,0.16)'; ctx.shadowBlur = (o.shadow.blur || 36) * k; ctx.shadowOffsetY = (o.shadow.y === undefined ? 10 : o.shadow.y) * k; }
    if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); ctx.shadowColor = 'transparent'; }
    if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.w || 2; if (o.dash) ctx.setLineDash(o.dash); ctx.stroke(); }
    ctx.restore();
  }
  /* Polyline with optional partial reveal p in [0,1] measured along its length. */
  function poly(pts, o = {}) {
    if (pts.length < 2) return; const p = o.p === undefined ? 1 : clamp(o.p); if (p <= 0) return;
    ctx.save(); if (o.alpha !== undefined) ctx.globalAlpha *= clamp(o.alpha);
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    if (p >= 1) { for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); if (o.close) ctx.closePath(); }
    else {
      let total = 0; const seg = []; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); total += d; }
      let left = total * p; for (let i = 1; i < pts.length && left > 0; i++) { const d = seg[i - 1]; const q = d <= left ? 1 : left / d; ctx.lineTo(lerp(pts[i - 1][0], pts[i][0], q), lerp(pts[i - 1][1], pts[i][1], q)); left -= d; }
    }
    if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); }
    if (o.color !== null) { ctx.strokeStyle = o.color || C.ink; ctx.lineWidth = o.w || 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; if (o.dash) ctx.setLineDash(o.dash); ctx.stroke(); }
    ctx.restore();
  }
  const bezPt = (a, b, c, d, u) => { const v = 1 - u; return [v * v * v * a[0] + 3 * v * v * u * b[0] + 3 * v * u * u * c[0] + u * u * u * d[0], v * v * v * a[1] + 3 * v * v * u * b[1] + 3 * v * u * u * c[1] + u * u * u * d[1]]; };
  function curve(a, b, c, d, o = {}) { const pts = []; for (let i = 0; i <= 48; i++) pts.push(bezPt(a, b, c, d, i / 48)); poly(pts, o); }

      case 'soft': return { fill: C.wash, ink: C.ink, stroke: C.ink };             // 路过的
      case 'b': return { fill: CAT[1], ink: C.paper, stroke: C.ink };              // 一般图里的 B
      case 'c': return { fill: CAT[2], ink: C.paper, stroke: C.ink };              // 一般图里的 C
      default: return { fill: C.paper, ink: C.ink, stroke: C.ink };
    }
  };

  // 一个节点：圆片加标签。o.ring 是外面再套的一圈（失衡的节点）
  function disc(x, y, r, label, o = {}) {
    const a = o.alpha === undefined ? 1 : o.alpha; if (a <= 0.003) return;
    if (o.ring) V.circle(x, y, r + 9, { stroke: o.ring, w: 4, alpha: a });
    V.circle(x, y, r, { fill: o.fill || C.paper, stroke: o.stroke || C.ink, w: 2.5, alpha: a });
    if (label !== '') V.txt(String(label), x, y + 1, { size: o.size || r, weight: 500, color: o.ink || C.ink, alpha: a });
  }
  // 两个圆心之间的边，两头各缩进一个半径
  function link(x1, y1, x2, y2, r1, r2, o = {}) {
    const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy); if (d <= r1 + r2 + 4) return;
    const ux = dx / d, uy = dy / d;
    V.line(x1 + ux * (r1 + 3), y1 + uy * (r1 + 3), x2 - ux * (r2 + 3), y2 - uy * (r2 + 3), { color: o.color || C.mute, w: o.w || 3, alpha: o.alpha });
  }
  // 一般图里的方框：一整棵子树。h 是它的高度（像素），grow 是底下新长出来的那一截
  function box(x, top, w, h, label, o = {}) {
    const a = o.alpha === undefined ? 1 : o.alpha; if (a <= 0.003) return;
    const g = o.grow || 0;
    if (g > 1) V.rrect(x - w / 2, top + h - 14, w, g + 14, 14, { fill: o.growFill || C.accent, stroke: o.stroke || C.ink, w: 2.5, alpha: a });
    V.rrect(x - w / 2, top, w, h, 14, { fill: o.fill || C.paper, stroke: o.stroke || C.ink, w: 2.5, alpha: a });
    if (label) V.txt(label, x, top + Math.min(h / 2, 60), { size: o.size || 36, color: o.ink || C.ink, alpha: a });      // 标签贴着方框的上半截，长出来的那截不挡它
  }
  const bfText = v => String(v).replace('-', '−');

  // 一棵树里每个键摆在哪。lay = { x, y, dx, dy, slots }：slots 是全片固定的列（所有键排好序），不给就按这棵树自己的中序
  function place(s, lay) {
    const n = s.nodes.length, out = {};
    for (const q of s.nodes) {
      const col = lay.slots ? lay.slots.indexOf(q.k) - (lay.slots.length - 1) / 2 : q.x - (n - 1) / 2;
      out[q.k] = { x: lay.x + col * lay.dx, y: lay.y + q.d * lay.dy, p: q.p, bf: q.bf, d: q.d };
    }
    return out;
  }
  /* 把一棵树登记进一帧。id 是这棵树在这一场里的名字，同一棵树在各帧里用同一个 id。
     o.role[k]   这个键的样子（hot、bad、new、good、soft），o.dim 里的键变淡
     o.bf        true 全部标平衡因子，或者给一个键的列表；o.bfOf(k) 给出要标的值（还没更新时标旧的）
     o.path      要加粗的边，写成 [[子, 父], ...]
     o.only      只画这些键（树一个一个长出来时用），o.delay(k) 新出现的键晚几秒出来，o.label(k) 换标签，o.alpha 整棵的深浅 */
  function tree(f, id, s, lay, o = {}) {
    const P = place(s, lay), r = lay.r || R, a = o.alpha === undefined ? 1 : o.alpha;
    const has = (list, k) => !!list && (typeof list === 'function' ? list(k) : list.includes(k));
    const shown = k => !o.only || o.only.includes(k);
    const onPath = (a1, b1) => !!o.path && o.path.some(e => (e[0] === a1 && e[1] === b1) || (e[0] === b1 && e[1] === a1));
    for (const q of s.nodes) {
      if (q.p === null || !shown(q.k) || !shown(q.p)) continue;
      const [u, v] = q.k < q.p ? [q.k, q.p] : [q.p, q.k], A = P[u], B = P[v], hot = onPath(q.k, q.p);
      f.add(`${id}-e-${u}-${v}`, link, A.x, A.y, B.x, B.y, r, r, { color: hot ? C.accent : C.mute, w: hot ? 7 : 3, alpha: a * (has(o.dim, q.k) || has(o.dim, q.p) ? 0.22 : 1), delay: o.delay ? Math.max(o.delay(q.k), o.delay(q.p)) : 0 });
    }
    for (const q of s.nodes) {
      if (!shown(q.k)) continue;
      const p = P[q.k], st = STYLE(o.role && o.role[q.k]), na = a * (has(o.dim, q.k) ? 0.22 : 1);
      f.add(`${id}-n-${q.k}`, disc, p.x, p.y, r, o.label ? o.label(q.k) : String(q.k), { fill: st.fill, ink: st.ink, stroke: st.stroke, ring: st.ring, alpha: na, size: lay.size || r, delay: o.delay ? o.delay(q.k) : 0 });
      const val = o.bfOf ? o.bfOf(q.k) : q.bf;
      if ((o.bf === true || has(o.bf, q.k)) && val !== undefined) {
        const off = Math.abs(val) > 1;
        f.txt(`${id}-b-${q.k}`, bfText(val), p.x + r * 0.78, p.y - r * 1.02, { size: lay.bfSize || 30, weight: off ? 700 : 500, color: off ? C.bad : C.mute, align: 'left', alpha: na, halo: 8, delay: o.delay ? o.delay(q.k) : 0 });
      }
    }
    return P;
  }

  /* 一般图：节点和方框按“列、层”摆。G = { x, y, dx, u, r, bw }，u 是一层的高度（像素），方框多高也用它量。
     st.nodes[名] = { c 列, d 层, role, bf, label }；st.boxes[名] = { c, d, h 高度, grow 新长出的一截, tex 标签, role, alpha }；
     st.edges = [[上, 下], ...]。方框挂在“层”的位置上：它的顶和那一层节点的顶一样高。 */
  function general(f, id, G, st) {
    const at = name => { const n = st.nodes[name]; if (n) return { x: G.x + n.c * G.dx, y: G.y + n.d * G.u, r: G.r }; const b = st.boxes[name]; return { x: G.x + b.c * G.dx, y: G.y + b.d * G.u - G.r, r: 0 }; };
    for (const [p, q] of st.edges) {
      const [u, v] = p < q ? [p, q] : [q, p], A = at(u), B = at(v), o = (st.edgeOpt && (st.edgeOpt[`${p}-${q}`] || st.edgeOpt[`${q}-${p}`])) || {};
      f.add(`${id}-e-${u}-${v}`, link, A.x, A.y, B.x, B.y, A.r, B.r, { color: o.color || C.mute, w: o.w || 3, alpha: o.alpha === undefined ? 1 : o.alpha });
    }
    for (const name in st.boxes) {
      const b = st.boxes[name], p = at(name), tone = b.role === 'hot' ? { fill: C.wash, stroke: C.accentDeep } : { fill: C.paper, stroke: C.ink };
      f.add(`${id}-x-${name}`, box, p.x, p.y, G.bw, b.h, b.tex || '', { grow: b.grow || 0, fill: tone.fill, stroke: tone.stroke, alpha: b.alpha === undefined ? 1 : b.alpha, size: G.ts || 36 });
    }
    for (const name in st.nodes) {
      const n = st.nodes[name], p = at(name), s = STYLE(n.role);
      f.add(`${id}-n-${name}`, disc, p.x, p.y, G.r, n.label || name, { fill: s.fill, ink: s.ink, stroke: s.stroke, ring: s.ring, alpha: n.alpha === undefined ? 1 : n.alpha, size: G.r });
      if (n.bf !== undefined && n.bf !== null) {
        const off = /2/.test(String(n.bf));
        f.txt(`${id}-b-${name}`, bfText(n.bf), p.x + G.r * 0.8, p.y - G.r * 1.02, { size: 30, weight: off ? 700 : 500, color: off ? C.bad : C.mute, align: 'left', halo: 8 });
      }
    }
    return at;
  }

  // 一行等距的格子里各写一个数或一条公式，表格和数列都用它。返回每格的 x
  function row(f, id, cells, x0, y, step, o = {}) {
    cells.forEach((t, i) => { if (t !== null && t !== undefined && t !== '') f.txt(`${id}-${i}`, String(t), x0 + i * step, y, { size: o.size || 40, color: (o.colors && o.colors[i]) || o.color || C.ink, weight: (o.bold && o.bold.includes(i)) ? 700 : (o.weight || 400), alpha: (o.alphas && o.alphas[i] !== undefined) ? o.alphas[i] : (o.alpha === undefined ? 1 : o.alpha), delay: o.stagger ? i * o.stagger : 0 }); });
  }

  V.cast = { R, STYLE, disc, link, box, bfText, place, tree, general, row };
})();

</script>
<script>
'use strict';
/* 第 1 幕：同样七个数，两棵树。
   画面只跟讲稿里的〔画面〕行走：每个〔画面〕行是场上那棵树的一次变化（可以连着几步），别的句子画面不动。
   屏幕上的字只有〔画面〕行里写的，外加几个字的短标签。 */
(() => {
  const { C, CAT } = V, K = V.cast, D = V.data;

  // ---- bst：一棵二叉搜索树，它的规矩，在里面找 5 ----
  const MID = { x: 960, y: 320, dx: 150, dy: 180, r: 50, size: 48, sy: 190 };
  const PM = K.place(D.bushy, MID);
  const bushy = (f, o) => K.tree(f, 'T', D.bushy, MID, o);
  const under = (f, id, k, str, tone) => f.txt(id, str, PM[k].x, 792, { size: 32, color: tone });
  const goal = f => f.txt('goal', '找 5', 1640, 320, { size: 64, weight: 500 });
  const count = (f, n) => f.txt('cnt', `比了 ${n} 次`, 1640, 415, { size: 38, color: C.accentDeep });

  V.SCENES.bst = V.frames([
    ['a1', f => bushy(f)],
    // 〔根 4 的左子树和右子树各染一种颜色；随后节点 2、节点 6 的两边也同样染一下〕
    ['a3', f => { bushy(f, { role: { 4: 'hot', 1: 'b', 2: 'b', 3: 'b' } }); under(f, 'lo', 2, '都比 4 小', CAT[1]); }, { off: 1.4 }],
    ['a4', f => { bushy(f, { role: { 4: 'hot', 1: 'b', 2: 'b', 3: 'b', 5: 'c', 6: 'c', 7: 'c' } }); under(f, 'lo', 2, '都比 4 小', CAT[1]); under(f, 'hi', 6, '都比 4 大', CAT[2]); }, { off: 0.2 }],
    ['a4', f => {
      bushy(f, { role: { 2: 'hot', 6: 'hot', 1: 'b', 3: 'c', 5: 'b', 7: 'c' } });
      under(f, 'u1', 1, '比 2 小', CAT[1]); under(f, 'u3', 3, '比 2 大', CAT[2]); under(f, 'u5', 5, '比 6 小', CAT[1]); under(f, 'u7', 7, '比 6 大', CAT[2]);
    }, { off: 2.7 }],
    // 〔找 5。从根走过 4、6、5，每走一步，没走的那棵子树变淡；旁边记着比了 3 次〕
    ['a5', f => { bushy(f); goal(f); }],
    ['a6', f => { bushy(f, { role: { 4: 'hot' } }); goal(f); count(f, 1); }],
    ['a7', f => { bushy(f, { role: { 4: 'soft', 6: 'hot' }, dim: [1, 2, 3], path: [[6, 4]] }); goal(f); count(f, 2); }],
    ['a7', f => { bushy(f, { role: { 4: 'soft', 6: 'soft', 5: 'hot' }, dim: [1, 2, 3, 7], path: [[6, 4], [5, 6]] }); goal(f); count(f, 3); }, { off: 2.5 }],
  ]);

  // ---- two：照两种顺序一个个放进去，长成两棵树；各找一次 7；深度和高度 ----
  const ORD1 = [4, 2, 6, 1, 3, 5, 7], ORD2 = [1, 2, 3, 4, 5, 6, 7];
  const LEFT = { x: 600, y: 300, dx: 110, dy: 150, r: 44, size: 44, sy: 172 };
  const CHAIN = { x: 1380, y: 250, dx: 75, dy: 95, r: 44, size: 44, sy: 172 };

  /* 一个数从顺序条里出发，从根一路比下来，落在走到的空位置上。p 从 0 走到 1；
     落定以后（p = 1）画出来的节点和连到父亲的边，同 K.tree 画的一模一样。 */
  function walker(pts, p, r, label, o = {}) {
    if (p <= 0.002) return;
    const seg = []; let total = 0;
    for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); total += d; }
    let rest = total * Math.min(1, p), x = pts[0][0], y = pts[0][1];
    for (let i = 1; i < pts.length; i++) {
      const d = seg[i - 1];
      if (rest <= d) { const q = d ? rest / d : 1; x = V.lerp(pts[i - 1][0], pts[i][0], q); y = V.lerp(pts[i - 1][1], pts[i][1], q); break; }
      rest -= d; x = pts[i][0]; y = pts[i][1];
    }
    const land = V.clamp((p - 0.86) / 0.14), end = pts[pts.length - 1], big = V.lerp(0.62, 1, V.clamp(p / 0.25));
    if (o.par && land > 0) K.link(end[0], end[1], o.par[0], o.par[1], r, r, { color: o.ecolor, w: o.ew, alpha: land });
    const moving = p < 0.999;
    K.disc(x, y, r * big, label, { fill: moving ? V.mixc(CAT[1], o.fill, land) : o.fill, ink: moving ? V.mixc(C.paper, o.ink, land) : o.ink, stroke: C.ink, alpha: V.clamp(p / 0.1), size: o.size * big });
  }
  /* 一棵照 order 的顺序长出来的树：上方是顺序条，前 n 个数已经落定。
     o.role[k] 节点的样子，o.path 里的键连到父亲的那条边加粗（查找走过的路）。 */
  function grown(f, id, s, lay, order, n, o = {}) {
    const P = K.place(s, lay), by = Object.fromEntries(s.nodes.map(q => [q.k, q])), x0 = lay.x - 58;
    f.txt(id + '-ord', '放进去的顺序', lay.x - 98, lay.sy, { size: 32, color: C.mute, align: 'right' });
    order.forEach((k, j) => f.txt(`${id}-o${j}`, String(k), x0 + j * 56, lay.sy, { size: 36, color: j < n ? C.mute : C.ink }));
    order.forEach((k, j) => {
      const way = []; for (let q = by[k]; q; q = q.p === null ? null : by[q.p]) way.unshift([P[q.k].x, P[q.k].y]);
      const st = K.STYLE(o.role && o.role[k]), hot = !!o.path && o.path.includes(k), par = by[k].p;
      f.add(`${id}-n-${k}`, walker, [[x0 + j * 56, lay.sy], ...way], j < n ? 1 : 0, lay.r, String(k),
        { fill: st.fill, ink: st.ink, size: lay.size, par: par === null ? null : [P[par].x, P[par].y], ecolor: hot ? C.accent : C.mute, ew: hot ? 7 : 3 });
    });
    return P;
  }
  const PL = K.place(D.bushy, LEFT), PC = K.place(D.chain7, CHAIN);
  const depthOf = (s, k) => s.nodes.find(q => q.k === k).d;
  const findL = { role: { 4: 'soft', 6: 'soft', 7: 'hot' }, path: [6, 7] };
  const findR = { role: { 1: 'soft', 2: 'soft', 3: 'soft', 4: 'soft', 5: 'soft', 6: 'soft', 7: 'hot' }, path: [2, 3, 4, 5, 6, 7] };
  /* 两棵树并排。n2 是链上已经放好的个数；m 是讲到了哪一步：
     1 各找一次 7　2 数出比了几次　3 标深度　4 标高度　5 T_p　6 链旁的 N　7 Ω(N) */
  const pair = (f, n2, m = 0) => {
    grown(f, 'T', D.bushy, LEFT, ORD1, 7, m >= 1 ? findL : {});
    grown(f, 'Ch', D.chain7, CHAIN, ORD2, n2, m >= 1 ? findR : {});
    if (m >= 1 && m < 5) f.txt('goal', '找 7', 1012, 322, { size: 56, weight: 500 });
    if (m >= 2) {
      f.txt('cL', `比 ${depthOf(D.bushy, 7) + 1} 次`, 600, 720, { size: 38 });
      f.txt('cR', `比 ${depthOf(D.chain7, 7) + 1} 次`, 1215, 600, { size: 38 });
    }
    if (m >= 3) {
      D.bushy.nodes.forEach(q => f.txt('dl' + q.k, (q.d ? '' : '深度 ') + q.d, PL[q.k].x + 62, PL[q.k].y, { size: 28, color: C.mute, align: 'left' }));
      D.chain7.nodes.forEach(q => f.txt('dc' + q.k, (q.d ? '' : '深度 ') + q.d, PC[q.k].x + 62, PC[q.k].y, { size: 28, color: C.mute, align: 'left' }));
    }
    if (m >= 4) {
      f.txt('hL', '高度 ' + D.bushy.height, 600, 782, { size: 38, color: C.accentDeep });
      f.txt('hR', '高度 ' + D.chain7.height, 1215, 662, { size: 38, color: C.accentDeep });
    }
    if (m >= 5) f.txt('Tp', '$T_p = O(\\text{height})$', 600, 872, { size: 46 });
    if (m >= 6) f.txt('cN', '$N$ 个节点，高度 $N-1$', 1215, 742, { size: 34, color: C.mute });
    if (m >= 7) f.txt('Om', 'height 可以是 $\\Omega(N)$', 1215, 872, { size: 42 });
  };

  V.SCENES.two = V.frames([
    // 〔清空，上方写放进去的顺序 4、2、6、1、3、5、7，照这个顺序一个个从根比下来，落在走到的空位置上〕
    [null, f => grown(f, 'T', D.bushy, MID, ORD1, 0)],
    ...ORD1.map((k, j) => ['a9', f => grown(f, 'T', D.bushy, MID, ORD1, j + 1), { off: -0.2 + j * 1.15, dur: 0.9 }]),
    // 〔这棵树移到左边；右边换成 1 到 7 从小到大的顺序，同样一个个放，长成一条向右下的链〕
    ['a10', f => grown(f, 'T', D.bushy, LEFT, ORD1, 7), { dur: 1 }],
    ['a10', f => pair(f, 0), { off: 1.0, dur: 0.5 }],
    ['a10', f => pair(f, 1), { off: 1.6, dur: 0.9 }],
    ['a10', f => pair(f, 2), { off: 2.65, dur: 0.9 }],
    ...[3, 4, 5, 6, 7].map((n, j) => ['a11', f => pair(f, n), { off: 0.2 + j * 1.05, dur: 0.9 }]),
    // 〔两棵树里各找一次 7，路径亮起，旁边数出左边比 3 次，右边比 7 次；随后每个节点旁标出深度，根是 0，树旁标出高度〕
    ['a13', f => pair(f, 7, 1), { off: 0.2 }],
    ['a13', f => pair(f, 7, 2), { off: 1.9 }],
    ['a16', f => pair(f, 7, 3)],
    ['a18', f => pair(f, 7, 4), { off: 1.2 }],
    // 〔下方写 T_p = O(height)；链旁标“N 个节点，高度 N−1”；再写 height 可以是 Ω(N)〕
    ['a19', f => pair(f, 7, 5)],
    ['a22', f => pair(f, 7, 6)],
    ['a22', f => pair(f, 7, 7), { off: 2.2 }],
  ]);

  // ---- months3：课件上十二个月份的三种排法 ----
  const M = D.months3;
  const SHAPES = [
    ['cal', M.calendar, { x: 400, y: 330, dx: 40, dy: 70, r: 16 }, '按 1 月到 12 月的顺序放进去'],
    ['bal', M.balanced, { x: 960, y: 330, dx: 40, dy: 70, r: 16 }, '排得匀称'],
    ['chn', M.chain, { x: 1520, y: 330, dx: 28, dy: 38, r: 16 }, '一条链'],
  ];
  // n：已经写出平均比较次数的有几棵
  const three = (f, n) => {
    f.txt('title', '十二个月份的英文名，按字母顺序比大小', 960, 172, { size: 38 });
    SHAPES.forEach(([id, s, lay, cap], i) => {
      K.tree(f, id, s, lay, { label: () => '', role: Object.fromEntries(s.nodes.map(q => [q.k, 'soft'])), delay: () => 0.5 + i * 0.4 });
      f.txt(id + 'c', cap, lay.x, 252, { size: 30, color: C.mute, delay: 0.5 + i * 0.4 });
      if (n > i) {
        f.txt(id + 'a', s.avg.toFixed(1), lay.x - 62, 832, { size: 72, weight: 500, color: C.accentDeep });
        f.txt(id + 'f', `${Math.abs(s.total / s.count - +s.avg.toFixed(1)) < 1e-9 ? '=' : '≈'} ${s.total}/${s.count}`, lay.x + 78, 838, { size: 36, color: C.mute });
      }
    });
    if (n >= 1) f.txt('how', '每个节点的深度加 1，求平均', 960, 900, { size: 30, color: C.mute });
  };
  V.SCENES.months3 = V.frames([
    ['a25', f => three(f, 0)],
    ['a26', f => three(f, 1), { off: 0.2 }],
    ['a26', f => three(f, 2), { off: 2.6 }],
    ['a27', f => three(f, 3), { off: 0.2 }],
  ]);
})();

</script>
<script>
'use strict';
/* 第 2 幕：最矮能多矮，为什么守不住。
   三场各有一个主角：一层层填满的树；1 到 7 的完全二叉搜索树（放进 8 以后整棵重排）；三种做法的小表。 */
(() => {
  const { C, CAT } = V, K = V.cast, D = V.data;

  // ---- levels：一层一层填满，旁边写每层的个数和累计 ----
  const FULL = D.complete[1].before;                      // 15 个节点的完全二叉树，只借它的形状
  const LV = { x: 800, y: 260, dx: 88, dy: 150, r: 34 };
  const at = d => FULL.nodes.filter(q => q.d === d).length, upTo = d => FULL.nodes.filter(q => q.d <= d).length;
  // upto：填到第几层；o.calm 填完了，不再有哪一层亮着；o.more 写出前 10 层、前 20 层的个数
  const filled = (f, upto, o = {}) => {
    K.tree(f, 'F', FULL, LV, { label: () => '', only: FULL.nodes.filter(q => q.d <= upto).map(q => q.k), role: Object.fromEntries(FULL.nodes.map(q => [q.k, q.d === upto && !o.calm ? 'hot' : 'soft'])) });
    f.txt('hc', '这一层', 1560, 170, { size: 30, color: C.mute }); f.txt('hs', '累计', 1730, 170, { size: 30, color: C.mute });
    for (let d = 0; d <= upto; d++) {
      f.txt('c' + d, String(at(d)), 1560, LV.y + d * LV.dy, { size: 46, color: d === upto && !o.calm ? C.accentDeep : C.ink });

  };
  V.SCENES.levels = V.frames([
    // 〔一棵二叉树一层一层填满，每层旁写个数 1、2、4、8 和累计 1、3、7、15；再写“前 10 层 1023 个，前 20 层 1048575 个”〕
    ['b1', f => filled(f, 0)],
    ['b1', f => filled(f, 1), { off: 1.5 }],
    ['b2', f => filled(f, 2), { off: 0.3 }],
    ['b2', f => filled(f, 3), { off: 2.0 }],
    ['b3', f => filled(f, 3, { calm: true, more: true }), { off: 0.4 }],

  const kids = CB.before.nodes.filter(q => q.p === CB.before.root).sort((a, b) => a.k - b.k);
  const sideL = below(CB.before, kids[0].k), sideR = below(CB.before, kids[1].k);  // 根的左边、右边现有的节点

  const NEW = { x: 1500, y: 300 };
  // n：0 只有树　1 来了一个 8　2 亮出第八个位置　3 根的左边 4 个位置　4 右边 3 个位置
  const before = (f, n) => {
    const role = {}; if (n >= 3) sideL.forEach(k => { role[k] = 'b'; }); if (n >= 4) sideR.forEach(k => { role[k] = 'c'; });
    K.tree(f, 'B', CB.before, RB, { role });
    if (n >= 1) f.add('B-n-8', K.disc, NEW.x, NEW.y, RB.r, '8', { ...K.STYLE('new'), ring: undefined, alpha: 1, size: RB.r, delay: 0 });

    }
    if (n >= 3) f.txt('L4', `${sideL.length + 1} 个位置`, PB[kids[0].k].x - 30, PB[CB.before.root].y + 50, { size: 36, color: CAT[1] });
    if (n >= 4) f.txt('R3', `${sideR.length} 个位置`, PB[kids[1].k].x + 30, PB[CB.before.root].y + 50, { size: 36, color: CAT[2] });
  };
  // n：0 重排成根为 5 的样子　1 标出换了父亲的　2 节点更多时
  const after = (f, n) => {
    K.tree(f, 'B', CB.after, RB, { role: n >= 1 ? { ...Object.fromEntries(moved.map(k => [k, 'hot'])), 8: 'new' } : { 8: 'new' } });

    });

    ['b12', f => before(f, 0)],

    ['b16', f => after(f, 0), { dur: 1.6 }],
    ['b16', f => after(f, 1), { off: 2.4 }],
    ['b17', f => after(f, 2)],

  // ---- ways：一张小表，三种做法各放宽了什么 ----
  const ways = f => {
    const x0 = 250, x1 = 1690, xa = 480, xb = 790;
    f.txt('hd1', '做法', xa, 235, { size: 30, color: C.mute }); f.txt('hd2', '放宽了什么', xb, 235, { size: 30, color: C.mute, align: 'left' });
    f.line('r0', x0, 285, x1, 285, { color: C.hair, w: 2 });

    f.txt('t1', 'AVL 树', xa, 380, { size: 50, weight: 500, color: C.accentDeep });
    f.txt('t2', '红黑树', xa, 510, { size: 50, weight: 500 });
    f.poly('br', [[xa + 160, 380], [xb - 60, 380], [xb - 60, 510], [xa + 160, 510]], { color: C.faint, w: 2.5 });
    f.txt('d1', '仍是二叉搜索树，放宽平衡的要求', xb, 445, { size: 38, align: 'left' });
    f.line('r1', x0, 595, x1, 595, { color: C.hair, w: 2, delay: 1.6 });
    f.txt('t3', 'B+ 树', xa, 690, { size: 50, weight: 500, delay: 1.6 });
    f.txt('d2', '叶子都在同一深度，一个节点可以有两个以上的孩子', xb, 690, { size: 38, align: 'left', delay: 1.6 });
    f.line('r2', x0, 785, x1, 785, { color: C.hair, w: 2, delay: 1.6 });
  };
  V.SCENES.ways = V.frames([
    // 〔一张小表，三种做法各放宽了什么……AVL 树那一格亮着〕
    ['b24', f => ways(f)],
  ]);
})();

(() => {

  const hollow = (f, id, x, y, r, word) => { f.circle(id, x, y, r, { stroke: C.faint, w: 2.5, dash: [8, 8] }); if (word) f.txt(id + 't', word, x, y, { size: 28, color: C.mute }); };

    f.txt('hL', '$h_L$', cx - 455, TOP + HL / 2, { size: 48 }); f.txt('hR', '$h_R$', cx + 455, TOP + HR / 2, { size: 48 });
    if (two) {

      f.add('s-1', K.disc, x, y, r, '', { fill: C.wash }); f.add('s-2', K.disc, x - 85, y + 150, r, '', { fill: C.wash });

    f.add('bL', brace, 470, top, bot, {}); f.add('bR', brace, 1450, top, bot, {});
    f.txt('gL', '高 ' + sideH[0], 395, (top + bot) / 2, { size: 40 }); f.txt('gR', '高 ' + sideH[1], 1525, (top + bot) / 2, { size: 40 });
  };
  // n：0 式子和旁注　1 名字　2 两位作者　3 课件的递归写法
  const define = (f, n) => {

    if (n >= 1) f.txt('avl', 'AVL 树', 960, 430, { size: 96, weight: 500, color: C.accentDeep });

    if (n >= 3) {

    ['c1', f => scale(f, 960, false)],

  const small = (f, X, n) => {

    // 〔三棵小树：空树、单个节点、一个节点带一个左孩子，高度标 −1、0、1；写“高度 = 较高的子树的高度 + 1”〕
    ['c15', f => small(f, X3, 0)],

    ['c18', f => small(f, X3, 2), { off: 1.8 }],

  });

    ['c22', f => three(f, 0)],

})();

<script>
'use strict';
/* 第 4 幕：守住这条规矩，树最高能多高。
   thin：四个空位里依次搭出最省的树；p1recur：一般的图、递推式和表；double（接着上一场）：每高两层翻一倍，推出 h ≤ 2log₂N；
   fib：三行数对齐，n_h + 1 是斐波那契数；p1ratio：相邻两项的比和黄金分割数；p1bound：1.44 倍，一百万个节点时的对比。 */
(() => {
  const { C } = V, K = V.cast, D = V.data;
  const NH = D.nh.slice(0, 7), FIB = D.fib.slice(0, 10);
  const tri = (x, top, w, h, o = {}) => V.poly([[x, top], [x - w / 2, top + h], [x + w / 2, top + h]], { close: true, fill: o.fill || C.paper, color: o.stroke || C.ink, w: 2.5, alpha: o.alpha });

  // ---- thin：一排四个空位，依次搭出高度 0、1、2、3 的最省的树 ----
  const TX = [250, 540, 900, 1400], BW = [170, 210, 330, 530], lay = i => ({ x: TX[i], y: 320, dx: 64, dy: 115, r: 30 });
  const all = (i, role) => Object.fromEntries(D.thin[i].nodes.map(q => [q.k, role]));

  /* o.trees[i] = { only: 只画这些键, role: { 键: 样子 }, count: 写不写个数 }，没有就是空位；
     o.ask 上方的问题；o.hole：'open' 右边先空着，'bad' 标出差 2 */
  const slots = (f, o) => {
    if (o.ask) f.txt('ask', '长到高度 $h$，最少要几个节点？', 960, 185, { size: 44 });
    TX.forEach((x, i) => {
      f.rrect('box' + i, x - BW[i] / 2, 250, BW[i], 470, 18, { stroke: C.faint, w: 2, dash: [10, 10] });
      f.txt('lab' + i, '高度 ' + i, x, 765, { size: 34, color: C.mute });

      if (st && st.count) f.txt('cnt' + i, String(NH[i]), x, 852, { size: 64, weight: 500, color: C.accentDeep });

      if (o.hole === 'bad') f.txt('holeT', '差 2', HOLE.x + 8, HOLE.y + 68, { size: 34, weight: 500, color: C.bad });
    }
  };
  const done = { count: true }, T = (...trees) => ({ ask: true, trees });
  const h2a = { only: [3] }, h2b = { only: [3, 2, 1], role: { 2: 'b', 1: 'b' } }, h2c = { role: { 2: 'b', 1: 'b', 4: 'c' } };
  const asB = i => ({ count: true, role: all(i, 'b') }), asC = i => ({ count: true, role: all(i, 'c') });
  const h3L = { 3: 'b', 2: 'b', 1: 'b', 4: 'b' }, h3R = { 7: 'c', 6: 'c' };
  V.SCENES.thin = V.frames([
    // 〔一排四个空位，标着高度 0、1、2、3；上方写“长到高度 h，最少要几个节点？”〕
    ['d1', f => slots(f, { trees: [] })],
    ['d3', f => slots(f, T()), { off: 0.3 }],
    // 〔依次搭出高度 0、1 的最省的树，下面写 1、2〕：讲稿没有说这两棵，放在 d5 开口之前的停顿里
    ['d5', f => slots(f, T(done)), { off: -2.5 }],
    ['d5', f => slots(f, T(done, done)), { off: -1.3 }],
    // 〔搭高度 2 时先让一边高 1、另一边空着，标出差 2，再给空的一边补一个节点，写 4〕
    ['d5', f => slots(f, T(done, done, h2a)), { off: 0.2 }],
    ['d5', f => slots(f, T(done, asB(1), h2b)), { off: 1.7 }],
    ['d5', f => slots(f, { ...T(done, asB(1), h2b), hole: 'open' }), { off: 3.7 }],
    ['d6', f => slots(f, { ...T(done, asB(1), h2b), hole: 'bad' }), { off: 1.3 }],
    ['d6', f => slots(f, T(asC(0), asB(1), h2c)), { off: 3.5 }],
    ['d6', f => slots(f, T(asC(0), asB(1), { ...h2c, count: true })), { off: 4.6 }],
    // 〔高度 3 的一边是刚才高 2 的那棵，另一边是高 1 的那棵，写 7〕
    ['d7', f => slots(f, T(done, done, done, { only: [5] })), { off: 0.2 }],
    ['d7', f => slots(f, T(done, done, asB(2), { only: [5, 3, 2, 1, 4], role: h3L })), { off: 1.5 }],
    ['d7', f => slots(f, T(done, asC(1), asB(2), { role: { ...h3L, ...h3R } })), { off: 3.7 }],
    ['d8', f => slots(f, T(done, asC(1), asB(2), { role: { ...h3L, ...h3R }, count: true })), { off: 0.3 }],
  ]);

  // ---- p1recur：一般的图，递推式，表 ----
  const cells = i => 1210 + i * 92;
  /* o.n：一般的图画到哪（0 根和两棵子树的轮廓　1 左边高 h−1　2 右边高 h−2　3 加上根）
     o.formula 递推式，o.note 旁注，o.table 表，o.bound 表下的 N ≥ n_h，o.lit 亮着的列 */
  const recur = (f, o = {}) => {
    const n = o.n || 0, on = k => (o.hot === k ? C.wash : C.paper);
    f.add('g-eL', K.link, 560, 240, 380, 360, 40, 0, {}); f.add('g-eR', K.link, 560, 240, 800, 360, 40, 0, {});
    f.add('g-root', K.disc, 560, 240, 40, n >= 3 ? '1' : '', { fill: o.hot === 'root' ? C.accent : C.wash, ink: o.hot === 'root' ? C.paper : C.ink, size: 36 });
    f.add('g-tL', tri, 380, 360, 340, 400, { fill: on('L') }); f.add('g-tR', tri, 800, 360, 280, 280, { fill: on('R') });
    f.line('g-b', 150, 200, 150, 760, { color: C.mute, w: 2 }); f.line('g-b0', 138, 200, 162, 200, { color: C.mute, w: 2 }); f.line('g-b1', 138, 760, 162, 760, { color: C.mute, w: 2 });

  const R3 = { n: 3, formula: true, note: true }, R4 = { ...R3, table: true }, R5 = { ...R4, bound: true }, REND = { ...R5, lit: [4, 5] };

  };
  V.SCENES.double = V.frames([
    [null, f => recur(f, REND)],
    // 〔式子下面接着写 n_h > 2n_{h−2}；表上隔一个连一条弧，每条弧标“两倍以上”；再依次写 n_h ≥ 2^{h/2}，N ≥ n_h ≥ 2^{h/2}，h ≤ 2log₂N〕
    ['d20', f => table2(f, 0), { dur: 1.2 }],

  const rows = (f, n) => {

    if (n >= 1) { f.txt('lb', '各加 1', LX, 352, { size: 34, color: C.mute }); NH.forEach((v, i) => f.txt('b' + i, String(v + 1), fx(i + 3), 352, { size: 48, color: n >= 2 ? C.accentDeep : C.ink, delay: i * 0.12 })); }
    if (n >= 2) {
      f.txt('lc', '斐波那契数', LX, 462, { size: 34, color: C.mute }); f.txt('li', '$i$', LX, 528, { size: 32, color: C.mute });
      FIB.forEach((v, i) => { f.txt('c' + i, String(v), fx(i), 462, { size: 48, color: i >= 3 ? C.accentDeep : C.ink, delay: i * 0.08 }); f.txt('ci' + i, String(i), fx(i), 528, { size: 30, color: C.mute, delay: i * 0.08 }); });
      f.txt('fdef', '$F_0 = 0$，$F_1 = 1$，往后每个是前两个的和', fx(0) - 30, 596, { size: 32, color: C.mute, align: 'left', delay: 0.8 });
    }
    if (n >= 3) f.txt('plus', '$(n_h + 1) = (n_{h-1} + 1) + (n_{h-2} + 1)$', 960, 700, { size: 48 });
    if (n >= 4) f.txt('nf', '$n_h = F_{h+3} - 1$', n >= 5 ? 700 : 960, 830, { size: 66, color: C.accentDeep });
    if (n >= 5) f.txt('slide', '课件写的是 $F_{h+2} - 1$', 1330, 836, { size: 38, color: C.mute });
  };
  V.SCENES.fib = V.frames([
    // 〔三行数对齐……从 F_3 起和第二行对齐；下面写 (n_h + 1) = (n_{h−1} + 1) + (n_{h−2} + 1)〕
    ['d32', f => rows(f, 0)],
    ['d33', f => rows(f, 1), { off: 0.3 }],
    ['d33', f => rows(f, 2), { off: 2.4 }],
    ['d34', f => rows(f, 3), { off: 1.0 }],
    // 〔写出 n_h = F_{h+3} − 1，旁注“课件写的是 F_{h+2} − 1”〕
    ['d35', f => rows(f, 4)],
    ['d36', f => rows(f, 5), { off: 0.3 }],
  ]);

  // ---- p1ratio：相邻两项的比，黄金分割数 ----
  const RAT = [4, 5, 6, 7, 8].map(i => [FIB[i + 1] + '/' + FIB[i], String(Math.round(FIB[i + 1] / FIB[i] * 1000) / 1000)]);
  // n：0 五个比　1 箭头指向 1.618　2 r² = r + 1　3 解出来的 r　4 课件的近似式
  const growth = (f, n) => {
    const y = n >= 2 ? 215 : 400;                                     // 只有这一行时放在中间，下面要写东西了再让上去
    RAT.forEach(([q, v], i) => { f.txt('q' + i, q, 330 + i * 205, y, { size: 42, color: C.mute, delay: i * 0.45 }); f.txt('v' + i, v, 330 + i * 205, y + 80, { size: 50, delay: i * 0.45 }); });
    if (n >= 1) { f.arrow('to', 1275, y + 80, 1405, y + 80, { color: C.accent, w: 4 }); f.txt('phi', '1.618', 1530, y + 80, { size: 68, weight: 500, color: C.accentDeep }); }
    if (n >= 2) f.txt('r2', '$r^2 = r + 1$', 500, 500, { size: 60 });
    if (n >= 3) { f.txt('r', '$r = \\frac{1+\\sqrt5}{2} \\approx 1.618$', 1060, 500, { size: 54 }); f.txt('gold', '黄金分割数', 1500, 500, { size: 40, color: C.accentDeep }); }
    if (n >= 4) { f.txt('fal', '课件的近似式', 540, 730, { size: 32, color: C.mute }); f.txt('fa', '$F_i \\approx \\frac{1}{\\sqrt5}\\left(\\frac{1+\\sqrt5}{2}\\right)^i$', 1000, 730, { size: 56 }); }
  };
  V.SCENES.p1ratio = V.frames([
    // 〔相邻斐波那契数的比……箭头指向 1.618；写 r² = r + 1，r = (1+√5)/2，黄金分割数；下面是课件的近似式〕
    ['d39', f => growth(f, 0)],
    ['d39', f => growth(f, 1), { off: 3.8 }],
    ['d42', f => growth(f, 2), { off: 2.8 }],
    ['d43', f => growth(f, 3), { off: 0.3 }],
    ['d43', f => growth(f, 4), { off: 2.9 }],
  ]);

  // ---- p1bound：1.44 倍；一百万个节点时两种树的高度 ----
  const HA = '$h \\lesssim \\log_{1.618} N$', HB = '$\\approx 1.44\\,\\log_2 N$';
  // 这条式子分两段写：先只有前一段，居中；k 从 0 到 1 时后一段接上来，两段合起来居中
  function bound(x, y, k, size, tone) {
    const o = { size }, wa = V.measure(HA, o), wb = V.measure(HB, o), gap = size * 0.3, left = x - V.lerp(wa, wa + gap + wb, k) / 2;
    V.txt(HA, left, y, { size, color: tone, align: 'left' });
    V.txt(HB, left + wa + gap, y, { size, color: tone, align: 'left', alpha: k });
  }
  const U = 34, X0 = 600, M = D.million;
  // n：0 前一段　1 后一段　2 准确的式子　3 两条横条
  const last = (f, n) => {
    const y = n >= 3 ? 235 : 400;                                     // 横条出来之前，式子放在中间
    f.add('hb', bound, 960, y, n >= 1 ? 1 : 0, 68, C.accentDeep);
    if (n >= 2) f.txt('hp', '$h < 1.4405\\log_2(N+2) - 1.327$', 960, y + 110, { size: 40, color: C.mute });
    if (n >= 3) {
      f.txt('mt', '一百万个节点', 960, 500, { size: 40 });

      f.txt('mv1', '高 ' + M.complete, X0 + M.complete * U + 28, 610, { size: 42, align: 'left' });
      f.txt('m2', 'AVL 树', X0 - 30, 720, { size: 36, color: C.mute, align: 'right', delay: 1 }); f.rrect('mb2', X0, 694, M.avl * U, 52, 10, { fill: C.accent, stroke: C.ink, w: 2, delay: 1 });
      f.txt('mv2', '最高 ' + M.avl, X0 + M.avl * U + 28, 720, { size: 42, color: C.accentDeep, align: 'left', delay: 1 });
    }
  };
  V.SCENES.p1bound = V.frames([
    // 〔写 h ≲ log_{1.618} N ≈ 1.44 log₂N，下面是准确的式子；再下面两条横条对比：一百万个节点，完全二叉树高 19，AVL 树最高 27〕
    ['d48', f => last(f, 0)],
    ['d50', f => last(f, 1)],
    ['d50', f => last(f, 2), { off: 2.0 }],
    ['d51', f => last(f, 3), { off: 0.2 }],
  ]);
})();

<script>
'use strict';
/* 第 5、6 两幕共用的画法：单旋、双旋的一般图在各个时刻的样子，由方框的高矮算平衡因子，方框旁的三种记号。
   一般图里节点和方框都按中序排列：旋转时它们只上下移动。左右对调（LL、RL）时里面的名字不跟着换，
   所以从一边换到另一边，每样东西自己滑到对面去，只是方框上的字换了。 */
(() => {
  const { C } = V, K = V.cast;
  const col = (G, c) => G.x + c * G.dx, lev = (G, d) => G.y + d * G.u;

  /* 由方框的高矮算出各节点的平衡因子：谁在左谁在右看列，方框多高看 h 和 grow（以一层 G.u 为单位）。
     st.edges 都写成 [上, 下]。返回 { A: 数, B: 数, ... } */
  function bfs(st, G) {
    const kids = {}, out = {}, cOf = n => (st.nodes[n] || st.boxes[n]).c;
    for (const [p, q] of st.edges) (kids[p] = kids[p] || []).push(q);
    const height = n => {
      const b = st.boxes[n]; if (b) return (b.h + (b.grow || 0)) / G.u;
      const ks = kids[n] || [], l = ks.find(k => cOf(k) < cOf(n)), r = ks.find(k => cOf(k) > cOf(n)), hl = l ? height(l) : 0, hr = r ? height(r) : 0;
      out[n] = Math.round(hl - hr); return Math.max(hl, hr) + 1;
    };
    height(Object.keys(st.nodes).find(n => !st.edges.some(e => e[1] === n)));
    return out;
  }
  const setBf = (st, G) => { const b = bfs(st, G); for (const n in st.nodes) st.nodes[n].bf = b[n]; return st; };

  /* 单旋的一般图（RR）。s：pre0 插入前，pre 插入后，int 转了、中间那棵脱开还没人接，post 转完。
     o.mirror 左右对调成 LL；o.mid 长高的是中间那棵；o.bf 标平衡因子；o.tex 换方框上的字；o.hot 描出哪个方框 */
  function single(s, G, o = {}) {
    const up = s === 'int' || s === 'post', g = s === 'pre0' ? 0 : G.u, m = !!o.mirror, c = k => (m ? 4 - k : k);
    const t = o.tex || (m ? { AL: '$A_R$', BL: '$B_R$', BR: '$B_L$' } : { AL: '$A_L$', BL: '$B_L$', BR: '$B_R$' });
    const edges = [up ? ['B', 'A'] : ['A', 'B'], ['A', 'AL'], ['B', 'BR']];
    if (s !== 'int') edges.push([s === 'post' ? 'A' : 'B', 'BL']);
    const st = {
      nodes: { A: { c: c(1), d: up ? 1 : 0, role: o.roleA }, B: { c: c(3), d: up ? 0 : 1, role: 'b' } },
      boxes: {
        AL: { c: c(0), d: up ? 2 : 1, h: G.H, tex: t.AL },
        BL: { c: c(2), d: 2, h: G.H, grow: o.mid ? g : 0, tex: t.BL, role: o.hot === 'BL' ? 'hot' : undefined },
        BR: { c: c(4), d: up ? 1 : 2, h: G.H, grow: o.mid ? 0 : g, tex: t.BR },
      },
      edges, edgeOpt: o.edgeOpt,
    };
    return o.bf ? setBf(st, G) : st;
  }

  /* 双旋的一般图（LR）。s：pre0、pre、mid（先在下面转了一次）、post。o.side：新节点落在 C 的哪一边（L 或 R）。
     o.mirror 左右对调成 RL，这时里面叫 L 的那一边画出来是 C_R */
  function double(s, G, o = {}) {
    const g = s === 'pre0' ? 0 : G.u, side = o.side || 'L', m = !!o.mirror, c = k => (m ? 6 - k : k);
    const t = o.tex || (m ? { BL: '$B_R$', CL: '$C_R$', CR: '$C_L$', AR: '$A_L$' } : { BL: '$B_L$', CL: '$C_L$', CR: '$C_R$', AR: '$A_R$' });
    const dA = s === 'post' ? 1 : 0, dB = s === 'mid' ? 2 : 1, dC = s === 'post' ? 0 : s === 'mid' ? 1 : 2, low = s === 'pre0' || s === 'pre';
    const edges = low ? [['A', 'B'], ['B', 'C'], ['B', 'BL'], ['C', 'CL'], ['C', 'CR'], ['A', 'AR']]
      : s === 'mid' ? [['A', 'C'], ['C', 'B'], ['B', 'BL'], ['B', 'CL'], ['C', 'CR'], ['A', 'AR']]
        : [['C', 'B'], ['C', 'A'], ['B', 'BL'], ['B', 'CL'], ['A', 'CR'], ['A', 'AR']];
    const st = {
      nodes: { A: { c: c(5), d: dA, role: o.roleA }, B: { c: c(1), d: dB, role: 'b' }, C: { c: c(3), d: dC, role: 'c' } },
      boxes: {
        BL: { c: c(0), d: dB + 1, h: G.H, tex: t.BL },
        CL: { c: c(2), d: low ? 3 : dB + 1, h: G.H - G.u, grow: side === 'L' ? g : 0, tex: t.CL },
        CR: { c: c(4), d: low ? 3 : s === 'mid' ? dC + 1 : dA + 1, h: G.H - G.u, grow: side === 'R' ? g : 0, tex: t.CR },
        AR: { c: c(6), d: dA + 1, h: G.H, tex: t.AR },
      },
      edges, edgeOpt: o.edgeOpt,
    };
    return o.bf ? setBf(st, G) : st;
  }
  const hotEdge = (...pairs) => Object.fromEntries(pairs.map(p => [p, { color: C.accent, w: 7 }]));

  // 方框旁的三种记号：up 升一层，down 降一层，same 深度不变。两幕里都是这一个样子
  function sign(x, y, kind) {
    if (kind === 'same') { V.line(x - 24, y - 11, x + 24, y - 11, { color: C.accent, w: 7 }); V.line(x - 24, y + 11, x + 24, y + 11, { color: C.accent, w: 7 }); return; }
    const d = kind === 'up' ? 1 : -1; V.arrow(x, y + d * 58, x, y - d * 58, { color: C.accent, w: 7 });
  }
  // 给几个方框各放一个记号。list = [[方框名, 哪一种], ...]；side −1 放在方框左边，1 放在右边；each 是一个比一个晚出来几秒
  function marks(f, G, st, list, side = -1, each = 0) {
    list.forEach(([name, kind], i) => { const b = st.boxes[name]; f.add('mk' + name, sign, col(G, b.c) + side * (G.bw / 2 + 48), lev(G, b.d) - G.r + 115, kind, { delay: i * each }); });
  }
  const big = (f, s, x, y, size = 110) => f.txt('big', s, x, y, { size, weight: 500, color: C.accentDeep });

  V.rotlib = { col, lev, bfs, setBf, single, double, hotEdge, sign, marks, big };
})();

<script>
'use strict';
/* 第 6 幕 拐弯的情形，和一次插入的代价。
   zig 3、1、2，单旋不管用，转两次；lr LR 的一般图；rl 左右对调；four 四种情形怎么分；back 转完高度复原；cost 一次插入多快；code 写成程序。

(() => {

    ['f3', f => { zt(f, D.wrong, { role: { 2: 'new', 1: 'bad' } }); name(f); }, { off: 2.3 }],
    ['f4', failed],
    // 回到折线，转两次
    ['f8', f => { bent(f); name(f); }, { off: -3.0 }],
    ['f8', f => { zt(f, Z[2].mid, { role: { 2: 'hot', 3: 'bad' } }); name(f); }, { off: -1.7, dur: 1.5 }],
    ['f9', f => { zt(f, Z[2].after, { role: { 2: 'hot' } }); name(f); }, { off: 0.2, dur: 1.5 }],
    ['f9', f => { zt(f, Z[2].after, { role: { 2: 'hot' } }); name(f); f.txt('big2', '双旋', 1330, 580, { size: 90, weight: 500 }); }, { off: 3.2 }],
  ]);

  const TX = 1420, TC = [1610, 1690, 1770];

  };
  // 转完：四个记号、同一深度的线；n 2 标出平衡因子，3 加旁注
  const done = (f, n) => {
    const st = double('post', G7, { bf: n >= 2 }), y = lev(G7, 2) - G7.r - 16;
    f.line('lv', col(G7, 0) - 105, y, col(G7, 6) + 105, y, { color: C.accent, w: 3, dash: [12, 8], delay: 1.3 });
    K.general(f, 'D', G7, st); tag(f, 'LR');

<script>
'use strict';
/* 第 7 幕 十二个月份（months、built），第 8 幕 删除（del、del0）。
   画面只跟讲稿里的〔画面〕行走：一场一棵树留在场上，一行〔画面〕是它的一串动作，用 off 排开；别的句子画面不动。
   屏幕上的字只有〔画面〕行里写的那些和几个字的短标签，数和结构都取自 V.data。 */
(() => {
  const { C, CAT } = V, K = V.cast, D = V.data;

  // ---- 月份这棵树：全片固定十二列（按字母排好），节点落在自己那一列上 ----
  const M = D.months, INS = M.map(s => s.key), FINAL = M[11].after;
  const ML = { x: 960, y: 300, dx: 140, dy: 130, r: 46, size: 28, bfSize: 28, slots: D.order };
  const colX = i => ML.x + (i - 5.5) * ML.dx;
  const nodeOf = (snap, k) => snap.nodes.find(q => q.k === k);

  // 顶上一行是放进去的顺序（cur 是正在放的第几个，null 不画），底下一行是字母顺序（on 是此刻要点出的键）
  const rows = (f, cur, on) => {
    if (cur !== null) INS.forEach((k, i) => f.txt('in' + i, k, 960 + (i - 5.5) * 132, 168, { size: 32, weight: i === cur ? 700 : 400, color: i === cur ? C.accentDeep : i < cur ? C.faint : C.ink }));
    D.order.forEach((k, i) => f.txt('al' + i, k, colX(i), 905, { size: 26, weight: k === on ? 700 : 400, color: k === on ? C.accentDeep : C.mute }));
  };

  /* 把一棵树登记进一帧。st 里：snap 哪一棵；role、path 同 K.tree；
     bfv 盖住数据里的平衡因子（还没更新到的先标旧值）；lit 这些键的平衡因子用强调色，bfText 把某个键的平衡因子换成一段字；
     steps 头两步 [[上, 下, 'L' 或 'R'], ...]，边加粗，字母标在边旁；kind 属于哪一种，写成大字；drop 这一帧刚落下的键 */
  function grove(f, st, id = 'M', lay = ML) {
    const snap = st.snap, lit = st.lit || [], word = st.bfText || {}, P = K.place(snap, lay), r = lay.r;
    const val = k => (st.bfv && st.bfv[k] !== undefined ? st.bfv[k] : nodeOf(snap, k).bf);
    const path = st.path || (st.steps ? st.steps.map(([a, b]) => [b, a]) : undefined);
    K.tree(f, id, snap, lay, { bf: k => !lit.includes(k), bfOf: val, role: st.role, path, delay: st.drop ? (k => (k === st.drop ? 0.35 : 0)) : undefined });
    for (const k of lit) {
      const v = val(k), off = Math.abs(v) > 1;
      f.txt(`${id}-b-${k}`, word[k] || K.bfText(v), P[k].x + r * 0.78, P[k].y - r * 1.02, { size: lay.bfSize, weight: 700, color: off ? C.bad : (st.litColor ? C[st.litColor] : CAT[1]), align: 'left', alpha: 1, halo: 8, delay: 0 });
    }
    (st.steps || []).forEach(([a, b, ch], i) => {
      const A = P[a], B = P[b], len = Math.hypot(B.x - A.x, B.y - A.y); let nx = -(B.y - A.y) / len, ny = (B.x - A.x) / len; if (ny > 0) { nx = -nx; ny = -ny; }
      f.txt(`${id}-step${i}`, ch, (A.x + B.x) / 2 + nx * 36, (A.y + B.y) / 2 + ny * 36, { size: 36, weight: 700, color: C.accentDeep, halo: 8 });
    });
    if (st.kind) f.txt(`${id}-kind`, st.kind, (st.kindAt || [1680, 300])[0], (st.kindAt || [1680, 300])[1], { size: st.kindSize || 96, weight: 500, color: C.accentDeep });
    return P;
  }
  // 下一个要落下的节点，先在它的位置上方藏着（看不见），到了下一帧自己落下来
  const ghost = (f, g) => { const p = K.place(g.snap, ML)[g.k], s = K.STYLE('new'); f.add('M-n-' + g.k, K.disc, p.x, p.y - 80, ML.r, g.k, { fill: s.fill, ink: s.ink, stroke: s.stroke, ring: s.ring, alpha: 0, size: ML.size, delay: 0 }); };

  function months(f, s) {
    rows(f, s.cur === undefined ? -1 : s.cur, s.cur >= 0 ? INS[s.cur] : null);
    if (s.slot) {                                           // 空树：第一个节点要落的位置，旁边标出那个数是 BF

      f.txt('M-b-' + INS[0], 'BF', x + ML.r * 0.78, y - ML.r * 1.02, { size: ML.bfSize, weight: 500, color: C.mute, align: 'left', alpha: 1, halo: 8, delay: 0 });

  const seq = [];
  const put = (key, off, st, dur = 0.6) => seq.push({ key, off, st, dur });
  // 放进第 i 个之后的样子。which 是 placed（刚放进去）、mid（双旋转了一半）、after（转完）
  const st = (i, which, o = {}) => ({ cur: i, snap: M[i][which], lit: which === 'placed' ? M[i].changed : [], ...o, role: { [M[i].key]: 'new', ...(o.role || {}) } });
  const before = i => { const b = Object.fromEntries((i ? M[i - 1].after.nodes : []).map(n => [n.k, n.bf])); b[M[i].key] = 0; return b; };
  // 放进第 i 个：节点落下，然后这条路上变了的平衡因子从下往上一个一个更新
  function drop(i, key, t, tick = 0.5) {
    const m = M[i], now = before(i), lit = [];
    put(key, t, st(i, 'placed', { bfv: { ...now }, lit: [], drop: m.key }), 0.7); t += 0.8;
    for (const u of [...m.changed].reverse()) { now[u] = nodeOf(m.placed, u).bf; lit.push(u); put(key, t, st(i, 'placed', { bfv: { ...now }, lit: [...lit] }), 0.35); t += tick; }
  }

  const way = i => { const s = [...M[i].path, M[i].key]; return s.slice(1).map((k, j) => [s[j], k]); };
