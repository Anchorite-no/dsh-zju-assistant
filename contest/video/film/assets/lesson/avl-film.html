  // 〔顶上一行是放进去的顺序；底下一行是字母顺序；中间一棵空树，节点旁标 BF〕
  put('g1', 0, {});
  put('g3', 0, { slot: true });
  // 〔放进 Mar、May、Nov，Mar 是 −2，RR 旋转，May 升上来〕
  drop(0, 'g6', -3.4);
  drop(1, 'g6', -2.5);
  drop(2, 'g6', -1.0);
  put('g6', 2.0, st(2, 'placed', { role: bad('Mar') }), 0.5);
  put('g6', 2.7, st(2, 'placed', { role: bad('Mar'), steps: two(2), kind: M[2].kind }), 0.5);
  put('g6', 4.3, st(2, 'after', { role: { Mar: 'bad', May: 'hot' }, kind: M[2].kind }), 1.4);
  put('g6', 5.9, st(2, 'after', { role: { May: 'hot' }, kind: M[2].kind }), 0.4);
  // 〔放进 Aug，不旋转；放进 Apr，Mar 和 May 都是 2，都标红；在靠下的 Mar 处 LL 旋转；May 回到 1〕
  drop(3, 'g7', -3.2);
  drop(4, 'g7', 0.3);
  put('g8', -0.2, st(4, 'placed', { role: bad('Mar', 'May') }), 0.5);
  put('g8', 1.2, st(4, 'placed', { role: bad('Mar', 'May'), steps: two(4), kind: M[4].kind }), 0.5);
  put('g8', 3.0, st(4, 'after', { role: { Mar: 'bad', May: 'bad', Aug: 'hot' }, bfv: { May: 2 }, kind: M[4].kind }), 1.4);
  put('g8', 4.6, st(4, 'after', { role: { May: 'bad', Aug: 'hot' }, bfv: { May: 2 }, kind: M[4].kind }), 0.4);
  put('g9', 0.2, st(4, 'after', { role: { May: 'soft' }, lit: ['May'] }));
  // 〔放进 Jan，只有根 May 是 2，头两步先左后右；LR 双旋分两步演，Mar 成为根，新来的 Jan 改挂到 Aug 的右边〕
  drop(5, 'g10', -3.6);
  put('g10', 0.0, st(5, 'placed', { role: bad('May') }), 0.5);
  put('g10', 0.8, st(5, 'placed', { role: bad('May'), steps: two(5), kind: M[5].kind }), 0.5);
  put('g10b', 0.2, st(5, 'mid', { role: { May: 'bad', Mar: 'hot' }, kind: M[5].kind, path: [['Jan', 'Aug']] }), 1.4);
  put('g10b', 2.3, st(5, 'after', { role: { May: 'bad', Mar: 'hot' }, kind: M[5].kind, path: [['Jan', 'Aug']] }), 1.4);
  put('g10b', 3.9, st(5, 'after', { role: { Mar: 'hot' }, kind: M[5].kind, path: [['Jan', 'Aug']] }), 0.4);
  // 〔放进 Dec，不旋转；放进 July，不旋转，只有 Jan 的 BF 变了，从 1 变成 0〕
  drop(6, 'g11', -3.6);
  put('g11', 0.1, st(7, 'placed', { bfv: before(7), lit: [], drop: 'July' }), 0.7);
  put('g11', 1.1, st(7, 'placed', { role: { Jan: 'soft' }, bfText: { Jan: `${before(7).Jan} → ${nodeOf(M[7].placed, 'Jan').bf}` } }), 0.5);
  // 〔放进 Feb，Aug 是 −2，根 Mar 是 2，都标红；多停一会儿；然后在靠下的 Aug 处，头两步先右后左，RL 双旋，Dec 升上来，Mar 回到 1〕
  drop(8, 'g13', 0.2);
  put('g14', 0.0, st(8, 'placed', { role: bad('Aug', 'Mar') }), 0.5);
  put('g14b', 0.2, st(8, 'placed', { role: bad('Aug', 'Mar'), steps: two(8), kind: M[8].kind }), 0.5);
  put('g14c', 0.2, st(8, 'mid', { role: { Aug: 'bad', Mar: 'bad', Dec: 'hot' }, kind: M[8].kind }), 1.4);
  put('g14c', 2.3, st(8, 'after', { role: { Aug: 'bad', Mar: 'bad', Dec: 'hot' }, bfv: { Mar: 2 }, kind: M[8].kind }), 1.4);
  put('g14c', 4.3, st(8, 'after', { role: { Dec: 'hot', Mar: 'soft' }, lit: ['Mar'], kind: M[8].kind }));
  // 〔放进 June，落在深度 4，只有根 Mar 是 2；标出整条路，头两步先左后右；LR 双旋，Jan 成为根，Feb 改挂到 Dec 的右边，July 连同 June 改挂到 Mar 的左边〕
  drop(9, 'g15', -1.4);
  put('g15', 2.2, st(9, 'placed', { role: bad('Mar'), path: way(9), deep: 'June' }));
  put('g16', 0.3, st(9, 'placed', { role: bad('Mar'), steps: two(9), kind: M[9].kind, deep: 'June' }));
  put('g16c', 0.2, st(9, 'mid', { role: { Mar: 'bad', Jan: 'hot' }, kind: M[9].kind, path: [['Feb', 'Dec']] }), 1.4);
  put('g16c', 2.3, st(9, 'after', { role: { Mar: 'bad', Jan: 'hot' }, kind: M[9].kind, path: [['Feb', 'Dec'], ['July', 'Mar'], ['June', 'July']] }), 1.4);
  put('g16d', 0.4, st(9, 'after', { role: { Jan: 'hot' }, kind: M[9].kind, path: [['Feb', 'Dec'], ['July', 'Mar'], ['June', 'July']] }), 0.4);
  // 〔放进 Oct，May 是 −2，RR 旋转；放进 Sept，不旋转，从下往上 Oct、Nov、Mar、Jan 四个节点的 BF 依次变成 −1〕
  drop(10, 'g16b', -2.0);
  put('g16b', 1.0, st(10, 'placed', { role: bad('May') }), 0.5);
  put('g16b', 1.7, st(10, 'placed', { role: bad('May'), steps: two(10), kind: M[10].kind }), 0.5);
  put('g16b', 3.3, st(10, 'after', { role: { May: 'bad', Nov: 'hot' }, kind: M[10].kind }), 1.4);
  put('g16b', 4.9, st(10, 'after', { role: { Nov: 'hot' }, kind: M[10].kind }), 0.4);
  put('g17', 0.2, st(11, 'placed', { bfv: before(11), lit: [], drop: 'Sept' }), 0.7);
  const up = [...M[11].changed].reverse(), climb = way(11).reverse();
  up.forEach((k, n) => { const now = before(11); up.slice(0, n + 1).forEach(u => { now[u] = nodeOf(M[11].placed, u).bf; }); put('g19', -0.3 + n * 0.9, st(11, 'placed', { bfv: now, lit: up.slice(0, n + 1), path: climb.slice(0, n + 1) }), 0.5); });

  seq.forEach((e, j) => { if (e.st.drop && j) seq[j - 1].st = { ...seq[j - 1].st, ghost: { k: e.st.drop, snap: e.st.snap } }; });
  V.SCENES.months = V.frames(seq.map(e => [e.key, f => months(f, e.st), { off: e.off, dur: e.dur }]));

  // ---- built：建成的树，旁边几行字，和最少节点数的表 ----
  const KIDS = FINAL.nodes.filter(n => FINAL.nodes.some(q => q.p === n.k)).sort((a, b) => a.d - b.d || a.x - b.x).map(n => n.k);   // 有孩子的节点，从上往下
  if (KIDS.some(k => Math.abs(nodeOf(FINAL, k).bf) !== 1)) throw new Error('建成的树里有孩子的节点不全是 1 或 −1');
  const single = M.filter(m => m.kind && m.kind[0] === m.kind[1]).length, double = M.filter(m => m.kind && m.kind[0] !== m.kind[1]).length;
  const FACTS = [`${FINAL.nodes.length} 个节点，高度 ${FINAL.height}`, `${single} 次单旋，${double} 次双旋`, `找任何一个，最多比 ${FINAL.height + 1} 次`];
  if (D.nh[FINAL.height] !== FINAL.nodes.length) throw new Error('建成的树不是这个高度上节点最少的');
  const table = (f, on) => {
    const cx = i => 196 + i * 68, at = FINAL.height;
    if (on) f.rrect('cell', cx(at) - 31, 158, 62, 132, 12, { fill: C.wash, stroke: C.accent, w: 2.5 });
    f.txt('th', '$h$', 120, 192, { size: 34, color: C.mute }); f.txt('tn', '$n_h$', 120, 256, { size: 34, color: C.mute });
    D.nh.slice(0, 7).forEach((v, i) => {
      f.txt('h' + i, String(i), cx(i), 192, { size: 34, weight: on && i === at ? 700 : 400, color: on && i === at ? C.accentDeep : C.mute, delay: i * 0.08 });
      f.txt('n' + i, String(v), cx(i), 256, { size: 40, weight: on && i === at ? 700 : 400, color: on && i === at ? C.accentDeep : C.ink, delay: i * 0.08 });
    });
  };
  // o.facts 出了几行字；o.table 1 是表，2 是 n_4 那一格亮着；o.hot 有孩子的节点亮了几个
  function built(f, o = {}) {
    rows(f, null);
    const hot = KIDS.slice(0, o.hot || 0);
    grove(f, { snap: FINAL, role: Object.fromEntries(hot.map(k => [k, 'hot'])), lit: hot, litColor: 'accentDeep' });
    if (o.table) table(f, o.table > 1);
    FACTS.slice(0, o.facts || 0).forEach((s, i) => f.txt('fact' + i, s, 1340, 188 + i * 64, { size: 36, align: 'left' }));
  }
  const LAST = seq[seq.length - 1].st, DONE = { facts: 3, table: 2, hot: KIDS.length };
  // 〔建成的树停在中间，旁边写 12 个节点、高度 4，3 次单旋、3 次双旋，找任何一个最多比 5 次；有孩子的节点的 BF 都是 1 或 −1，逐个亮一下；调出最少节点数的表，n_4 = 12 那一格亮起〕
  V.SCENES.built = V.frames([
    [null, f => months(f, LAST)],
    ['g20', f => built(f, { facts: 1 }), { off: -0.5 }],
    ['g20', f => built(f, { facts: 1, table: 1 }), { off: 1.0 }],
    ['g20', f => built(f, { facts: 1, table: 2 }), { off: 2.8, dur: 0.5 }],
    ['g20', f => built(f, { facts: 2, table: 2 }), { off: 5.0 }],
    ['g20', f => built(f, { facts: 3, table: 2 }), { off: 7.0 }],
    ...KIDS.map((k, i) => ['g21', f => built(f, { facts: 3, table: 2, hot: i + 1 }), { off: 0.2 + i * 0.42, dur: 0.35 }]),
  ]);

  // ---- del：在这棵树上删 ----
  const DF = D.delFeb;
  const KINDS = [['没有孩子：Feb', '直接拿掉'], ['一个孩子：Aug', '孩子 Apr 顶上来'], ['两个孩子：Jan', '右子树里最小的 July 来顶替']];
  const RULES = [['变成 1 或 −1', '停'], ['变成 0', '继续往上'], ['变成 2 或 −2', '旋转']];
  // 删除时的头两步：第一步走向高的那个孩子，第二步看这个孩子自己哪边高（一样高就和第一步同向）
  const side = (snap, k, s) => snap.nodes.find(q => q.p === k && (s === 'L' ? q.x < nodeOf(snap, k).x : q.x > nodeOf(snap, k).x)).k;
  const twoDel = (snap, t) => { const s1 = nodeOf(snap, t).bf > 0 ? 'L' : 'R', a = side(snap, t, s1), ba = nodeOf(snap, a).bf, s2 = ba > 0 ? 'L' : ba < 0 ? 'R' : s1; return [[t, a, s1], [a, side(snap, a, s2), s2]]; };
  const kindOf = steps => steps.map(s => s[2]).join('');
  const T1 = twoDel(DF[1], 'Dec'), T2 = twoDel(DF[2], 'Jan');
  // 从一个节点指向另一个节点的箭头，贴着两个圆的外沿，off 是往旁边让开多少
  const point = (f, name, P, a, b, off) => {
    const A = P[a], B = P[b], len = Math.hypot(B.x - A.x, B.y - A.y), ux = (B.x - A.x) / len, uy = (B.y - A.y) / len, nx = uy, ny = -ux, g = ML.r + 14;
    f.arrow(name, A.x + ux * g + nx * off, A.y + uy * g + ny * off, B.x - ux * g + nx * off, B.y - uy * g + ny * off, { color: CAT[1], w: 6 });
  };
  /* o.kinds 三种节点指到了第几种，o.sub 第三种的做法也写出来了；o.lift [谁, 顶到谁的位置]；o.hole 空出来的位置；
     o.rules 往上走的规则；o.under 子树下面的一行字；o.sum 最后的两行出了几行 */
  function del(f, i, o = {}) {
    rows(f, null);
    const P = grove(f, { snap: DF[i], role: o.role, path: o.path, steps: o.steps, bfv: o.bfv, lit: o.lit, litColor: 'accentDeep', kind: o.kind, kindAt: [330, 250] });
    for (let n = 0; n < (o.kinds || 0); n++) {
      const on = n === o.kinds - 1, y = 182 + n * 112;
      f.txt('kd' + n, KINDS[n][0], 1330, y, { size: 34, weight: on ? 700 : 400, color: on ? C.accentDeep : C.mute, align: 'left' });
      if (n < 2 || o.sub) f.txt('ks' + n, KINDS[n][1], 1330, y + 46, { size: 30, color: on ? C.ink : C.mute, align: 'left' });
    }
    if (o.lift) point(f, 'lift-' + o.lift[0], P, o.lift[0], o.lift[1], o.lift[2] || 0);
    if (o.hole) { f.circle('hole', P[o.hole].x, P[o.hole].y, ML.r + 12, { stroke: CAT[1], w: 3, dash: [9, 9] }); f.txt('holeT', '空出来的位置', P[o.hole].x - 55, P[o.hole].y + 84, { size: 28, color: C.mute }); }
    if (o.rules) {
      f.txt('rh', '删除时往上走，平衡因子', 1420, 168, { size: 28, color: C.mute, align: 'left' });
      RULES.forEach(([a, b], n) => { f.txt('ra' + n, a, 1420, 224 + n * 54, { size: 34, align: 'left', delay: 0.4 + n * 0.5 }); f.txt('rb' + n, b, 1670, 224 + n * 54, { size: 34, weight: 500, color: C.accentDeep, align: 'left', delay: 0.4 + n * 0.5 }); });
    }
    if (o.under) f.txt('under', o.under[1], P[o.under[0]].x, P[o.under[0]].y + 225, { size: 32, color: C.accentDeep });
    if (o.sum >= 1) f.txt('sum1', `全树高度 ${DF[2].height} → ${DF[3].height}`, 330, 215, { size: 38 });
    if (o.sum >= 2) f.txt('sum2', '删一次，转了两处', 330, 285, { size: 38, color: C.accentDeep });
  }
  const three = { kinds: 3, sub: true, role: { Jan: 'hot', July: 'new' }, path: [['Mar', 'Jan'], ['July', 'Mar']], lift: ['July', 'Jan'] };
  const shrunk = ['Aug', `这棵子树：高度 ${nodeOf(DF[1], 'Dec').h} → ${nodeOf(DF[2], 'Aug').h}`];
  const stale = { Jan: nodeOf(DF[1], 'Jan').bf };           // LL 转完，根的平衡因子还没查到
  V.SCENES.del = V.frames([
    [null, f => built(f, DONE)],
    // 〔这棵树留着，依次指出三种节点：没有孩子的 Feb，直接拿掉；只有一个孩子的 Aug，孩子 Apr 顶上来；有两个孩子的 Jan，由右子树里最小的 July 顶替，空出来的是 July 原来的位置〕
    ['h1', f => del(f, 0), { off: -0.4 }],
    ['h2', f => del(f, 0, { kinds: 1, role: { Feb: 'hot' } }), { off: 1.6 }],
    ['h2', f => del(f, 0, { kinds: 2, role: { Aug: 'hot', Apr: 'new' }, lift: ['Apr', 'Aug', 26] }), { off: 4.3 }],
    ['h3', f => del(f, 0, { kinds: 3, role: { Jan: 'hot' } })],
    ['h4', f => del(f, 0, three), { off: 0.3 }],
    ['h6', f => del(f, 0, { ...three, hole: 'July' })],
    // 〔树回到原样，旁边列出删除时往上走的规则：变成 1 或 −1，停；变成 0，继续往上；变成 2 或 −2，旋转〕
    ['h7', f => del(f, 0, { rules: true }), { off: -0.3 }],
    // 〔删去 Feb，Dec 的 BF 变成 2；标出头两步，先向左到 Aug，Aug 自己也是左边高，所以是 LL；旋转，Aug 升上来，这棵子树旁标高度从 2 变成 1〕
    ['h14', f => del(f, 0, { rules: true, role: { Feb: 'hot' } }), { off: 0.2, dur: 0.5 }],
    ['h14', f => del(f, 1, { rules: true, bfv: { Dec: nodeOf(DF[0], 'Dec').bf } }), { off: 1.3, dur: 0.7 }],
    ['h14', f => del(f, 1, { rules: true }), { off: 2.2, dur: 0.4 }],
    ['h14b', f => del(f, 1, { rules: true, role: { Dec: 'bad' } }), { off: 0.0, dur: 0.5 }],
    ['h14b', f => del(f, 1, { rules: true, role: { Dec: 'bad' }, steps: T1.slice(0, 1) }), { off: 1.4, dur: 0.5 }],
    ['h14c', f => del(f, 1, { rules: true, role: { Dec: 'bad' }, steps: T1, lit: [T1[0][1]] }), { off: 0.2, dur: 0.5 }],
    ['h14c', f => del(f, 1, { rules: true, role: { Dec: 'bad' }, steps: T1, lit: [T1[0][1]], kind: kindOf(T1) }), { off: 2.8, dur: 0.5 }],
    ['h14c', f => del(f, 2, { rules: true, role: { Dec: 'bad', Aug: 'hot' }, bfv: stale, kind: kindOf(T1) }), { off: 4.4, dur: 1.4 }],
    ['h15', f => del(f, 2, { rules: true, role: { Aug: 'hot', Apr: 'soft', Dec: 'soft' }, bfv: stale, kind: kindOf(T1), under: shrunk }), { off: -0.2 }],
    // 〔根 Jan 的 BF 变成 −2，头两步都向右，RR 旋转，Mar 升为根，全树高度从 4 变成 3；写“删一次，转了两处”〕
    ['h19', f => del(f, 2, { rules: true, under: shrunk }), { off: 0.2, dur: 0.5 }],
    ['h19', f => del(f, 2, { rules: true, role: { Jan: 'bad' }, under: shrunk }), { off: 1.1, dur: 0.5 }],
    ['h19', f => del(f, 2, { rules: true, role: { Jan: 'bad' }, steps: T2, lit: [T2[0][1]], kind: kindOf(T2) }), { off: 2.3, dur: 0.5 }],
    ['h19', f => del(f, 3, { rules: true, role: { Jan: 'bad', Mar: 'hot' }, kind: kindOf(T2) }), { off: 4.4, dur: 1.4 }],
    ['h20', f => del(f, 3, { rules: true, role: { Mar: 'hot' }, sum: 1 })],
    ['h20', f => del(f, 3, { rules: true, role: { Mar: 'hot' }, sum: 2 }), { off: 1.6 }],
  ]);

  // ---- del0：高的那一侧的孩子两边一样高 ----
  const DZ = D.delZero, ZL = { x: 640, y: 300, dx: 170, dy: 200, r: 56, size: 52, bfSize: 34, slots: [...DZ[0].nodes.map(n => n.k)].sort((a, b) => a - b) };
  const gone = DZ[0].nodes.find(n => !nodeOf(DZ[1], n.k)).k, top = DZ[1].root, child = side(DZ[1], top, nodeOf(DZ[1], top).bf > 0 ? 'L' : 'R');
  if (nodeOf(DZ[1], child).bf !== 0) throw new Error('这个例子里高的那一侧的孩子应该是 0');
  const zkind = (nodeOf(DZ[1], top).bf > 0 ? 'LL' : 'RR') + ' 单旋';
  function dz(f, i, o = {}) {
    [0, 1, 2].forEach(d => f.line('lv' + d, 200, ZL.y + d * ZL.dy, 1080, ZL.y + d * ZL.dy, { color: C.faint, w: 2, dash: [6, 12] }));   // 三层的位置：转的时候看得出谁升了、谁没动
    grove(f, { snap: DZ[i], role: o.role, bfv: o.bfv, lit: o.lit, litColor: 'accentDeep' }, 'Z', ZL);
    if (o.kind) f.txt('zk', zkind, 1460, 300, { size: 72, weight: 500, color: C.accentDeep });
    f.txt('z0', `删之前：高度 ${DZ[0].height}`, 1460, 500, { size: 40 });
    if (o.after) f.txt('z1', `转之后：高度 ${DZ[2].height}`, 1460, 572, { size: 40, color: C.accentDeep });
  }
  // 〔换一棵小树 2(1,4(3,5))，删去 1；2 的 BF 变成 −2，它的右孩子 4 的 BF 是 0；RR 单旋，成 4(2(–,3),5)；高度前后都是 2〕
  V.SCENES.del0 = V.frames([
    ['h22', f => dz(f, 0)],
    ['h22', f => dz(f, 0, { role: { [gone]: 'hot' } }), { off: 1.2, dur: 0.5 }],
    ['h22', f => dz(f, 1, { bfv: { [top]: nodeOf(DZ[0], top).bf } }), { off: 2.1, dur: 0.6 }],
    ['h22', f => dz(f, 1), { off: 2.9, dur: 0.4 }],
    ['h23', f => dz(f, 1, { role: { [top]: 'bad', [child]: 'hot' }, lit: [child] }), { off: 0.2 }],
    ['h24', f => dz(f, 1, { role: { [top]: 'bad', [child]: 'hot' }, lit: [child], kind: true }), { off: 0.2 }],
    ['h24', f => dz(f, 2, { role: { [top]: 'bad', [child]: 'hot' }, kind: true }), { off: 1.4, dur: 1.4 }],
    ['h24', f => dz(f, 2, { role: { [child]: 'hot' }, kind: true }), { off: 3.0, dur: 0.4 }],
    ['h26', f => dz(f, 2, { role: { [child]: 'hot' }, kind: true, after: true })],
  ]);
})();

</script>
<script>
'use strict';
/* 第 9 幕 这条规矩松一点会怎样：relax（一条轴和一张表）、splay（两栏对比）、splaystep（伸展树的两种步子）、end（回到月份那棵树）。
   屏幕上的字只有〔画面〕行里写的那些，数取自 V.data。 */
(() => {
  const { C } = V, K = V.cast, D = V.data;

  // ---- relax：一条从紧到松的轴，下面一张三行的表 ----
  const STOPS = [['完全二叉树', '守不住'], ['高度差不超过 1', 'AVL 树'], ['不超过 2', ''], ['不超过 3', ''], ['伸展树', '']], sx = i => 260 + i * 350, AVL = 1;
  const axis = f => {
    f.arrow('ax', 180, 250, 1745, 250, { color: C.mute, w: 3 }); f.txt('axl', '紧', 130, 250, { size: 32, color: C.mute }); f.txt('axr', '松', 1795, 250, { size: 32, color: C.mute });
    STOPS.forEach(([s, sub], i) => {
      const on = i === AVL;
      f.circle('st' + i, sx(i), 250, on ? 16 : 10, { fill: on ? C.accent : C.paper, stroke: C.ink, w: 2.5 });
      f.txt('sl' + i, s, sx(i), 190, { size: 32, weight: on ? 700 : 400, color: on ? C.accentDeep : C.ink, delay: i * 0.3 });
      if (sub) f.txt('ss' + i, sub, sx(i), 308, { size: 30, weight: on ? 700 : 400, color: on ? C.accentDeep : C.bad, delay: i * 0.3 });
    });
  };
  const REC = ['$n_h = n_{h-1} + n_{h-2} + 1$', '$n_h = n_{h-1} + n_{h-3} + 1$', '$n_h = n_{h-1} + n_{h-4} + 1$'];
  const HK = ['$1.44\\log_2 N$', '$1.81\\log_2 N$', '$2.15\\log_2 N$'];
  D.k.forEach((v, i) => { if (!HK[i].includes(v.toFixed(2))) throw new Error('高度的倍数和 plan/code 算出来的不一致'); });
  const COLS = [205, 610, 1010, 1235, 1480, 1705];
  const HEAD = [null, ['最少节点数'], ['翻一倍'], ['高度最多约'], ['随机插入里', '要旋转的占'], ['1000 个节点的树', '平均高']];
  // n 是出到第几列（1 只有行名）。右边两列是试验结果，第 6 列比第 5 列晚一点出来
  const tableR = (f, n) => {
    f.line('hr', 100, 482, n > 4 ? 1825 : n > 3 ? 1370 : n > 2 ? 1100 : 880, 482, { color: C.hair, w: 2 });
    HEAD.forEach((h, c) => { if (h && c < n) h.forEach((s, j) => f.txt(`hd${c}${j}`, s, COLS[c], 442 - (h.length - 1 - j) * 38, { size: 28, color: C.mute, delay: c === 5 ? 0.9 : 0 })); });
    D.relax.forEach((r, i) => {
      const y = 560 + i * 122, late = { delay: 0.9 };
      f.txt('r' + i + '0', '允许差 ' + r.d, COLS[0], y, { size: 36, weight: i === 0 ? 700 : 400, color: i === 0 ? C.accentDeep : C.ink });
      if (n > 1) f.txt('r' + i + '1', REC[i], COLS[1], y, { size: 36 });
      if (n > 2) f.txt('r' + i + '2', `每 ${r.d + 1} 层`, COLS[2], y, { size: 34 });
      if (n > 3) f.txt('r' + i + '3', HK[i], COLS[3], y, { size: 36 });
      if (n > 4) f.txt('r' + i + '4', Math.round(r.rotate * 100) + '%', COLS[4], y, { size: 42 });
      if (n > 5) f.txt('r' + i + '5', r.height.toFixed(1), COLS[5], y, { size: 42, ...late });
    });
  };
  V.SCENES.relax = V.frames([
    // 〔一条横轴，从左到右越来越松：完全二叉树（守不住）、高度差不超过 1（AVL 树）、不超过 2、不超过 3、伸展树；AVL 树那一格亮着〕
    ['i1', f => axis(f)],
    // 〔轴的下面出一张三行的表，允许差 1、差 2、差 3，先出三列：递推式；每 2、3、4 层翻一倍；高度最多约 1.44、1.81、2.15 倍的 log N〕
    ['i4', f => { axis(f); tableR(f, 2); }],
    ['i5', f => { axis(f); tableR(f, 3); }, { off: 1.8 }],
    ['i6', f => { axis(f); tableR(f, 4); }, { off: 0.2 }],
    // 〔表的右边添两列试验结果：随机插入里要旋转的占 46%、21%、12%；1000 个节点的树平均高 11.0、12.2、13.5〕
    ['i7', f => { axis(f); tableR(f, 6); }, { off: 0.2 }],
  ]);

  // ---- splay：AVL 树和伸展树，两栏 ----
  const LEFT = 500, RIGHT = 1420;
  // n 是出到第几条：左栏 1 到 3，右栏 4 到 7
  const cards = (f, n) => {
    f.txt('ca', 'AVL 树', LEFT, 215, { size: 64, weight: 500, color: C.accentDeep });
    f.txt('a1', '每次操作最坏 $O(\\log N)$', LEFT, 360, { size: 38 });
    if (n >= 2) { f.txt('a2', '每个节点多存一个数', LEFT, 490, { size: 38 }); f.txt('a2b', '平衡因子或高度', LEFT, 545, { size: 30, color: C.mute }); }
    if (n >= 3) f.txt('a3', '每次插入、删除都要维护', LEFT, 675, { size: 38 });
    if (n >= 4) { f.line('mid', 960, 170, 960, 800, { color: C.hair, w: 2 }); f.txt('cb', '伸展树', RIGHT, 215, { size: 64, weight: 500 }); }
    if (n >= 5) f.txt('b1', '不存这个数，不保证平衡', RIGHT, 360, { size: 38 });
    if (n >= 6) f.txt('b2', '某一次操作可能慢到 $N$ 的量级', RIGHT, 490, { size: 38 });
    if (n >= 7) { f.txt('b3', '从空树开始连续 $M$ 次操作', RIGHT, 675, { size: 38 }); f.txt('b3b', '总共 $O(M\\log N)$', RIGHT, 735, { size: 38, color: C.accentDeep }); }
  };
  // 〔两栏对比。AVL 树：每次操作最坏 O(log N)；每个节点多存一个数（平衡因子或高度），每次插入、删除都要维护。伸展树：不存这个数，不保证平衡；某一次操作可能慢到 N 的量级；从空树开始连续 M 次操作，总共 O(M log N)〕
  V.SCENES.splay = V.frames([
    ['i10', f => cards(f, 1)],
    ['i10', f => cards(f, 2), { off: 1.6 }],
    ['i10', f => cards(f, 3), { off: 3.6 }],
    ['i11', f => cards(f, 4), { off: 0.2 }],
    ['i11', f => cards(f, 5), { off: 2.6 }],
    ['i12', f => cards(f, 6), { off: 0.1 }],
    ['i12', f => cards(f, 7), { off: 2.4 }],
  ]);

  // ---- splaystep：zig-zag 和 zig-zig ----
  const tri3 = (ks, ps, ds, xs) => ({ nodes: ks.map((k, i) => ({ k, p: ps[i], d: ds[i], x: xs[i], bf: 0 })) });
  const BENT = tri3(['G', 'P', 'X'], [null, 'G', 'P'], [0, 1, 2], [2, 0, 1]), XTOP = tri3(['X', 'P', 'G'], [null, 'X', 'X'], [0, 1, 1], [1, 0, 2]);              // 折线，和转两次以后
  const LINE = tri3(['G', 'P', 'X'], [null, 'G', 'P'], [0, 1, 2], [2, 1, 0]), PTOP = tri3(['P', 'X', 'G'], [null, 'P', 'P'], [0, 1, 1], [1, 0, 2]), XLINE = tri3(['X', 'P', 'G'], [null, 'X', 'P'], [0, 1, 2], [0, 1, 2]);   // 直线，转一次，转两次
  const big = (x, y) => ({ x, y, dx: 82, dy: 108, r: 38, size: 34 }), small = (x, y) => ({ x, y, dx: 60, dy: 78, r: 30, size: 28 });
  const X = { X: 'hot' };
  const go = (f, name, x, y, w, word, o = {}) => { f.arrow(name, x - w / 2, y, x + w / 2, y, { color: C.accent, w: 5, delay: o.delay || 0 }); if (word) f.txt(name + 't', word, x, y - 34, { size: 26, color: C.mute, delay: o.delay || 0 }); };
  // n：0 两个小图的起点，1 zig-zag 转完，2 AVL 单旋那一行，3 zig-zig 那一行
  const steps = (f, n) => {
    f.txt('zt', 'zig-zag', 400, 190, { size: 56, weight: 500 }); f.txt('zs', '折线', 570, 196, { size: 32, color: C.mute });
    K.tree(f, 'za', BENT, big(250, 440), { role: X });
    if (n >= 1) { go(f, 'zar', 440, 550, 110, '转两次'); K.tree(f, 'zb', XTOP, big(640, 495), { role: X }); f.txt('zc', 'X 到顶', 640, 720, { size: 32, color: C.accentDeep }); }
    f.line('mid', 850, 170, 850, 880, { color: C.hair, w: 2 });
    f.txt('it', 'zig-zig', 1300, 190, { size: 56, weight: 500, delay: 0.8 }); f.txt('is', '直线', 1465, 196, { size: 32, color: C.mute, delay: 0.8 });
    K.tree(f, 'ia', LINE, small(1080, 335), { role: X, delay: () => 0.8 });
    if (n >= 2) {
      f.txt('ih', 'AVL 的单旋：只转 P 和 G，P 到顶', 930, 268, { size: 30, align: 'left' });
      go(f, 'iar', 1235, 413, 80, '转 P、G'); K.tree(f, 'ib', PTOP, small(1390, 374), { role: X });
    }
    if (n >= 3) {
      f.txt('jh', 'zig-zig：先转 P 和 G，再转 X 和 P，X 到顶', 930, 590, { size: 30, color: C.accentDeep, align: 'left' });
      K.tree(f, 'ja', LINE, small(1080, 657), { role: X });
      go(f, 'jar', 1235, 735, 80, '转 P、G', { delay: 0.9 }); K.tree(f, 'jb', PTOP, small(1390, 696), { role: X, delay: () => 0.9 });
      go(f, 'jbr', 1545, 735, 80, '转 X、P', { delay: 1.9 }); K.tree(f, 'jc', XLINE, small(1700, 657), { role: X, delay: () => 1.9 });
    }
  };
  // 〔两个小图，三个节点从下到上叫 X、P、G。zig-zag：折线，转两次，X 到顶。zig-zig：直线；上面一行是 AVL 的单旋，只转 P 和 G，P 到顶；下面一行是 zig-zig，先转 P 和 G，再转 X 和 P，X 到顶〕
  V.SCENES.splaystep = V.frames([
    ['i13', f => steps(f, 0)],
    ['i15', f => steps(f, 1)],
    ['i17', f => steps(f, 2)],
    ['i18', f => steps(f, 3)],
  ]);

  // ---- end：课件留下的问题，然后回到月份建成的那棵树 ----
  const FINAL = D.months[D.months.length - 1].after, ML = { x: 960, y: 300, dx: 140, dy: 130, r: 46, size: 28, bfSize: 28, slots: D.order };
  if (D.k[0].toFixed(2) !== '1.44') throw new Error('1.44 和 plan/code 算出来的不一致');
  const SUM = [['每个节点两边的高度最多差 1', 0], ['树高在 $1.44\\log_2 N$ 以内', 64], ['插入后沿一条路往上查，', 128], ['最多在一处旋转', 174]];
  const end = f => {
    D.order.forEach((k, i) => f.txt('al' + i, k, ML.x + (i - 5.5) * ML.dx, 905, { size: 26, color: C.mute }));
    K.tree(f, 'M', FINAL, ML, { bf: true });
    SUM.forEach(([s, dy], i) => f.txt('e' + i, s, 1320, 180 + dy, { size: 34, align: 'left', delay: [0.6, 2.8, 5.0, 5.0][i] }));
  };
  // 〔课件留下的问题：伸展树真的比 AVL 树好吗？随后回到月份建成的那棵树，旁边三行：每个节点两边的高度最多差 1；树高在 1.44 log N 以内；插入后沿一条路往上查，最多在一处旋转〕
  V.SCENES.end = V.frames([
    ['i19', f => { f.txt('q0', '课件留下的问题', 960, 410, { size: 32, color: C.mute }); f.txt('q1', '伸展树真的比 AVL 树好吗？', 960, 510, { size: 72, weight: 500, delay: 0.7 }); }],
    ['i21', f => end(f), { off: -0.6 }],
  ]);
})();
