<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>B · 品牌蓝色场</title>
<link rel="stylesheet" href="common.css">
<style>
  #film { background: radial-gradient(1500px 1000px at 18% 0%, #5c8bff 0%, #4176e6 46%, #2f5fcc 100%); color: #fff; }
  .pre { position: absolute; left: 130px; top: 250px; font-size: 30px; font-weight: 500; opacity: .82; letter-spacing: .04em; }
  .pre s { opacity: .7; }
  .num { position: absolute; left: 112px; top: 300px; font: 800 400px/1 "Inter"; letter-spacing: -.05em; }
  .lbl { position: absolute; left: 130px; top: 720px; font-size: 72px; font-weight: 700; }
  .cap { position: absolute; left: 132px; top: 830px; font-size: 30px; opacity: .82; }
  .stack { position: absolute; left: 960px; top: 150px; width: 860px; height: 800px; transform: rotate(-3deg); }
  .notice { left: 0; width: 860px; color: var(--ink); box-shadow: 0 30px 60px rgba(10,30,90,.28); }
  .notice .t { font-size: 24px; }
  .notice .dot { flex: none; margin-left: auto; padding: 6px 14px; border-radius: 999px; background: #fff1e6; color: var(--orange); font-size: 18px; font-weight: 500; }
  .notice.off { background: rgba(255,255,255,.18); color: rgba(255,255,255,.75); box-shadow: none; transform-origin: 50% 100%; }
  .notice.off .m { color: rgba(255,255,255,.6); }
  .pill { position: absolute; left: 60px; top: 680px; padding: 16px 26px; border-radius: 999px; background: rgba(15,17,21,.22); font-size: 24px; font-weight: 500; }
  .pill b { font: 800 30px "Inter"; margin-right: 8px; }
</style></head>
<body><div id="film">
  <div class="pre">一周 56 条通知和推文 · 20 秒筛完</div>
  <div class="num">23</div>
  <div class="lbl">条和你有关</div>
  <div class="cap">按你的学院、年级、校区逐条判断，拿不准的留下</div>
  <div class="stack">
    <div class="notice" style="top:0"><div><div class="t">关于做好2026-2027学年秋冬学期第三轮选课工作的通知</div><div class="m"><b>教务网</b>今天</div></div><span class="dot">和你有关</span></div>
    <div class="notice" style="top:122px"><div><div class="t">计算机学院2026年本科生国家奖学金评选公示</div><div class="m"><b>计算机科学与技术学院</b>昨天</div></div><span class="dot">本学院</span></div>
    <div class="notice" style="top:244px"><div><div class="t">关于开展2026年秋季学期学生体质健康测试的通知</div><div class="m"><b>学工部</b>昨天</div></div><span class="dot">本科生</span></div>
    <div class="notice off" style="top:390px;transform:scale(.94)"><div><div class="t">关于申报2027年度科研项目的通知</div><div class="m"><b>科学技术研究院</b>昨天</div></div></div>
    <div class="notice off" style="top:478px;transform:scale(.88);opacity:.7"><div><div class="t">劳务派遣人员招聘公告</div><div class="m"><b>人力资源处</b>10月7日</div></div></div>
    <div class="notice off" style="top:552px;transform:scale(.82);opacity:.45"><div><div class="t">教职工秋季培训报名</div><div class="m"><b>工会</b>10月6日</div></div></div>
    <div class="pill"><b>33</b>条已收起 · 只收起，不删除</div>
  </div>
</div></body></html>
