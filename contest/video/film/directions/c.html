<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>C · 课表手账</title>
<link rel="stylesheet" href="common.css">
<style>
  #film { background:
      radial-gradient(1300px 900px at 30% 10%, rgba(255,255,255,.7), transparent 70%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .42  0 0 0 0 .45  0 0 0 .06 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"),
      #eef0f2; }
  .h { position: absolute; left: 110px; top: 90px; font-size: 60px; line-height: 1.2; font-weight: 700; }
  .sheet { position: absolute; left: 110px; top: 260px; width: 1180px; height: 760px; background: #fdfdfb; border-radius: 6px; transform: rotate(-1.2deg);
    box-shadow: 0 1px 0 #d9dde3, 0 22px 50px rgba(30,40,60,.12); }
  .grid { position: absolute; left: 40px; top: 30px; right: 40px; bottom: 30px; display: grid; grid-template-columns: 90px repeat(5, 1fr); grid-template-rows: 46px repeat(11, 1fr); }
  .grid > div { border-right: 1px solid #dfe4ec; border-bottom: 1px solid #dfe4ec; font-size: 17px; color: #6b7480; display: flex; align-items: center; justify-content: center; }
  .grid .hd { font-size: 20px; font-weight: 500; color: #2c333d; }
  .blk { position: absolute; border-radius: 8px; padding: 10px 12px; font-size: 19px; font-weight: 500; line-height: 1.35; color: #1f2a3a; }
  .blk small { display: block; font-size: 15px; font-weight: 400; color: #5b6573; }
  .card { position: absolute; background-image: url(../assets/shots/affairs.png); background-repeat: no-repeat; border-radius: 12px; box-shadow: 0 0 0 1px #e1e5ee, 0 18px 36px rgba(30,40,60,.16); }
  .tape { position: absolute; width: 120px; height: 34px; background: rgba(250,236,170,.75); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .hand { position: absolute; font-family: "LXGW WenKai"; color: #2449b8; font-size: 38px; line-height: 1.3; transform: rotate(-3deg); }
  svg.ink { position: absolute; inset: 0; }
</style></head>
<body><div id="film">
  <div class="h">同一门课的事，<br>排进同一张表</div>
  <div class="sheet">
    <div class="grid" id="grid"></div>
    <div class="blk" style="left:132px;top:78px;width:206px;height:118px;background:#e4edfd">大学物理（乙）Ⅱ<small>紫金港 东1A-201</small></div>
    <div class="blk" style="left:552px;top:78px;width:206px;height:118px;background:#e4edfd">大学物理（乙）Ⅱ<small>单周</small></div>
    <div class="blk" style="left:342px;top:200px;width:206px;height:118px;background:#e7f6ec">数据结构基础<small>曹西-503</small></div>
    <div class="blk" style="left:762px;top:200px;width:206px;height:118px;background:#e7f6ec">数据结构基础<small>实验 · 双周</small></div>
    <div class="blk" style="left:132px;top:384px;width:206px;height:118px;background:#f0ecfb">概率论与数理统计<small>东2-108</small></div>
    <div class="blk" style="left:552px;top:384px;width:206px;height:118px;background:#fff1e6">心理学及应用<small>西1-404</small></div>
    <div class="blk" style="left:552px;top:568px;width:206px;height:118px;background:#e4edfd;box-shadow:inset 0 0 0 2px #4176e6">第二章 在线测验<small>大学物理（乙）Ⅱ</small></div>
    <div class="blk" style="left:342px;top:568px;width:206px;height:118px;background:#eef1f5">计算机组成<small>曹西-301</small></div>
  </div>
  <div class="card" style="left:1250px;top:300px;width:646px;height:92px;background-position:-495px -312px;transform:rotate(2deg)"></div>
  <div class="tape" style="left:1520px;top:282px;transform:rotate(-6deg)"></div>
  <div class="card" style="left:1290px;top:470px;width:560px;height:84px;background-position:-1195px -390px;background-size:auto;transform:rotate(-1.5deg)"></div>
  <div class="tape" style="left:1300px;top:452px;transform:rotate(8deg)"></div>
  <svg class="ink" viewBox="0 0 1920 1080">
    <path d="M1000,868 C1060,862 1130,866 1188,860" stroke="#ffe45c" stroke-width="30" stroke-linecap="round" fill="none" opacity=".8" style="mix-blend-mode:multiply"/>
    <path d="M700,800 C600,812 610,960 760,962 C900,964 950,900 920,840 C890,790 790,786 690,806" stroke="#2449b8" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M928,872 C950,868 966,866 986,866" stroke="#2449b8" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>
  <div class="hand" style="left:996px;top:836px">群里说 延后两天<br>改到周三 · 平台已同步</div>
</div>
<script>
  const g = document.getElementById('grid');
  const days = ['', '周一', '周二', '周三', '周四', '周五'];
  days.forEach(d => { const e = document.createElement('div'); e.className = 'hd'; e.textContent = d; g.appendChild(e); });
  for (let r = 1; r <= 11; r++) for (let c = 0; c < 6; c++) { const e = document.createElement('div'); if (c === 0) e.textContent = r; g.appendChild(e); }
</script>
</body></html>
