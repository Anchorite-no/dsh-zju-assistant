<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FAF9F5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23D97757'/%3E%3Cpath d='M12.5 9.5v13l10.5-6.5z' fill='%23FAF9F5'/%3E%3C/svg%3E">
<title>朗读器</title>
<style>
/* Modelled on Claude Desktop, measured from the real window.
   One page (--bg-100) runs under everything, title bar included. Three things stand on it, left to right.
   The sidebar: flat rows on the page under two tabs, dist as a file tree and the chapters of the lecture that is in.
   The window carries no sentences that explain how to use it: an empty list is empty, or says so in a few words.
   The picture: a card, a hairline round the page's own colour, that takes all the room the window has left, down to its
   bottom edge. The row over the picture (the title) and the row under it (the controls) are the same paper. The film is fitted
   into it whole, the way a player fits a video into its window, with the film's own ground colour around it where the
   two shapes differ; its controls are the card's bottom row. Only the size of the window ever resizes the picture.
   The captions: a second part of the same card, right of the picture and as tall, opened from the top right corner.
   The window itself grows to the right to make their room (showList), so opening them leaves the picture as it was.
   Parts are joined by shared edges and a shared top row, not by rules: the only hairline between a header and its
   list appears while the list is scrolled.
   Shadows are for what floats (menus, the toast). Buttons, rows and chips are flat and answer with a fill. */
*{box-sizing:border-box}
:root{color-scheme:light;
  --bg-000:#FFFFFF;--bg-100:#FAF9F5;--bg-200:#F5F4ED;--bg-300:#F0EEE6;--bg-400:#E8E6DC;
  --text-100:#141413;--text-300:#3D3D3A;--text-400:#73726C;--text-500:#9C9A92;
  --accent:#D97757;--accent-deep:#C6613F;
  --hair:rgba(31,30,29,.15);--hair-soft:rgba(31,30,29,.08);
  --shadow-pop:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.09);
  --row:44px;
  /* one sans family throughout. No serif and no monospace: on Chinese Windows those fall to Songti faces, thin and sharp at UI sizes.
     "Learn Sans" is put together in FONT_CSS below: HarmonyOS Sans SC, the free face closest to PingFang, with Inter for Latin and digits. */
  --sans:"Learn Sans","Inter","HarmonyOS Sans SC","PingFang SC","Noto Sans SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif}
/* a window narrower than the parts need at their least scrolls sideways as a whole, so that nothing in it is cut or laid over
   anything else. The app's own window is never that narrow (min_size in app.py) */
html{height:100%;overflow:auto hidden}
body{height:100%;min-width:940px;margin:0;background:var(--bg-100);color:var(--text-100);font:14px/1.6 var(--sans);letter-spacing:.03em;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon{width:30px;padding:0;display:inline-grid;place-items:center;flex-shrink:0}
.icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}

/* left: the sidebar. Its button stays at the window's corner whether the sidebar is out or away */
#toggle-side{position:fixed;left:9px;top:15px;z-index:5}
.side{display:none;flex:0 0 232px;flex-direction:column;min-height:0;padding:8px 8px 0}
.sided .side{display:flex}
.side-head{display:flex;align-items:center;height:var(--row);padding-left:38px;flex-shrink:0}
.tabs{flex:1;display:flex;padding:2px;border-radius:9px;background:var(--bg-300)}
.tabs button{flex:1;height:26px;padding:0;border:0;border-radius:7px;background:none;color:var(--text-400);font-size:13px;letter-spacing:.1em;transition:background .12s,color .12s}
.tabs button:hover{color:var(--text-100)}
.tabs [aria-selected=true]{background:var(--bg-000);color:var(--text-100);box-shadow:0 0 0 .5px var(--hair)}
.pane{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:8px}
.pane[hidden]{display:none}
.rows{flex:1;min-height:0;overflow-y:auto;padding-bottom:12px;scrollbar-width:thin;scrollbar-color:#DDDAD0 transparent}
.rows button{display:flex;align-items:flex-start;gap:6px;width:100%;padding:5px 10px 6px;margin-bottom:1px;border:0;border-radius:8px;background:none;color:var(--text-300);
  font-size:13.5px;line-height:22px;letter-spacing:.05em;text-align:left;overflow-wrap:anywhere;transition:background .12s,color .12s}
.rows button:hover{background:var(--bg-200);color:var(--text-100)}
.rows button:active{background:var(--bg-300)}
.rows button:focus-visible{outline-offset:-2px}
.rows [aria-current=true]{background:var(--bg-300);color:var(--text-100);font-weight:500}
/* the file tree, dist and the folders in it. A folder's row opens and shuts it, and what is in it stands further in (drawShelf sets
   each row's indent). Where there are folders at all (.deep) a file's row leaves the arrow's width free, so that the names line up.
   The lecture in the frame, when it has been built again since it was loaded, carries a dot */
.rows .dir svg{flex:0 0 12px;height:12px;margin-top:5px;fill:none;stroke:var(--text-500);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .12s}
.rows .dir[aria-expanded=true] svg{transform:rotate(90deg)}
.rows.deep button:not(.dir)::before{content:"";flex:0 0 12px}
.rows .fresh::after{content:"";flex:0 0 6px;height:6px;margin:8px 0 0 auto;border-radius:50%;background:var(--accent)}
/* a chapter: its number and its name */
.parts button{display:grid;grid-template-columns:18px 1fr;gap:0 10px}
.parts .no{line-height:22px;text-align:left}
.parts [aria-current=true] .no{color:var(--accent-deep);font-weight:400}
.side-foot{display:flex;gap:2px;padding:6px 0 10px;flex-shrink:0}

/* middle: the title row, and under it the card */
.main{flex:1 1 0;min-width:0;display:flex;flex-direction:column;padding:8px 16px 14px}
.sided .main{padding-left:8px}
.top{display:flex;align-items:center;gap:6px;height:var(--row);padding-left:32px;flex-shrink:0}   /* clear of the corner button */
.sided .top{padding-left:2px}
h1{font:600 16px/1.4 var(--sans);letter-spacing:.05em;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{color:var(--text-500);font-size:13px;margin-right:-2px;white-space:nowrap}
.status{display:flex;align-items:center;gap:8px;margin-left:12px;font-size:13px;color:var(--text-400);white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--text-500)}
.status.ok i{background:#788C5D}
.status.busy i{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
/* the model loading: the dot stretches into a hairline bar that fills as the service reports how far it has got */
.status.load i{width:104px;height:4px;flex-shrink:0;border-radius:2px;background:var(--bg-400);position:relative;overflow:hidden}
.status.load i::after{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--p,0)*100%);border-radius:2px;background:var(--accent);transition:width .6s linear}
.status.load span{font-variant-numeric:tabular-nums}
@keyframes pulse{50%{opacity:.3}}
#toggle-list{margin:0 -7px 0 8px}
.box{flex:1;min-height:0;display:flex;margin-top:8px;border:.5px solid var(--hair);border-radius:12px;overflow:hidden}
/* the picture's part: all of the card's width but what the captions take. 400 is the least the film's controls stand in one row in;
   in a card too narrow for both at their ease the captions give way first, down to their own least */
.fit{flex:1 1 640px;min-width:400px;position:relative}
iframe{width:100%;height:100%;border:0;display:block}
/* the film asked for everything (its 网页全屏 or 全屏, html.full in the film): the frame takes the whole window, over all the rest */
.wide iframe{position:fixed;inset:0;z-index:40}
/* before a film is in: the place where the picture will be, in the film's own ground colour */
.drop{position:absolute;inset:0;width:100%;height:100%;padding:0 32px;border:0;background:var(--bg-300);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  text-align:center;color:var(--text-400);font-size:14px;transition:background .15s,box-shadow .15s}
.tile{width:44px;height:44px;border-radius:12px;background:var(--accent);display:grid;place-items:center;margin-bottom:14px}
.tile svg{width:17px;height:17px;fill:#fff;margin-left:2px}
.drop strong{font:600 20px/1.5 var(--sans);color:var(--text-100);letter-spacing:.06em}
.loaded .drop,.texting .drop{display:none}
.over .drop{display:flex;background:#F6E9E1;box-shadow:inset 0 0 0 1.5px var(--accent)}
.over.loaded .drop,.over.texting .drop{background:rgba(246,233,225,.95);z-index:2}

/* reading plain text: where the picture would be, the sentence being read, large, with its neighbours faint
   above and below; the controls are the card's bottom row, in the film's own places */
.stage{position:absolute;inset:0;display:none;flex-direction:column}
.texting .stage{display:flex}
.texting iframe{display:none}
.say-now{flex:1;min-height:0;background:var(--bg-200);display:flex;flex-direction:column;overflow:hidden}
.said{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:32px 64px 20px;text-align:center;overflow:hidden}
.said p{margin:0;max-width:30em;overflow-wrap:anywhere}
.said .near{color:var(--text-500);font-size:16px;line-height:1.75;letter-spacing:.05em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-height:1.75em}
.said .cur{color:var(--text-100);font:500 27px/1.75 var(--sans);letter-spacing:.06em}
/* the typing pad: write here, Enter reads it. A white box set into the stage, like the place you type to Claude */
#pad{flex-shrink:0;margin:0 16px 16px;padding:11px 15px;min-height:46px;max-height:9.5em;border:.5px solid var(--hair);border-radius:12px;background:var(--bg-000);color:var(--text-100);
  font:15px/1.7 var(--sans);letter-spacing:.05em;resize:none;outline:0;transition:border-color .12s;scrollbar-width:thin;scrollbar-color:#DDDAD0 transparent}
#pad:focus{border-color:rgba(31,30,29,.32)}
#pad::placeholder{color:var(--text-500)}
#t-seek{-webkit-appearance:none;appearance:none;width:auto;height:4px;margin:19px 16px 0;border-radius:4px;cursor:pointer;flex-shrink:0;
  background:linear-gradient(to right,var(--accent) 0%,var(--accent) var(--p,0%),var(--bg-400) var(--p,0%),var(--bg-400) 100%)}
#t-seek::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:.5px solid rgba(31,30,29,.3);box-shadow:0 1px 2px rgba(0,0,0,.12);transition:transform .1s}
#t-seek:active::-webkit-slider-thumb{transform:scale(1.15)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:15px 16px 14px;flex-shrink:0}
.bar>*{flex-shrink:0;white-space:nowrap}
.tools{display:flex;align-items:center;gap:4px;margin-left:auto}   /* in a narrow window these go to a second row together */
.play{height:30px;min-width:64px;padding:0 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:13.5px;letter-spacing:.06em;margin-right:6px;transition:background .12s,transform .08s}
.play:hover{background:var(--accent-deep)}
.play:active{transform:scale(.98)}
.pos{color:var(--text-400);font-size:13px;margin-left:8px;letter-spacing:.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos b{color:var(--text-100);font-weight:400}
.grow{flex:1}
.texting .say,.texting #toggle-say,.texting #export{display:none}
/* feeling: eight faders in a panel that floats over the controls, like a mixing desk; they act on the sentence being read */
.mix{position:relative;display:inline-flex}
.mix[hidden]{display:none}
.mix-pop{position:absolute;right:0;bottom:calc(100% + 6px);z-index:30;padding:6px 6px 8px;border-radius:12px;background:#fff;border:.5px solid var(--hair);box-shadow:var(--shadow-pop);animation:menu-in-up .12s ease-out}
.mix-pop[hidden]{display:none}
.faders{display:flex;padding:8px 6px 4px}
.fader{display:flex;flex-direction:column;align-items:center;gap:9px;width:48px;cursor:pointer}
.fader output{height:16px;font-size:12px;line-height:16px;letter-spacing:0;color:var(--text-500);font-variant-numeric:tabular-nums}
.fader.on output{color:var(--accent-deep)}
.fader span{font-size:12.5px;letter-spacing:.04em;color:var(--text-300)}
.fader input{-webkit-appearance:none;appearance:none;writing-mode:vertical-lr;direction:rtl;width:4px;height:132px;margin:0;border-radius:4px;cursor:pointer;
  background:linear-gradient(to top,var(--accent) 0%,var(--accent) var(--p,0%),var(--bg-400) var(--p,0%),var(--bg-400) 100%)}
.fader input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:.5px solid rgba(31,30,29,.3);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.mix-foot{display:flex;align-items:center;padding:2px 2px 0}
.btn.ghost[aria-expanded=true]{background:var(--bg-300);color:var(--text-100)}
.zh[data-mood]::after{content:attr(data-mood);margin-left:10px;color:var(--accent-deep);font-size:12px;font-weight:400;letter-spacing:.03em;white-space:nowrap}

/* right: the captions, the card's second part, away until asked for. As tall as the picture's part; the list scrolls inside */
aside{display:none;flex:0 8 360px;min-width:280px;flex-direction:column;min-height:0;border-left:.5px solid var(--hair)}
.listing aside{display:flex}
.head{display:flex;align-items:center;gap:8px;height:var(--row);padding:0 8px 0 18px;flex-shrink:0;box-shadow:0 .5px 0 transparent;transition:box-shadow .15s;position:relative;z-index:1}
.scrolled .head{box-shadow:0 .5px 0 var(--hair)}
h2{font-size:14px;font-weight:600;margin:0;letter-spacing:.06em}
.count{flex:1;color:var(--text-500);font-size:13px;margin-left:2px}
.btn{height:30px;padding:0 12px;border-radius:8px;font-size:13.5px;letter-spacing:.06em;border:0;transition:background .12s,transform .08s,opacity .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--text-100);color:var(--bg-000)}
.btn.primary:hover{background:var(--text-300)}
.btn.primary:disabled{opacity:.3;cursor:default;transform:none}
.btn.ghost{background:none;color:var(--text-400)}
.btn.ghost:hover{background:var(--bg-300);color:var(--text-100)}
.btn.ghost[aria-pressed=true]{color:var(--text-100)}
ol{list-style:none;margin:0;padding:2px 8px 24px;overflow:auto;flex:1;scrollbar-width:thin;scrollbar-color:#DDDAD0 transparent}
li{display:grid;grid-template-columns:24px 1fr 8px;gap:0 10px;padding:10px 10px 11px 4px;margin-bottom:1px;border-radius:8px;cursor:pointer;transition:background .12s}
li:hover{background:var(--bg-200)}
li:active{background:var(--bg-300)}
.no{color:var(--text-500);font-size:12px;line-height:24px;letter-spacing:0;text-align:right;font-variant-numeric:tabular-nums}
.zh{color:var(--text-300);font-size:15px;line-height:24px;letter-spacing:.05em}
.say{grid-column:2;color:var(--text-400);font-size:13px;line-height:1.65;letter-spacing:.03em;margin-top:3px}
.hide-say .say{display:none}
.dot{width:6px;height:6px;border-radius:50%;margin-top:9px}
li.now,li.now:hover{background:var(--bg-300)}
li.now .zh{color:var(--text-100);font-weight:500}
li.now .no{color:var(--accent-deep)}
li.wait .dot{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
li.part{grid-template-columns:24px 1fr;padding:24px 10px 6px 4px;color:var(--text-400);font-size:12.5px;line-height:24px;letter-spacing:.08em}
li.part:first-child{padding-top:8px}
li.part:hover,li.part:active{background:none;color:var(--text-100)}
li.part .no{color:var(--accent-deep)}
.empty{color:var(--text-400);padding:6px 10px;font-size:13.5px;line-height:1.9}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--bg-000);border:.5px solid var(--hair);border-radius:12px;padding:10px 14px 10px 16px;font-size:13.5px;
  display:flex;gap:14px;align-items:center;max-width:80vw;box-shadow:var(--shadow-pop);animation:rise .18s ease-out}
@keyframes rise{from{opacity:0;transform:translate(-50%,6px)}}
.toast[hidden]{display:none}
.toast button{border:0;background:none;color:var(--accent-deep);font-size:13.5px;padding:2px 6px;border-radius:6px;white-space:nowrap}
.toast button:hover{background:var(--bg-300)}
.toast button[hidden]{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="sided">
<button class="btn ghost icon" id="toggle-side" type="button" aria-pressed="true" aria-label="侧边栏" title="侧边栏"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6.5 3v10"/></svg></button>
<nav class="side" id="side" aria-label="讲解和章节">
  <div class="side-head"><div class="tabs" id="tabs" role="tablist"><button type="button" role="tab" data-tab="files" aria-selected="true">文件</button><button type="button" role="tab" data-tab="chapters" aria-selected="false">章节</button></div></div>
  <div class="pane" id="pane-files">
    <div class="rows" id="shelf"></div>
    <div class="side-foot"><button class="btn ghost" id="open-file" type="button">打开文件</button><button class="btn ghost" id="open-pad" type="button">打字板</button></div>
  </div>
  <div class="pane" id="pane-chapters" hidden><div class="rows parts" id="parts"></div></div>
</nav>
<div class="main" id="main">
  <header class="top">
    <h1 id="title">朗读器</h1>
    <span class="field">音色</span><select id="voice" hidden></select>
    <div class="status" id="status"><i></i><span>正在连接…</span></div>
    <button class="btn ghost icon" id="toggle-list" type="button" aria-pressed="false" aria-label="字幕列表" title="字幕列表"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M9.5 3v10"/></svg></button>
  </header>
  <div class="box" id="box">
  <div class="fit" id="fit">
    <iframe id="film" title="讲解"></iframe>
    <div class="drop" id="drop">
      <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17l14-8.5z"/></svg></span>
      <strong>选一个文件，或把它拖进来</strong>
    </div>
    <input id="pick" type="file" accept=".html,.htm,.txt,.md" hidden>
    <div class="stage" id="stage">
      <div class="say-now">
        <div class="said"><p class="near" id="say-prev"></p><p class="cur" id="say-cur"></p><p class="near" id="say-next"></p></div>
        <textarea id="pad" rows="1" placeholder="输入文字，回车朗读" aria-label="打字板"></textarea>
      </div>
      <input id="t-seek" type="range" min="0" max="1000" value="0" aria-label="朗读进度">
      <div class="bar">
        <button class="play" id="t-play" type="button">朗读</button>
        <button class="btn ghost" id="t-prev" type="button">上一句</button>
        <button class="btn ghost" id="t-next" type="button">下一句</button>
        <span class="pos" id="t-pos"></span>
        <span class="tools">
        <span class="mix" id="mix">
          <button class="btn ghost" id="t-mood" type="button" aria-haspopup="dialog" aria-expanded="false">情感</button>
          <div class="mix-pop" id="mix-pop" hidden>
            <div class="faders" id="faders"></div>
            <div class="mix-foot"><button class="btn ghost" id="mood-all" type="button">全部句子都用这组</button><span class="grow"></span><button class="btn ghost" id="mood-reset" type="button">复位</button></div>
          </div>
        </span>
        <span class="field">语言</span><select id="t-lang" hidden><option value="auto">自动</option><option value="zh">中文</option><option value="ja">日语</option><option value="en">英语</option></select>
        <select id="t-speed" hidden><option value="0.8">0.8×</option><option value="1" selected>1.0×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select>
        <button class="btn ghost" id="t-close" type="button">换一段</button>
        </span>
      </div>
    </div>
  </div>
  <aside id="panel">
    <div class="head">
      <h2 id="list-title">字幕</h2><span class="count" id="count"></span>
      <button class="btn ghost" id="toggle-say" type="button" aria-pressed="true">译文</button>
      <button class="btn primary" id="export" type="button" disabled>提取字幕</button>
    </div>
    <ol id="lines"></ol>
  </aside>
  </div>
</div>
<div class="toast" id="toast" hidden><span></span><button type="button" id="reveal">打开文件夹</button></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const frame = $('film'), list = $('lines'), statusEl = $('status');
const post = (path, body) => fetch(path, { method: 'POST', body: JSON.stringify(body || {}) }).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(new Error(e.error || r.status))));
const SANS = getComputedStyle(document.documentElement).getPropertyValue('--sans').trim();
let film = null, rows = {}, listed = '', service = { ready: false }, name = '';
// what the voice reads carries pronunciation notes like <数|かず>; show the plain words
const plain = s => (s || '').replace(/<([^|<>]+)\|[^<>]+>/g, '$1');

function say(kind, text, tip) { statusEl.className = 'status ' + kind; statusEl.lastElementChild.textContent = text; statusEl.title = tip || ''; statusEl.style.setProperty('--p', service.progress || 0); }

/* ---- menus. A native <select> opens the system's list, which looks nothing like the rest of the window.
   menu() leaves the select in the page as the source of truth and puts a quiet trigger and a popover in its place.
   The same styles and code serve this window and the film inside the frame. */
const MENU_CSS = `
.menu{position:relative;display:inline-flex}
.menu-trigger{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 10px;border:0;border-radius:8px;background:none;color:#3D3D3A;font:inherit;font-size:13.5px;letter-spacing:.04em;cursor:pointer;transition:background .12s}
.menu-trigger:hover,.menu-trigger[aria-expanded=true]{background:#F0EEE6;color:#141413}
.menu-trigger svg{width:12px;height:12px;fill:none;stroke:#9C9A92;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.menu-trigger[aria-expanded=true] svg{transform:rotate(180deg)}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:176px;padding:6px;border-radius:12px;background:#fff;border:.5px solid rgba(31,30,29,.15);
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.09);transform-origin:top right;animation:menu-in .12s ease-out}
.menu-pop.up{top:auto;bottom:calc(100% + 6px);transform-origin:bottom right;animation-name:menu-in-up}
.menu-pop[hidden]{display:none}
@keyframes menu-in{from{opacity:0;transform:translateY(-4px) scale(.98)}}
@keyframes menu-in-up{from{opacity:0;transform:translateY(4px) scale(.98)}}
.menu-item{display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%;padding:7px 10px;border:0;border-radius:8px;background:none;color:#141413;font:inherit;font-size:13.5px;letter-spacing:.04em;text-align:left;white-space:nowrap;cursor:pointer}
.menu-item:hover,.menu-item:focus-visible{background:#F5F4ED;outline:0}
.menu-item:active{background:#F0EEE6}
.menu-item svg{width:14px;height:14px;fill:none;stroke:#C6613F;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
`;
function menu(select, { up = false } = {}) {
  const doc = select.ownerDocument, make = (tag, props) => Object.assign(doc.createElement(tag), props);
  const wrap = make('span', { className: 'menu' });
  const trigger = make('button', { type: 'button', className: 'menu-trigger' });
  const pop = make('div', { className: 'menu-pop' + (up ? ' up' : ''), hidden: true });
  trigger.setAttribute('aria-haspopup', 'listbox'); pop.setAttribute('role', 'listbox');
  select.hidden = true; select.style.display = 'none'; select.after(wrap); wrap.append(trigger, pop);
  const close = () => { pop.hidden = true; trigger.setAttribute('aria-expanded', 'false'); };
  function draw() {
    const chosen = select.options[select.selectedIndex];
    trigger.textContent = chosen ? chosen.text : '';
    trigger.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>');
    pop.textContent = '';
    for (const option of select.options) {
      const item = make('button', { type: 'button', className: 'menu-item', textContent: option.text });
      item.setAttribute('role', 'option'); item.setAttribute('aria-selected', String(option.selected));
      if (option.selected) item.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5 6.5 12 13 4.5"/></svg>');
      item.addEventListener('click', () => {
        close(); trigger.focus();
        if (select.value !== option.value) { select.value = option.value; select.dispatchEvent(new Event('change', { bubbles: true })); }
        draw();
      });
      pop.append(item);
    }
  }
  function open() { draw(); pop.hidden = false; trigger.setAttribute('aria-expanded', 'true'); (pop.querySelector('[aria-selected=true]') || pop.querySelector('.menu-item'))?.focus(); }
  trigger.addEventListener('click', () => (pop.hidden ? open() : close()));
  doc.addEventListener('pointerdown', e => { if (!wrap.contains(e.target)) close(); });
  doc.defaultView.addEventListener('blur', close);            // a click in the other document (the film, or this window) lands here
  wrap.addEventListener('keydown', e => {
    const items = [...pop.querySelectorAll('.menu-item')], at = items.indexOf(doc.activeElement);
    if (e.key === 'Escape' && !pop.hidden) { close(); trigger.focus(); e.stopPropagation(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); e.stopPropagation();                // the film uses the arrow keys to seek
      if (pop.hidden) open(); else items[(at + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length].focus();
    }
  });
  draw();
  return { refresh: draw };
}
/* ---- the typeface. The user asked for the face closest to PingFang, which itself is Apple's and not ours to ship.
   HarmonyOS Sans SC carries Chinese and kana; Inter, close to Apple's SF, carries Latin letters and digits only
   (its range stops at Latin-1 so that Chinese punctuation stays with the Chinese face).
   The files come from the voice service at /fonts/; the same rules go into the film so its picture uses them too. */
/* One rule pair per weight: the Chinese face first, then Inter over it for its range. The pairs must carry the same
   weight, or the browser treats them as different faces and never reaches Inter. */
const FONT_CSS = `
@font-face{font-family:"Learn Sans";font-weight:400;src:url("/fonts/harmonyos-sans-sc/HarmonyOS_Sans_SC_Regular.ttf") format("truetype")}
@font-face{font-family:"Learn Sans";font-weight:400;src:url("/fonts/inter/inter-latin-wght-normal.woff2") format("woff2");unicode-range:U+0020-007E,U+00A0-00FF}
@font-face{font-family:"Learn Sans";font-weight:500;src:url("/fonts/harmonyos-sans-sc/HarmonyOS_Sans_SC_Medium.ttf") format("truetype")}
@font-face{font-family:"Learn Sans";font-weight:500;src:url("/fonts/inter/inter-latin-wght-normal.woff2") format("woff2");unicode-range:U+0020-007E,U+00A0-00FF}
@font-face{font-family:"Learn Sans";font-weight:600 700;src:url("/fonts/harmonyos-sans-sc/HarmonyOS_Sans_SC_Bold.ttf") format("truetype")}
@font-face{font-family:"Learn Sans";font-weight:600 700;src:url("/fonts/inter/inter-latin-wght-normal.woff2") format("woff2");unicode-range:U+0020-007E,U+00A0-00FF}
`;
/* A canvas does not fetch a web font by naming it: ask for each weight outright, then have the picture drawn again. */
const loadFace = doc => Promise.allSettled([400, 500, 700].flatMap(w => [doc.fonts.load(`${w} 40px "Learn Sans"`, '字'), doc.fonts.load(`${w} 40px "Learn Sans"`, 'A1')]));
document.head.append(Object.assign(document.createElement('style'), { textContent: FONT_CSS + MENU_CSS }));
loadFace(document);
const voiceMenu = menu($('voice'));

/* The film brings its own dark page around the player. Inside the reader it loses all of that and becomes the picture's
   part of the card: header, footer and its own chapter list go (the sidebar lists the chapters), the player fills the frame
   from edge to edge, the picture takes all of it above the controls and the film fits itself into that (its player centres
   the 16:9 drawing on its own ground colour), and the controls, recoloured for a light ground, are the bottom row.
   With the picture alone (html.full: 网页全屏 or 全屏) the film keeps its own dark controls. */
const LIGHT = 'html:not(.full) .player:not(:fullscreen)';   // :fullscreen is for films built before html.full, which put the player itself on the screen
const EMBED = `
:root{color-scheme:light;--page:#FAF9F5;--panel:#FAF9F5;--line:#E8E6DC;--text:#141413;--muted:#73726C}

.stage{flex:1 1 0;min-height:0;aspect-ratio:auto}

${LIGHT} input[type=range]{background:linear-gradient(to right,#D97757 0%,#D97757 var(--p,0%),#E8E6DC var(--p,0%),#E8E6DC 100%)}
${LIGHT} input[type=range]::-webkit-slider-thumb{width:14px;height:14px;background:#fff;border:.5px solid rgba(31,30,29,.3);box-shadow:0 1px 2px rgba(0,0,0,.12);transition:transform .1s}
${LIGHT} input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}

${LIGHT} .play:hover{background:#C6613F}
${LIGHT} .play:active{transform:scale(.98)}
${LIGHT} .quiet{height:30px;padding:0 10px;border-radius:8px;color:#73726C;font-size:13.5px;transition:background .12s,color .12s}
${LIGHT} .quiet:hover{background:#F0EEE6;color:#141413}
${LIGHT} #captions[aria-pressed=true]{color:#141413}
${LIGHT} #captions[aria-pressed=false]{color:#B0AEA5}
${LIGHT} .clock{color:#73726C;margin-left:8px;font-family:inherit;font-size:13px;letter-spacing:.03em;font-variant-numeric:tabular-nums}
${LIGHT} .clock b{color:#141413}
` + FONT_CSS + MENU_CSS + `
.full .menu-trigger{color:#B8B4A8}
.full .menu-trigger:hover,.full .menu-trigger[aria-expanded=true]{background:#2E2C28;color:#fff}
`;

/* ---- the window's parts. The stylesheet lays them out: the picture's part is whatever the sidebar and the captions leave,
   and the film in it fits itself. No sizes are worked out here, with one exception. Opening the captions should not make the
   picture smaller, so the window is asked to grow to the right by their width, less the room there already is beside the
   picture, and to give that back when they are closed. A window that cannot grow (maximized, at the screen's edge, a browser
   tab) stays as it is, and the picture is fitted into what is left. */
const PANEL = 360, BELOW = 84;   // the captions' width; the height of a film's controls, for when no film is in to be measured
let sideOn = true, tab = 'files', listing = false, grown = 0, moving = false;
function showSide() {
  document.body.classList.toggle('sided', sideOn);
  $('toggle-side').setAttribute('aria-pressed', String(sideOn));
  for (const b of $('tabs').children) b.setAttribute('aria-selected', String(b.dataset.tab === tab));
  $('pane-files').hidden = tab !== 'files'; $('pane-chapters').hidden = tab !== 'chapters';
  if (sideOn && tab === 'files') stock();
}
$('toggle-side').addEventListener('click', () => { sideOn = !sideOn; showSide(); });
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { tab = b.dataset.tab; showSide(); } });
// bring a row into sight by scrolling its own list and nothing else: scrollIntoView would move the page too while a list is partly outside the window
function reveal(box, row, smooth) {
  const b = box.getBoundingClientRect(), r = row.getBoundingClientRect();
  const by = r.top < b.top ? r.top - b.top - 4 : r.bottom > b.bottom ? r.bottom - b.bottom + 4 : 0;
  if (by && b.height) box.scrollBy({ top: by, behavior: smooth ? 'smooth' : 'auto' });
}
// the room beside the picture: its part is as wide as the window leaves it, the picture as wide as the height above the controls allows
function spare() {
  const box = $('fit'), d = film && !film.isText && frame.contentDocument, controls = d && d.querySelector('.controls');
  return Math.max(0, box.clientWidth - Math.round((box.clientHeight - (controls ? controls.offsetHeight : BELOW)) * 16 / 9));
}
/* Ask the window to move its right edge by so many pixels. Only the app's own window can (Host in app.py); anything else stays
   as it is. Resolves once the page has its new width, with how far the edge went: the window's own figure, which may be a
   fraction of a pixel off the page's, so that giving the same back later puts the edge exactly where it was. */
async function widen(by) {
  const api = window.pywebview && window.pywebview.api, before = innerWidth;
  if (!by || !api || !api.widen) return 0;
  let went = 0;
  try { went = await api.widen(by, devicePixelRatio); } catch (e) { /* the window is as it was */ }
  for (let i = 0; went && innerWidth === before && i < 40; i++) await new Promise(next => setTimeout(next, 10));
  return went;
}
async function showList(on) {
  if (moving || on === listing) return;
  moving = true; listing = on;
  $('toggle-list').setAttribute('aria-pressed', String(on));
  const main = $('main'), by = on ? Math.max(0, PANEL - spare()) : -grown;
  // the column is held at the width it is to end with while the window follows, so that the picture is laid out once and not twice
  main.style.flex = `0 0 ${main.offsetWidth + (on ? by : 0)}px`;
  if (on) document.body.classList.add('listing');
  const went = await widen(by);
  if (!on) document.body.classList.remove('listing');
  main.style.flex = ''; grown = on ? Math.max(0, went) : 0; moving = false;
  const now = on && list.querySelector('.now'); if (now) reveal(list, now);
}
$('toggle-list').addEventListener('click', () => showList(!listing));

/* ---- the sidebar's first tab: dist as a file tree, the way the service lists it — folders, and the HTML files in them.
   A folder's row opens and shuts it; an HTML's row loads it. Asked for again every few seconds while the tab is in sight, so
   what was just built turns up by itself. source is the file the film in the frame was loaded from, when it came from here. */
let shelf = [], shelfKey = '', source = null;
const openDirs = new Set();   // the folders standing open, by path
const ARROW = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>';
const sorted = items => items.sort((a, b) => !a.items - !b.items || a.name.localeCompare(b.name, 'zh', { numeric: true })).map(e => (e.items ? { ...e, items: sorted(e.items) } : e));   // folders first
function drawShelf(focus) {
  const pane = $('shelf'), top = pane.scrollTop;
  pane.textContent = '';
  if (!shelf.length && shelfKey) pane.innerHTML = '<div class="empty">dist 里没有 HTML</div>';
  pane.classList.toggle('deep', shelf.some(e => e.items));
  (function draw(items, depth) {
    for (const e of items) {
      const row = Object.assign(document.createElement('button'), { type: 'button', innerHTML: (e.items ? ARROW : '') + '<span></span>' });
      row.style.paddingLeft = 10 + depth * 14 + 'px'; row.dataset.path = e.path;
      row.lastChild.textContent = e.items ? e.name : e.name.replace(/\.html?$/i, '');
      pane.append(row);
      if (e.items) {
        const open = openDirs.has(e.path);
        row.className = 'dir'; row.setAttribute('aria-expanded', String(open));
        row.addEventListener('click', () => { if (open) openDirs.delete(e.path); else openDirs.add(e.path); drawShelf(e.path); });
        if (open) draw(e.items, depth + 1);
        continue;
      }
      const on = !!source && source.file === e.path;
      row.setAttribute('aria-current', String(on));
      if (on && source.modified == null) source.modified = e.modified;   // it came in by the command line: this is the build that was loaded
      if (on && source.modified !== e.modified) { row.className = 'fresh'; row.title = '重新打包过，点一下载入新的'; }
      row.addEventListener('click', click => { if (click.detail) row.blur(); pick(e); });   // a click leaves the keys with the film; a row reached by keyboard keeps the focus
    }
  })(shelf, 0);
  pane.scrollTop = top;
  if (focus) for (const row of pane.children) if (row.dataset.path === focus) row.focus();   // the rows are new ones: the folder just opened or shut keeps the focus
}
async function stock() {
  try {
    const tree = await fetch('/films').then(r => r.json()), key = JSON.stringify(tree);
    if (key === shelfKey) return;
    shelfKey = key; shelf = sorted(tree); drawShelf();
  } catch (e) { /* no service: the tree stays as it was */ }
}
setInterval(() => { if (sideOn && tab === 'files' && !document.hidden) stock(); }, 3000);
async function pick(e) {
  const at = source && source.file === e.path && film && !film.isText ? film.time : 0;   // the same lecture, built again: carry on from the same spot
  try {
    const r = await fetch('/film/' + e.path.split('/').map(encodeURIComponent).join('/'));
    if (!r.ok) throw new Error(r.status);
    load(await r.text(), e.name, at);
    source = { file: e.path, modified: e.modified }; drawShelf();
  } catch (err) { tell('这个文件打不开，可能刚被删掉或者改了名'); stock(); }
}

// ---- loading a film: the file is shown in the frame as is; its own player keeps the time and draws, dubFilm() below gives it the voice
const NO_PARTS = '<div class="empty">没有章节</div>';
function clear() {              // back to nothing loaded, whichever kind was in
  if (film && film.stop) film.stop();
  film = null; rows = {}; source = null;
  document.body.classList.remove('loaded', 'texting', 'wide'); $('export').disabled = true; $('count').textContent = ''; $('list-title').textContent = '字幕';
  $('title').textContent = '朗读器'; list.textContent = ''; $('parts').innerHTML = NO_PARTS; drawShelf();
}
function load(text, fileName, at = 0) {
  clear(); name = fileName.replace(/\.html?$/i, '');
  frame.onload = () => {
    const w = frame.contentWindow;
    if (!w.film || !w.film.timeline) { $('title').textContent = `${fileName} 不是 Learn 做的讲解，里面找不到播放器`; return; }
    // A bridge also works with previously built standalone films: their timeline stays the owner of visual timing.
    w.document.head.appendChild(Object.assign(w.document.createElement('script'), { textContent: `
      if (typeof V !== 'undefined' && typeof SCRIPT !== 'undefined') {
        window.readerSpeech = { gaps: {}, options: Object.fromEntries(SCRIPT.flatMap(sc => sc.lines.map(([k,t,o={}]) => [k,o]))) };
        const originalTimeline = V.buildTimeline;
        V.buildTimeline = (script, durations, lang) => originalTimeline(script.map(sc => ({...sc, lines: sc.lines.map(([k,t,o={}]) =>
          [k,t,window.readerSpeech.gaps[k] === undefined ? o : {...o,gap:window.readerSpeech.gaps[k]}])})), durations, lang);
      }
    ` }));
    film = w.film.retime ? dubFilm(w.film, w.readerSpeech) : w.film;
    w.document.head.appendChild(Object.assign(w.document.createElement('style'), { textContent: EMBED }));
    const speed = w.document.getElementById('speed');
    if (speed) menu(speed, { up: true });
    document.body.classList.add('loaded');
    $('title').textContent = w.document.title || name;
    w.document.getElementById('seek').addEventListener('change', () => film.play());   // picking a spot on the film's own timeline also starts the reading
    w.document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('over'); });
    w.document.addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('over'); dropped(e.dataTransfer); });
    w.document.addEventListener('paste', pasted);
    // the film showing its picture alone (html.full, for 网页全屏 and 全屏): the frame gets the whole window for as long as it does
    const root = w.document.documentElement;
    new MutationObserver(() => document.body.classList.toggle('wide', root.classList.contains('full'))).observe(root, { attributes: true, attributeFilter: ['class'] });
    fill();
    if (at) film.seek(Math.min(at, film.duration));
    loadFace(w.document).then(() => { if (film && film.redraw) film.redraw(); });
  };
  frame.srcdoc = text;
}
function take(file) { if (file) file.text().then(text => (/\.html?$/i.test(file.name) ? load : read)(text, file.name)); }
function dropped(data) { if (data.files.length) take(data.files[0]); else read(data.getData('text/plain')); }
function pasted(e) {
  if (e.target.closest && e.target.closest('input:not([type=range]),textarea,[contenteditable]')) return;
  const text = e.clipboardData.getData('text/plain');
  if (text.trim()) { e.preventDefault(); read(text); }
}

/* ---- voicing a film. The film in the frame keeps the clock and draws; it makes no sound and knows no service.
   dubFilm() does that part from out here and hands the film back with the voice added: the same face textFilm()
   has below (lang, spoken, live, holding, revoice…), so the list, the status line and the voice menu work on it.
   It reads in the language of the service's current voice when the film carries that language, else in the film's
   own (base). On load it only asks which lines the service has voiced before. Once the viewer has pressed play or
   picked a spot it asks for the missing ones; each real length goes back to the film, which lays its timeline out
   again (retime), and the film's clock is kept out of the first line still without sound (gate). With no service
   there is no gate: the film plays silent, on estimated timing. */
function speechGroups(lines, config = service.speech || { sentences: 2, max_chars: 120 }) {
  const groups = [], count = t => (t.match(/[\p{L}\p{N}_]/gu) || []).length;
  for (const line of lines) {
    const block = groups[groups.length - 1], prev = block && block[block.length - 1];
    const same = prev && !prev.para && !prev.break_after && prev.lang === line.lang && prev.scene === line.scene
      && JSON.stringify(prev.mood || null) === JSON.stringify(line.mood || null)
      && Math.min(count(prev.text), count(line.text)) >= 6;
    if (same && block.length < config.sentences && block.reduce((n,x) => n+x.text.length,0)+line.text.length <= config.max_chars) block.push(line);
    else groups.push([line]);
  }
  return groups;
}
async function requestSpeech(lines, voiceId) {
  return (await post('/speak', {lang: lines[0].lang, lines, voice_id: voiceId})).clips;
}
function dubFilm(inner, bridge) {
  const all = inner.texts, base = inner.base;
  let lang = base, texts = all[lang] || {}, dur = { ...inner.durations }, clips = { ...inner.audio };   // the clips a film brings with it speak base
  let live = false, started = false, busy = false, gen = 0, seen = inner.time, sounds = {}, current = null, units = [], voiceId = null, meta = {};
  const missing = c => texts[c.key] && !clips[c.key];
  const accept = (key, clip) => {
    clips[key] = `/audio/${clip.fp}.mp3`; dur[key] = clip.seconds; meta[key] = clip;
    if (bridge) {
      const o = bridge.options[key] || {};
      if (clip.continuous) bridge.gaps[key] = 0;
      else if (o.gap === undefined) bridge.gaps[key] = clip.gap;
      else delete bridge.gaps[key];
    }
  };
  const retime = () => { inner.retime(dur, lang); seen = inner.time; };
  function hush() { if (current) { current.el.pause(); current = null; } }
  // read in this language, with nothing but what the film brought: clips fetched from the service are dropped
  function forget(to) { hush(); lang = to; texts = all[lang] || {}; sounds = {}; meta = {}; if (bridge) bridge.gaps = {}; dur = lang === base ? { ...inner.durations } : {}; clips = lang === base ? { ...inner.audio } : {}; retime(); }
  /* Is the service there, what language does its voice speak, which lines has it already voiced? Synthesizes nothing. */
  async function connect() {
    if (!Object.values(all).some(texts => Object.keys(texts).length)) return;
    const mine = gen;
    try {
      const status = await fetch('/status', { signal: AbortSignal.timeout(1500) }).then(r => r.json());
      if (mine !== gen) return;
      const to = Object.keys(all[status.lang] || {}).length ? status.lang : base;
      if (to !== lang) forget(to);
      voiceId = status.voice_id;
      const cues = inner.timeline.cues;
      const lines = cues.filter(c => texts[c.key]).map(c => {
        const i = cues.indexOf(c), next = cues[i+1], o = bridge && bridge.options[c.key] || {};
        return {key:c.key, text:texts[c.key], lang, scene:c.scene,
          break_after: !bridge || !!o.min || (o.gap !== undefined && o.gap > 0) || !next || !texts[next.key]
            || next.scene !== c.scene || !!(bridge.options[next.key] || {}).min};
      });
      units = speechGroups(lines, bridge ? status.speech : {sentences:1,max_chars:120});
      if (!lines.length) return;
      const have = await post('/cached', { lang, lines });
      if (mine !== gen) return;                           // the voice changed again while we were asking
      for (const key in have) accept(key, have[key]);
      live = true; retime();
    } catch (e) { /* no service: the film plays silent on estimated timing */ }
  }

  const marks = [...piece.matchAll(/[，、,：:]\s*|\s+/g)].map(m => m.index + m[0].length).filter(i => i > 6 && i < piece.length - 6);

  if (!film) { say(...idle()); return; }
  if (film.isText) paint();
  const cues = film.timeline.cues, t = film.time;
  if (!cues.length) { say(...idle()); return; }   // the pad, nothing written yet
  if (!film.isText && film.lang !== listed) fill();   // the voice now reads the film's text in another language: show that one beside the captions
  const now = [...cues].reverse().find(c => c.s <= t + 0.02);
  let voiced = 0, readable = 0;
  for (const c of cues) {
    const li = rows[c.key]; if (!li) continue;
    readable += !!film.spoken[c.key]; voiced += c.voiced;
    const isNow = now === c;
    if (isNow && !li.classList.contains('now')) reveal(list, li, true);
    li.classList.toggle('now', isNow);
    li.classList.toggle('wait', isNow && film.holding);
  }
  // the chapter being played, in the sidebar: the last one begun, the first before any has, as in the film's own list
  let part = null;
  for (const sc of film.timeline.scenes || []) if (sc.chapter && (!part || sc.s <= t + 0.01)) part = sc;
  for (const row of $('parts').querySelectorAll('button')) {
    const on = String(part.id === row.dataset.scene);
    if (row.getAttribute('aria-current') === on) continue;
    row.setAttribute('aria-current', on); if (on === 'true') reveal($('parts'), row);
  }
  if (!readable && !voiced) say('', '这份讲解没有配音译文，只能看');
  else if (!service.ready && voiced < cues.length) say(...waiting());
  else if (film.holding) say('busy', '正在准备这一句');
  else if (!film.live && voiced < cues.length) say('', '配音服务没有连上');
  else say('ok', voiced < cues.length ? `已备好 ${voiced} / ${cues.length} 句` : `${cues.length} 句都已备好`);
}
setInterval(watch, 250);

// ---- the service: is the model up, which voices are there
async function poll() {
  try {
    const s = await fetch('/status').then(r => r.json());
    const first = !service.voices, sel = $('voice');
    service = s;
    $('mix').hidden = s.moods === false;   // the model in use has no emotion to set: the faders go away
    if (first || sel.options.length !== s.voices.length || sel.value !== s.voice) {
      sel.textContent = '';
      for (const v of s.voices) sel.add(new Option(v, v));
      sel.value = s.voice;
      voiceMenu.refresh();
    }
    // a lecture named on the command line. One out of dist comes with its file name, and is marked in the sidebar like one picked there
    if (first && s.opened) fetch('/opened').then(r => r.text()).then(text => {
      const file = typeof s.opened === 'string' ? s.opened : '', at = file.split('/');
      load(text, at.pop() || '讲解.html');
      if (!file) return;
      at.forEach((dir, i) => openDirs.add(at.slice(0, i + 1).join('/')));   // the folders it lies in stand open
      source = { file }; drawShelf();
    });
  } catch (e) { service = { ready: false, voices: service.voices }; }
}
(function again() { poll().finally(() => setTimeout(again, service.progress != null ? 500 : 2000)); })();   // asked more often while the model loads, so the bar moves
$('voice').addEventListener('change', async e => {
  Object.assign(service, await post('/voice', { name: e.target.value }));
  if (film) film.revoice();
});
addEventListener('pagehide', () => navigator.sendBeacon('/bye', '{}'));

// ---- pulling the captions out
const stamp = t => { const ms = Math.round(t * 1000), p = (n, w = 2) => String(n).padStart(w, '0'); return `${p(Math.floor(ms / 3600000))}:${p(Math.floor(ms / 60000) % 60)}:${p(Math.floor(ms / 1000) % 60)},${p(ms % 1000, 3)}`; };
function tell(text, folder = false) {      // a short word at the bottom; folder adds the button that opens out\subtitles
  const toast = $('toast');
  toast.firstElementChild.textContent = text; $('reveal').hidden = !folder;
  toast.hidden = false; clearTimeout(toast.timer); toast.timer = setTimeout(() => { toast.hidden = true; }, folder ? 8000 : 4000);
}
$('export').addEventListener('click', async () => {
  const cues = film.timeline.cues;
  const srt = cues.map((c, i) => `${i + 1}\n${stamp(c.s)} --> ${stamp(c.e)}\n${shown(c)}\n`).join('\n');
  const txt = cues.map((c, i) => `${String(i + 1).padStart(2, '0')}\t${shown(c)}\t${plain(film.spoken[c.key])}`).join('\n') + '\n';
  try {
    const { files } = await post('/export', { title: frame.contentDocument.title || name, srt, txt });
    tell(`字幕已存到 ${files.join(' 和 ')}`, true);
    navigator.clipboard.writeText(cues.map(shown).join('\n')).catch(() => {});
  } catch (e) { tell('字幕没存成：' + e.message, true); }
});
$('reveal').addEventListener('click', () => post('/reveal'));
$('toggle-say').addEventListener('click', e => { const hidden = list.classList.toggle('hide-say'); e.currentTarget.setAttribute('aria-pressed', String(!hidden)); });

// ---- dropping and picking
$('parts').innerHTML = NO_PARTS; showSide();
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('over'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('over'); });
addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('over'); dropped(e.dataTransfer); });
addEventListener('paste', pasted);
$('open-file').addEventListener('click', () => $('pick').click());
$('open-pad').addEventListener('click', () => write());
$('pick').addEventListener('change', e => { take(e.target.files[0]); e.target.value = ''; });
/* A key pressed with the focus out here on the page, not on anything of its own, is the film's: the film knows what space,
   the arrows, F, W and C do, but hears them only inside its frame. */
addEventListener('keydown', e => {
  if (!film || film.isText || e.ctrlKey || e.altKey || e.metaKey || e.target.closest('button,input,textarea,select,.menu')) return;
  const w = frame.contentWindow, sent = new w.KeyboardEvent('keydown', { code: e.code, key: e.key, shiftKey: e.shiftKey, bubbles: true, cancelable: true });
  if (!w.document.body.dispatchEvent(sent)) e.preventDefault();
});
</script>
