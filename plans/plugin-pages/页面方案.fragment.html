<style>

<script>
(() => {
  const root = document.getElementById('campus-layout-demo');
  const get = id => root.querySelector('#' + id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const notices = [
    {id:'n1',tab:'campus',title:'周末社区志愿服务招募',source:'钉钉',from:'学院通知群',when:'今天 14:20',today:true,hint:'10月20日 周二 18:00 报名截止',date:'10月24日 周六 09:00—12:00',place:'紫金港校区集合',body:'本周六组织社区志愿服务。请有意参加的同学在周二 18:00 前填写群内报名表，具体分工会在报名结束后通知。',memoTime:'10月20日 18:00 报名截止'},
    {id:'n2',tab:'campus',title:'职业规划讲座开放报名',source:'微信',from:'年级通知群',when:'今天 11:40',today:true,hint:'10月21日 周三 18:30 举行',date:'10月21日 周三 18:30',place:'教学楼报告厅',body:'本次讲座介绍实习准备与职业方向选择。请在群公告中报名，入场前出示报名记录。',memoTime:'10月21日 18:30 活动开始'},
    {id:'n3',tab:'campus',title:'校园植物观察活动',source:'二课',from:'素质拓展平台',when:'今天 10:10',today:true,hint:'10月22日 周四 12:00 报名截止',date:'10月25日 周日 14:00—16:00',place:'校内植物园',body:'活动包含植物辨识和校园生态观察，报名方式与参与要求以素质拓展平台的活动详情为准。',memoTime:'10月22日 12:00 报名截止'},

    {id:'n5',tab:'campus',title:'图书馆部分区域开放时间调整',source:'学校官网',from:'图书馆',when:'昨天 16:00',today:false,hint:'涉及本周末开放安排',date:'10月24日 周六',place:'图书馆部分区域',body:'本周末部分区域进行设施维护，请前往对应区域的同学提前查看开放安排。其他区域正常开放。',memoTime:'10月24日 开放安排调整'},

  }
  function icons() { if (globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:17,height:17}}); }
  function memoItems() { return [...fixedMemos,...state.saved.map(id => { const n=notices.find(x=>x.id===id); return {id:n.id,title:n.title,time:n.memoTime||'未设置时间',source:n.source+' · '+n.from,body:n.body}; })]; }
  function renderMemos() {
    const items=memoItems(); get('ca-memo-count').textContent=String(items.length);
    const selected=items.find(m=>m.id===state.memo);
    get('ca-memo-list').hidden=!!selected; get('ca-memo-detail').hidden=!selected;
    get('ca-memo-list').innerHTML=items.map(m=>`<div class="ca-memo"><button type="button" class="ca-memo-name" data-memo="${m.id}">${esc(m.title)}</button><div class="ca-meta"><span>${esc(m.time)}</span></div><div class="ca-meta"><span>${esc(m.source)}</span></div></div>`).join('');
    if(selected) get('ca-memo-detail').innerHTML=`<button type="button" class="ca-link" data-close-memo>‹ 返回备忘录</button><h3>${esc(selected.title)}</h3><p class="ca-sub">${esc(selected.time)}</p><div class="ca-original"><p>${esc(selected.body)}</p></div><p class="ca-sub">${esc(selected.source)}</p>`;
  }
  function saveButton(n, full=false) {
    const saved=state.saved.includes(n.id);
    return `<button type="button" data-save="${n.id}" data-saved="${saved}" class="${full?'ca-button ca-primary':'ca-save'}" aria-label="${saved?'查看备忘录：':'加入备忘录：'}${esc(n.title)}"><i data-lucide="${saved?'check':'plus'}" aria-hidden="true"></i>${full?(saved?'查看备忘录':'加入备忘录'):''}</button>`;
  }
  function renderFeed() {
    root.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===state.tab)));
    get('ca-notice-panel').setAttribute('aria-labelledby','ca-'+state.tab+'-tab');
    get('ca-filters').hidden=!state.filters;
    get('ca-filter-toggle').setAttribute('aria-expanded',String(state.filters));
    const sources=[...new Set(notices.filter(n=>n.tab===state.tab).map(n=>n.source))];
    if(state.source!=='all'&&!sources.includes(state.source))state.source='all';
    get('ca-source').innerHTML='<option value="all">全部来源</option>'+sources.map(source=>`<option>${esc(source)}</option>`).join('');
    get('ca-source').value=state.source; get('ca-range').value=state.range;
    const selected=notices.find(n=>n.id===state.detail&&n.tab===state.tab);
    get('ca-notice-list').hidden=!!selected; get('ca-notice-detail').hidden=!selected;
    if(selected) {
      get('ca-notice-detail').innerHTML=`<div class="ca-detail"><button type="button" class="ca-link" data-close-detail>‹ 返回${state.tab==='campus'?'校园通知':'个人消息'}</button><h3>${esc(selected.title)}</h3><p class="ca-detail-meta">${esc(selected.source)} · ${esc(selected.from)}<br/>${esc(selected.when)}</p><dl class="ca-facts"><dt>时间</dt><dd>${esc(selected.date)}</dd><dt>地点</dt><dd>${esc(selected.place)}</dd></dl><div class="ca-original"><p class="ca-sub">原始内容 · 示例</p><p>${esc(selected.body)}</p></div><div class="ca-actions">${saveButton(selected,true)}</div></div>`;
    } else {
      const rows=notices.filter(n=>n.tab===state.tab&&(state.source==='all'||n.source===state.source)&&(state.range==='week'||n.today));
      const visible=state.more?rows:rows.slice(0,5);
      get('ca-notice-list').innerHTML=visible.map(n=>`<article class="ca-row"><button type="button" class="ca-open" data-open="${n.id}"><span class="ca-row-title">${state.read.includes(n.id)?'':'<span class="ca-dot" aria-label="未读"></span>'}${esc(n.title)}</span><span class="ca-brief">${esc(n.hint)}</span><span class="ca-meta"><span>${esc(n.source)} · ${esc(n.from)}</span><span>${esc(n.when)}</span></span></button>${saveButton(n)}</article>`).join('')+(rows.length>5?`<button type="button" class="ca-link ca-more" data-more>${state.more?'收起':'查看全部 '+rows.length+' 条'} <span aria-hidden="true">${state.more?'⌃':'⌄'}</span></button>`:'')+(rows.length?'':'<p class="ca-empty">这个范围内没有消息</p>');
    }
  }
  const pluginGroups=[
    {title:'课程与学习',items:[['课程与作业','教务、学在、PTA 与实验课','notebook-pen'],['学习资料','智云、学习通、电子书与论文','book-open'],['课程讲解','把资料做成可观看的讲解','presentation']]},
    {title:'消息与资讯',items:[['校园通知','学校与学院发布的通知','megaphone'],['微信聊天','关注的微信群与个人聊天','messages-square'],['钉钉聊天','关注的钉钉群与个人聊天','messages-square'],['浙大邮箱','连接邮箱，在对话中查信与回复','mail'],['微信公众号','关注的公众号文章','newspaper']]},
    {title:'校园生活',items:[['活动与场馆','二课、活动报名与场馆预约','calendar-check'],['校园社区','CC98 与教师评价','users']]},
    {title:'基础能力',items:[['校园账号','统一身份认证与 WebVPN','key-round'],['网页搜索','查找外部资料','search'],['自动化任务','定时执行已安排的任务','clock'],['语音输入','用语音和助手交流','mic'],['自动授权审查','操作授权设置','shield-check']]}
  ];
  function renderPlugins() {
    get('ca-plugins').innerHTML=`<div class="ca-plugin-grid">${pluginGroups.map(g=>`<section aria-label="${esc(g.title)}"><div class="ca-section-head"><h2>${esc(g.title)}</h2><span class="ca-count">${g.items.length}</span></div>${g.items.map(p=>`<div class="ca-plugin-row"><span class="ca-plugin-icon"><i data-lucide="${p[2]}" aria-hidden="true"></i></span><div class="ca-plugin-copy"><p>${esc(p[0])}</p><span class="ca-sub">${esc(p[1])}</span></div></div>`).join('')}</section>`).join('')}</div><section class="ca-memos" aria-label="完整工作流技能"><h2>技能</h2><div class="ca-skill-list">${['初始化','选课','今日安排','考前准备','交作业','课后总结'].map(s=>`<span class="ca-skill-label">${s}</span>`).join('')}</div></section>`;
  }
  function render() {
    root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    get('ca-page-title').textContent=state.page==='plugins'?'插件':'校园事务';
    get('ca-affairs').hidden=state.page!=='affairs'; get('ca-plugins').hidden=state.page!=='plugins';
    renderMemos(); renderFeed(); renderPlugins(); icons();
  }
  function closeFilters(focusButton=false) {
    state.filters=false;
    get('ca-filters').hidden=true;
    get('ca-filter-toggle').setAttribute('aria-expanded','false');
    if(focusButton) get('ca-filter-toggle').focus({preventScroll:true});
    persist();
  }
  root.addEventListener('click',event=>{
    const b=event.target.closest('button'); if(!b||!root.contains(b)||b.disabled)return;
    get('ca-status').textContent='';
    if(b.dataset.page) {state.page=b.dataset.page;state.filters=false;}
    else if(b.dataset.tab) {state.tab=b.dataset.tab;state.source='all';state.more=false;state.detail=null;state.filters=false;}
    else if(b.dataset.open) {state.detail=b.dataset.open;if(!state.read.includes(state.detail))state.read.push(state.detail);}
    else if(b.hasAttribute('data-close-detail')) state.detail=null;
    else if(b.hasAttribute('data-more')) state.more=!state.more;
    else if(b.id==='ca-filter-toggle') state.filters=!state.filters;
    else if(b.hasAttribute('data-close-filters')) state.filters=false;
    else if(b.dataset.save) {
      if(state.saved.includes(b.dataset.save)) state.memo=b.dataset.save;
      else {state.saved.push(b.dataset.save);state.memo=null;get('ca-status').textContent='已加入左侧备忘录（草图演示）';}
    }
    else if(b.dataset.memo) state.memo=b.dataset.memo;
    else if(b.hasAttribute('data-close-memo')) state.memo=null;
    render(); persist();
    if(b.id==='ca-filter-toggle'&&state.filters) get('ca-source').focus({preventScroll:true});
    else if(b.hasAttribute('data-close-filters')) get('ca-filter-toggle').focus({preventScroll:true});
  });
  root.addEventListener('change',event=>{if(event.target.id==='ca-source')state.source=event.target.value;else if(event.target.id==='ca-range')state.range=event.target.value;else return;state.detail=null;state.more=false;render();persist();});
  document.addEventListener('pointerdown',event=>{if(state.filters&&!get('ca-filter-anchor').contains(event.target))closeFilters();});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.filters){event.preventDefault();closeFilters(true);}});
  document.addEventListener('focusin',event=>{if(state.filters&&!get('ca-filter-anchor').contains(event.target))closeFilters();});
  restore(window.openai?.widgetState); render();
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
  if(globalThis.Tweak) {
    const settings={density:'紧凑'};
    const tweak=new globalThis.Tweak({container:root,onChange:()=>root.style.setProperty('--ca-space',settings.density==='紧凑'?'16px':'23px')});
    tweak.addSelect(settings,'density',{label:'通知行间距',options:['紧凑','舒展']});
  }
})();
</script>
