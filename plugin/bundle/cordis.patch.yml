# ZJU All-in-One Assistant（dsh-zju-assistant）的组合包层：装上以后，profile 把这一层叠在已有的各层后面。
#
# 一行一个子插件，都来自本包依赖的 dsh-zju-campus，顺序就是官方插件页上的顺序（../rows.mjs 是清单，../rows.test.mjs 核对两边一致）。
# 第一行「校园账号」是 dsh-zju-campus 的包根：页面那一半只挂在名字恰好是包名的这一行上，它还提供各子行共用的服务 ctx.zjuCampus，
# 所以它关掉，其余各行都会停下。子行默认关着的，用户在组合包页面上打开，官方把开关记进 profile 自己的 patch。
- insert:
    - id: zju-account
      name: dsh-zju-campus
    - id: zju-courses
      name: dsh-zju-campus/courses
    - id: zju-learn
      name: dsh-zju-campus/learn
      disabled: true
    - id: zju-activities
      name: dsh-zju-campus/activities
    - id: zju-community
      name: dsh-zju-campus/community
    - id: zju-notices
      name: dsh-zju-campus/notices
    - id: zju-mail
      name: dsh-zju-campus/mail
    - id: zju-wechat-chat
      name: dsh-zju-campus/wechat-chat
      disabled: true
    - id: zju-dingtalk
      name: dsh-zju-campus/dingtalk
      disabled: true
    - id: zju-wechat
      name: dsh-zju-campus/wechat
      disabled: true
